name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:
  # Sunday and Tuesday at noon UTC in season (Saturday's games, then the
  # bowls and the Tuesday poll): the scheduled build refetches the ESPN files
  # and Streak King's payload and rebuilds the ledgers before building (a
  # manual run does too), so the weekend's games reach the site without a
  # commit. A push builds from the committed ledgers, so a code change never
  # waits on a download.
  schedule:
    - cron: '0 12 * * 0,2'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      # The raw ESPN files (data/raw, ~300MB over 23 seasons) are cached
      # between refreshes, keyed by the running season (CURRENT_SEASON in
      # scripts/lib/window.mjs, the one the fetcher reads). Only the running
      # season's files and the payload change, so they stay out of the cache
      # and are fetched fresh every run; fetch.mjs skips every finished
      # season's file already there.
      - if: github.event_name != 'push'
        id: season
        run: node -e "import('./scripts/lib/window.mjs').then((m) => console.log('season=' + m.CURRENT_SEASON))" >> "$GITHUB_OUTPUT"
      - if: github.event_name != 'push'
        uses: actions/cache@v4
        with:
          path: |
            data/raw
            !data/raw/*_${{ steps.season.outputs.season }}.*
            !data/raw/streak-king-payload.json
          key: espn-raw-${{ steps.season.outputs.season }}
          restore-keys: espn-raw-
      - if: github.event_name != 'push'
        run: npm run fetch && npm run ledger
      # the build also mines the records (npm run build runs it); the cards need no Georgia (they fall back to Graduate)
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Ask Bing and the other IndexNow engines to recrawl, once the pages are
  # live: a push sends the board and the named boards (the live sitemap's
  # URLs that aren't entity pages); the weekly refresh, which changes every
  # page's data, sends the whole sitemap. A failed ping never fails the
  # deploy (the script exits 0). No npm ci: the script imports nothing
  # outside the repo.
  indexnow:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # (an empty string is falsy in an expression, so the flag is the truthy branch)
      - run: node scripts/indexnow.mjs ${{ github.event_name != 'push' && '--all' || '' }}

  # The share worker (workers/share) bundles src/lib, so it ships with the
  # site. Needs a CLOUDFLARE_API_TOKEN repo secret: a token made from the
  # "Edit Cloudflare Workers" template. The daily data refresh changes no
  # worker code, so it skips this.
  worker:
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4.151.3'
          command: deploy -c workers/share/wrangler.jsonc
