icon s-icon-social-linkedin s-icon--size-regular" aria-hidden="true"><use xlink:href="/sidearm-icons-social.svg#icon-social-linkedin"></use></svg></a></div></div><!----><!----><!----></div><div class="flex pt-[32px]"><!----><div id="storyContainer" tabindex="-1" class="relative w-full print:static"><!--[--><span></span><!----><div data-sidearm-html="true" data-safe-html="true" id="storyPageContentBody" tabindex="-1" class="story-page__content__body s-text-paragraph-longform text-theme-safe min-h-[200px] max-w-none prose"><strong>Career Win #100 For Smart: </strong>

<ul>
	<li>Head coach <dfn><a href="/sports/football/roster/coaches/kirby-smart/3343" rel="smarttag" rev="3343">Kirby Smart</a></dfn> joined a select group of head coaches who have been among the fastest to reach the century victory mark in their career as he reached 100 wins tonight in just 117 games with the road win over #1 Texas. That ranks tied for fifth fastest with Knute Rockne (100-12-5 at Notre Dame) and Chris Petersen (100-17) with Boise State and Washington.</li>
</ul>
<strong>Huge Road Win! </strong>

<ul>
	<li>With tonight's 30-15 victory, No. 5 Georgia has now won 45 of its past 46 games including 31 of its past 32 SEC regular season games. The Bulldogs are 52-3 in their last 55 games. With the latest victory, Georgia's 2024 senior class improves to 48-3 overall and 42-1 in the regular season. Georgia notched its second win in the UT series with the Longhorns still holding a 4-2 edge.</li>
</ul>
<strong>Bulldogs Now 4-5 Against No. 1 Ranked Teams: </strong>

<ul>
	<li>Georgia improved to 4-5 in school history versus the top-ranked team and now 3-1 under <dfn><a href="/sports/football/roster/coaches/kirby-smart/3343" rel="smarttag" rev="3343">Kirby Smart</a></dfn>. Tonight marked the first time that the Bulldogs faced a No. 1 team in a true road game.</li>
</ul>
<strong>Defensive Review:</strong>

<ul>
	<li>Georgia held top-ranked UT to 15 points and 259 yards of total offense on 76 plays as they were 2-for-15 on 3rd down conversions Coming in tonight, UT ranked seventh nationally in Scoring Offense at 43.2 ppg. UT finished 0-for-7 on 3rd down conversions in the first half.</li>
	<li>At the half, top-ranked UT was shutout on just 38 yards of total offense (2-rushing, 36-passing) on 34 plays with a season-high five sacks. It's the third time this year that the Bulldogs have a first-half shutout, doing it against No. 14 Clemson in Atlanta and versus Tenn. Tech in Athens.</li>
	<li>In the first half, junior <dfn><a href="/sports/football/roster/daylen-everette/8080" rel="smarttag" rev="8080">Daylen Everette</a></dfn> got a sack for minus 15 and a forced a fumble plus recovered it at the UT 13. It was his first forced fumble and fumble recover and sack. It led to an eventual TD and a 7-0 edge with six seconds left in the first quarter. Everette notched his first INT (2nd of his career) at the UT34. It led to an eventual TD and a 17-0 edge with 8:30 left in the first half.</li>
	<li>Georgia's leading tacklers were junior <dfn><a href="/sports/football/roster/jalon-walker/8140" rel="smarttag" rev="8140">Jalon Walker</a></dfn> with eight tackles plus three sacks. He has team-best 4.5 sacks on the year. The three sacks tied for the most in a game in the <dfn><a href="/sports/football/roster/coaches/kirby-smart/3343" rel="smarttag" rev="3343">Kirby Smart</a></dfn> era, last done by Channing Tindall at Tennesse in 2021.</li>
	<li><dfn><a href="/sports/football/roster/daylen-everette/8080" rel="smarttag" rev="8080">Daylen Everette</a></dfn> had seven stops. Damon Wilson had a sack, forced fumble that was recovered by Walker at the UT30. Junior <dfn><a href="/sports/football/roster/mykel-williams/8143" rel="smarttag" rev="8143">Mykel Williams</a></dfn> added a sack in the 2nd half to give him four on the season.</li>
	<li>UT cut it to 23-8 on its opening possession of the 2nd half, going 55 yards on eight plays in 3:52.</li>
	<li>Following an overturn on interference play that led to an INT, UT needed two plays and nine yards to cut it to 23-14 with 2:12 in the 3rd quarter.</li>
</ul>
<strong>Summary Of The Offense: </strong>

<ul>
	<li>Georgia finished 283 yards on 71 plays including 6-of-17 on 3rd downs and 1-for-2 with a TD on 4th downs.</li>
	<li>At the half, Georgia led 23-0 with 170 yards of offense on 39 plays. Coming in tonight, UT led the nation in Scoring Defense (6.3 ppg) and had allowed just one passing TD all year.</li>
	<li>Coming in tonight In the Red Zone, UT ranked second nationally, allowing only seven trips and just one TD. In the first half, Georgia was 3-for-4 (2TDs rushing, 33-yard field goal, one INT) in the Red Zone and ended the night 4-for-5 with 3 TDs..</li>
	<li>Georgia capitalized on a sack/forced fumble/recovery to give them the ball on the UT 13. It led to a TD, going four plays in 1:35 on a two-yard score by <dfn><a href="/sports/football/roster/trevor-etienne/8155" rel="smarttag" rev="8155">Trevor Etienne</a></dfn> for a 7-0 advantage.</li>
	<li>Georgia built a 10-0 lead with 10:46 left in the first half on a 33-yard field goal by sophomore <dfn><a href="/sports/football/roster/peyton-woodring/8148" rel="smarttag" rev="8148">Peyton Woodring</a></dfn>.</li>
	<li>Following an INT by <dfn><a href="/sports/football/roster/daylen-everette/8080" rel="smarttag" rev="8080">Daylen Everette</a></dfn> to give the Bulldogs the ball at the UT34, Georgia turned it into a TD, capped by a 15-yard run by <dfn><a href="/sports/football/roster/trevor-etienne/8155" rel="smarttag" rev="8155">Trevor Etienne</a></dfn> and a 17-0 edge.</li>
	<li>Georgia made it 20-0 after a 48-yard field goal by Woodring with 4:43 left, and he made a 44-yard to end the first half for a 23-0 edge.</li>
	<li>At halftime, senior QB <dfn><a href="/sports/football/roster/carson-beck/8064" rel="smarttag" rev="8064">Carson Beck</a></dfn> was 16-for-28 for 100 yards with no TDs and 2 INTs.</li>
	<li>The Bulldogs had 108 rushing yards on 30 attempts. Junior <dfn><a href="/sports/football/roster/trevor-etienne/8155" rel="smarttag" rev="8155">Trevor Etienne</a></dfn> had a team-high 87 yards on 19 attempts with 3 TDs.</li>
	<li>Georgia put together an 11 play, 89-yard TD drive in 5:03 to take a 30-15 advantage with 12:04 left in the contest en route to the win..</li>
</ul>
<strong>4th Down Success: </strong>

<ul>
	<li>On 4th-and-goal from the 1, Etienne scored to put the Bulldogs up 30-14 after the PAT. The Bulldogs are now 11-for-12 on the year on 4th down conversions including making their last 10 attempts. Coming in tonight, Georgia ranked fourth nationally in 4th Down Conversions at 91%. Georgia finished 1-for-2 on 4th downs tonight..</li>
</ul>
<strong>Catching Up With The Receivers: </strong>

<ul>
	<li>Eight different Bulldogs had a catch tonight with the leading receivers in senior <dfn><a href="/sports/football/roster/arian-smith/8124" rel="smarttag" rev="8124">Arian Smith</a></dfn> (6-for-32) <dfn><a href="/sports/football/roster/dominic-lovett/8107" rel="smarttag" rev="8107">Dominic Lovett</a></dfn> (4-for-35) and <dfn><a href="/sports/football/roster/trevor-etienne/8155" rel="smarttag" rev="8155">Trevor Etienne</a></dfn> (3-for-23).</li>
</ul>
<strong>Special Teams In Action: </strong>

<ul>
	<li>Sophomore PK <dfn><a href="/sports/football/roster/peyton-woodring/8148" rel="smarttag" rev="8148">Peyton Woodring</a></dfn> tallied 13 points on four PATs and field goals of 33, 44 and 48 yards plus handled kickoffs.</li>
	<li>Junior P <dfn><a href="/sports/football/roster/brett-thorson/8138" rel="smarttag" rev="8138">Brett Thorson</a></dfn> averaged 54 yards on four punts with two returned for minus nine yards. Georgia has not allowed a positive yard on a return this year. Sophomore Anthony Evans had two punt returns for 21 yards.</li>
</ul>
<strong>Captains, Coin Toss And For Starters: </strong>

<ul>
	<li>Georgia's captains were <dfn><a href="/sports/football/roster/carson-beck/8064" rel="smarttag" rev="8064">Carson Beck</a></dfn>, <dfn><a href="/sports/football/roster/trevor-etienne/8155" rel="smarttag" rev="8155">Trevor Etienne</a></dfn>, <dfn><a href="/sports/football/roster/malaki-starks/8131" rel="smarttag" rev="8131">Malaki Starks</a></dfn> and <dfn><a href="/sports/football/roster/jalon-walker/8140" rel="smarttag" rev="8140">Jalon Walker</a></dfn>.</li>
	<li>Texas won the toss and deferred the ball until the second half. Junior <dfn><a href="/sports/football/roster/jared-wilson/8145" rel="smarttag" rev="8145">Jared Wilson</a></dfn> returned to his starting role at center after not starting the past two games due to injury. He now has started five games this season.</li>
</ul>
<strong>Up Next: </strong>

<ul>
	<li>The Bulldogs (6-1, 4-1 SEC) have an open date and return to action Nov. 2 against Florida (4-3, 2-2 SEC) in Jacksonville. The Gators beat Kentucky in Gainesville tonight and are off next week too.</li>

tle":12,"url":12},"SGN","signing-day",43,"signing","Signing Day",1453,{"abbreviation":395,"facebook":12,"gender":367,"global_sport_id":368,"global_sport_shortname":12,"global_sport_name_slug":396,"id":397,"instagram":12,"non_sport":7,"pinterest":12,"shortname":398,"title":399,"tickets":12,"twitter":12,"youtube":12,"rosterId":-1,"scheduleId":-1,"displayOpponentHistory":7,"short_title":12,"url":12},"BB","brooks-bulletin",44,"brooks","Brooks Bulletin",{"abbreviation":401,"facebook":352,"gender":173,"global_sport_id":323,"global_sport_shortname":402,"global_sport_name_slug":403,"id":404,"instagram":356,"non_sport":122,"pinterest":12,"shortname":403,"title":405,"tickets":12,"twitter":358,"youtube":12,"rosterId":406,"scheduleId":407,"displayOpponentHistory":122,"short_title":12,"url":12},"MSD","mswim","msd",45,"Men's Swimming & Diving",1275,3740,{"abbreviation":409,"facebook":352,"gender":185,"global_sport_id":335,"global_sport_shortname":410,"global_sport_name_slug":411,"id":412,"instagram":356,"non_sport":122,"pinterest":12,"shortname":411,"title":413,"tickets":12,"twitter":358,"youtube":12,"rosterId":414,"scheduleId":415,"displayOpponentHistory":122,"short_title":12,"url":12},"WSD","wswim","wsd",46,"Women's Swimming & Diving",1276,3741,{"abbreviation":417,"facebook":12,"gender":367,"global_sport_id":12,"global_sport_shortname":18,"global_sport_name_slug":418,"id":419,"instagram":12,"non_sport":7,"pinterest":12,"shortname":420,"title":421,"tickets":12,"twitter":12,"youtube":12,"rosterId":-1,"scheduleId":-1,"displayOpponentHistory":122,"short_title":12,"url":12},"SM","sports-medicine",47,"sports-med","Sports Medicine",{"stories":423,"preloadedStories":424,"paginationCursor":425,"basePageSize":426,"isLoadingMore":427,"isLoading":428,"moreToLoad":429,"storyContent":430,"storyGames":547,"isLoadingStoryGames":122,"storyGameLeaders":548,"isLoadingStoryGameLeaders":122,"storyGamesTeamsStats":550,"isLoadingStoryGamesTeamsStats":552,"isStoryContentUnsafeHtml":553,"storyNextGame":554,"isLoadingStoryNextGame":122,"storyContentLoading":555,"nextStory":556,"storySettings":557,"defaultSportTemplate":148,"preloadedTemplates":562},{},{},{},{},{},{},{},{"6459061929515637":431},{"applyStandardFormatting":7,"blocks":12,"isBlockBased":122,"contentId":432,"contentTitle":112,"contentDate":433,"contentUrl":434,"contentImageUrl":435,"content":436,"contentTemplate":148,"id":437,"title":112,"titleInRotator":7,"subHeadline":18,"teaser":438,"type":18,"byline":18,"appExclusive":122,"date":433,"sportDisplay":202,"sport":439,"sportShortname":199,"primaryImage":442,"imageSource":435,"imageFocalPoint":12,"imageAltText":116,"imageCaption":18,"video":444,"url":434,"redirectAbsoluteUrl":18,"links":446,"homepageFeedTemplate":18,"games":447,"galleryId":368,"galleryImages":448,"writer":12,"players":449,"globalSportMapName":199,"storyMetaDescription":12,"storyMetaOgDescription":12,"storyMetaKeywords":12,"storyMetaOgTitle":12,"imageCreditText":443,"alternateImage":12,"insideContentImage":12,"formattedDate":546,"gamePostStoryId":12,"isMediaOnStoryPage":7},"66547","2024-10-19T21:40:00","\u002Fnews\u002F2024\u002F10\u002F19\u002Ffootball-georgia-postgame-notes","\u002Fimages\u002F2024\u002F10\u002F20\u002F24FB_Texas_Walker.jpg","\u003Cstrong>Career Win #100 For Smart: \u003C\u002Fstrong>\r\n\r\n\u003Cul>\r\n\t\u003Cli>Head coach \u003Cdfn>\u003Ca href=\"\u002Fsports\u002Ffootball\u002Froster\u002Fcoaches\u002Fkirby-smart\u002F3343\" rel=\"smarttag\" rev=\"3343\">Kirby Smart\u003C\u002Fa>\u003C\u002Fdfn> joined a select group of head coaches who have been among the fastest to reach the century victory mark in their career as he reached 100 wins tonight in just 117 games with the road win over #1 Texas. That ranks tied for fifth fastest with Knute Rockne (100-12-5 at Notre Dame) and Chris Petersen (100-17) with Boise State and Washington.\u003C\u002Fli>\r\n\u003C\u002Ful>\r\n\u003Cstrong>Huge Road Win! \u003C\u002Fstrong>\r\n\r\n\u003Cul>\r\n\t\u003Cli>With tonight's 30-15 victory, No. 5 Georgia has now won 45 of its past 46 games including 31 of its past 32 SEC regular season games. The Bulldogs are 52-3 in their last 55 games. With the latest victory, Georgia's 2024 senior class improves to 48-3 overall and 42-1 in the regular season. Georgia notched its second win in the UT series with the Longhorns still holding a 4-2 edge.\u003C\u002Fli>\r\n\u003C\u002Ful>\r\n\u003Cstrong>Bulldogs Now 4-5 Against No. 1 Ranked Teams: \u003C\u002Fstrong>\r\n\r\n\u003Cul>\r\n\t\u003Cli>Georgia improved to 4-5 in school history versus the top-ranked team and now 3-1 under \u003Cdfn>\u003Ca href=\"\u002Fsports\u002Ffootball\u002Froster\u002Fcoaches\u002Fkirby-smart\u002F3343\" rel=\"smarttag\" rev=\"3343\">Kirby Smart\u003C\u002Fa>\u003C\u002Fdfn>. Tonight marked the first time that the Bulldogs faced a No. 1 team in a true road game.\u003C\u002Fli>\r\n\u003C\u002Ful>\r\n\u003Cstrong>Defensive Review:\u003C\u002Fstrong>\r\n\r\n\u003Cul>\r\n\t\u003Cli>Georgia held top-ranked UT to 15 points and 259 yards of total offense on 76 plays as they were 2-for-15 on 3rd down conversions Coming in tonight, UT ranked seventh nationally in Scoring Offense at 43.2 ppg. UT finished 0-for-7 on 3rd down conversions in the first half.\u003C\u002Fli>\r\n\t\u003Cli>At the half, top-ranked UT was shutout on just 38 yards of total offense (2-rushing, 36-passing) on 34 plays with a season-high five sacks. It's the third time this year that the Bulldogs have a first-half shutout, doing it against No. 14 Clemson in Atlanta and versus Tenn. Tech in Athens.\u003C\u002Fli>\r\n\t\u003Cli>In the first half, junior \u003Cdfn>\u003Ca href=\"\u002Fsports\u002Ffootball\u002Froster\u002Fdaylen-everette\u002F8080\" rel=\"smarttag\" rev=\"8080\">Daylen Everette\u003C\u002Fa>\u003C\u002Fdfn> got a sack for minus 15 and a forced a fumble plus recovered it at the UT 13. It was his first forced fumble and fumble recover and sack. It led to an eventual TD and a 7-0 edge with six seconds left in the first quarter. Everette notched his first INT (2nd of his career) at the UT34. It led to an eventual TD and a 17-0 edge with 8:30 left in the first half.\u003C\u002Fli>\r\n\t\u003Cli>Georgia's leading tacklers were junior \u003Cdfn>\u003Ca href=\"\u002Fsports\u002Ffootball\u002Froster\u002Fjalon-walker\u002F8140\" rel=\"smarttag\" rev=\"8140\">Jalon Walker\u003C\u002Fa>\u003C\u002Fdfn> with eight tackles plus three sacks. He has team-best 4.5 sacks on the year. The three sacks tied for the most in a game in the \u003Cdfn>\u003Ca href=\"\u002Fsports\u002Ffootball\u002Froster\u002Fcoaches\u002Fkirby-smart\u002F3343\" rel=\"smarttag\" rev=\"3343\">Kirby Smart\u003C\u002Fa>\u003C\u002Fdfn> era, last done by Channing Tindall at Tennesse in 2021.\u003C\u002Fli>\r\n\t\u003Cli>\u003Cdfn>\u003Ca href=\"\u002Fsports\u002Ffootball\u002Froster\u002Fdaylen-everette\u002F8080\" rel=\"smarttag\" rev=\"8080\">Daylen Everette\u003C\u002Fa>\u003C\u002Fdfn> had seven stops. Damon Wilson had a sack, forced fumble that was recovered by Walker at the UT30. Junior \u003Cdfn>\u003Ca href=\"\u002Fsports\u002Ffootball\u002Froster\u002Fmykel-williams\u002F8143\" rel=\"smarttag\" rev=\"8143\">Mykel Williams\u003C\u002Fa>\u003C\u002Fdfn> added a sack in the 2nd half to give him four on the season.\u003C\u002Fli>\r\n\t\u003Cli>UT cut it to 23-8 on its opening possession of the 2nd half, going 55 yards on eight plays in 3:52.\u003C\u002Fli>\r\n\t\u003Cli>Following an overturn on interference play that led to an INT, UT needed two plays and nine yards to cut it to 23-14 with 2:12 in the 3rd quarter.\u003C\u002Fli>\r\n\u003C\u002Ful>\r\n\u003Cstrong>Summary Of The Offense: \u003C\u002Fstrong>\r\n\r\n\u003Cul>\r\n\t\u003Cli>Georgia finished 283 yards on 71 plays including 6-of-17 on 3rd downs and 1-for-2 with a TD on 4th downs.\u003C\u002Fli>\r\n\t\u003Cli>At the half, Georgia led 23-0 with 170 yards of offense on 39 plays. Coming in tonight, UT led the nation in Scoring Defense (6.3 ppg) and had allowed just one passing TD all year.\u003C\u002Fli>\r\n\t\u003Cli>Coming in tonight In the Red Zone, UT ranked second nationally, allowing only seven trips and just one TD. In the first half, Georgia was 3-for-4 (2TDs rushing, 33-yard field goal, one INT) in the Red Zone and ended the night 4-for-5 with 3 TDs..\u003C\u002Fli>\r\n\t\u003Cli>Georgia capitalized on a sack\u002Fforced fumble\u002Frecovery to give them the ball on the UT 13. It led to a TD, going four plays in 1:35 on a two-yard score by \u003Cdfn>\u003Ca href=\"\u002Fsports\u002Ffootball\u002Froster\u002Ftrevor-etienne\u002F8155\" rel=\"smarttag\" rev=\"8155\">Trevor Etienne\u003C\u002Fa>\u003C\u002Fdfn> for a 7-0 advantage.\u003C\u002Fli>\r\n\t\u003Cli>Georgia built a 10-0 lead with 10:46 left in the first half on a 33-yard field goal by sophomore \u003Cdfn>\u003Ca href=\"\u002Fsports\u002Ffootball\u002Froster\u002Fpeyton-woodring\u002F8148\" rel=\"smarttag\" rev=\"8148\">Peyton Woodring\u003C\u002Fa>\u003C\u002Fdfn>.\u003C\u002Fli>\r\n\t\u003Cli>Following an INT by \u003Cdfn>\u003Ca href=\"\u002Fsports\u002Ffootball\u002Froster\u002Fdaylen-everette\u002F8080\" rel=\"smarttag\" rev=\"8080\">Daylen Everette\u003C\u002Fa>\u003C\u002Fdfn> to give the Bulldogs the ball at the UT34, Georgia turned it into a TD, capped by a 15-yard run by \u003Cdfn>\u003Ca href=\"\u002Fsports\u002Ffootball\u002Froster\u002Ftrevor-etienne\u002F8155\" rel=\"smarttag\" rev=\"8155\">Trevor Etienne\u003C\u002Fa>\u003C\u002Fdfn> and a 17-0 edge.\u003C\u002Fli>\r\n\t\u003Cli>Georgia made it 20-0 after a 48-yard field goal by Woodring with 4:43 left, and he made a 44-yard to end the first half for a 23-0 edge.\u003C\u002Fli>\r\n\t\u003Cli>At halftime, senior QB \u003Cdfn>\u003Ca href=\"\u002Fsports\u002Ffootball\u002Froster\u002Fcarson-beck\u002F8064\" rel=\"smarttag\" rev=\"8064\">Carson Beck\u003C\u002Fa>\u003C\u002Fdfn> was 16-for-28 for 100 yards with no TDs and 2 INTs.\u003C\u002Fli>\r\n\t\u003Cli>The Bulldogs had 108 rushing yards on 30 attempts. Junior \u003Cdfn>\u003Ca href=\"\u002Fsports\u002Ffootball\u002Froster\u002Ftrevor-etienne\u002F8155\" rel=\"smarttag\" rev=\"8155\">Trevor Etienne\u003C\u002Fa>\u003C\u002Fdfn> had a team-high 87 yards on 19 attempts with 3 TDs.\u003C\u002Fli>\r\n\t\u003Cli>Georgia put together an 11 play, 89-yard TD drive in 5:03 to take a 30-15 advantage with 12:04 left in the contest en route to the win..\u003C\u002Fli>\r\n\u003C\u002Ful>\r\n\u003Cstrong>4th Down Success: \u003C\u002Fstrong>\r\n\r\n\u003Cul>\r\n\t\u003Cli>On 4th-and-goal from the 1, Etienne scored to put the Bulldogs up 30-14 after the PAT. The Bulldogs are now 11-for-12 on the year on 4th down conversions including making their last 10 attempts. Coming in tonight, Georgia ranked fourth nationally in 4th Down Conversions at 91%. Georgia finished 1-for-2 on 4th downs tonight..\u003C\u002Fli>\r\n\u003C\u002Ful>\r\n\u003Cstrong>Catching Up With The Receivers: \u003C\u002Fstrong>\r\n\r\n\u003Cul>\r\n\t\u003Cli>Eight different Bulldogs had a catch tonight with the leading receivers in senior \u003Cdfn>\u003Ca href=\"\u002Fsports\u002Ffootball\u002Froster\u002Farian-smith\u002F8124\" rel=\"smarttag\" rev=\"8124\">Arian Smith\u003C\u002Fa>\u003C\u002Fdfn> (6-for-32) \u003Cdfn>\u003Ca href=\"\u002Fsports\u002Ffootball\u002Froster\u002Fdominic-lovett\u002F8107\" rel=\"smarttag\" rev=\"8107\">Dominic Lovett\u003C\u002Fa>\u003C\u002Fdfn> (4-for-35) and \u003Cdfn>\u003Ca href=\"\u002Fsports\u002Ffootball\u002Froster\u002Ftrevor-etienne\u002F8155\" rel=\"smarttag\" rev=\"8155\">Trevor Etienne\u003C\u002Fa>\u003C\u002Fdfn> (3-for-23).\u003C\u002Fli>\r\n\u003C\u002Ful>\r\n\u003Cstrong>Special Teams In Action: \u003C\u002Fstrong>\r\n\r\n\u003Cul>\r\n\t\u003Cli>Sophomore PK \u003Cdfn>\u003Ca href=\"\u002Fsports\u002Ffootball\u002Froster\u002Fpeyton-woodring\u002F8148\" rel=\"smarttag\" rev=\"8148\">Peyton Woodring\u003C\u002Fa>\u003C\u002Fdfn> tallied 13 points on four PATs and field goals of 33, 44 and 48 yards plus handled kickoffs.\u003C\u002Fli>\r\n\t\u003Cli>Junior P \u003Cdfn>\u003Ca href=\"\u002Fsports\u002Ffootball\u002Froster\u002Fbrett-thorson\u002F8138\" rel=\"smarttag\" rev=\"8138\">Brett Thorson\u003C\u002Fa>\u003C\u002Fdfn> averaged 54 yards on four punts with two returned for minus nine yards. Georgia has not allowed a positive yard on a return this year. Sophomore Anthony Evans had two punt returns for 21 yards.\u003C\u002Fli>\r\n\u003C\u002Ful>\r\n\u003Cstrong>Captains, Coin Toss And For Starters: \u003C\u002Fstrong>\r\n\r\n\u003Cul>\r\n\t\u003Cli>Georgia's captains were \u003Cdfn>\u003Ca href=\"\u002Fsports\u002Ffootball\u002Froster\u002Fcarson-beck\u002F8064\" rel=\"smarttag\" rev=\"8064\">Carson Beck\u003C\u002Fa>\u003C\u002Fdfn>, \u003Cdfn>\u003Ca href=\"\u002Fsports\u002Ffootball\u002Froster\u002Ftrevor-etienne\u002F8155\" rel=\"smarttag\" rev=\"8155\">Trevor Etienne\u003C\u002Fa>\u003C\u002Fdfn>, \u003Cdfn>\u003Ca href=\"\u002Fsports\u002Ffootball\u002Froster\u002Fmalaki-starks\u002F8131\" rel=\"smarttag\" rev=\"8131\">Malaki Starks\u003C\u002Fa>\u003C\u002Fdfn> and \u003Cdfn>\u003Ca href=\"\u002Fsports\u002Ffootball\u002Froster\u002Fjalon-walker\u002F8140\" rel=\"smarttag\" rev=\"8140\">Jalon Walker\u003C\u002Fa>\u003C\u002Fdfn>.\u003C\u002Fli>\r\n\t\u003Cli>Texas won the toss and deferred the ball until the second half. Junior \u003Cdfn>\u003Ca href=\"\u002Fsports\u002Ffootball\u002Froster\u002Fjared-wilson\u002F8145\" rel=\"smarttag\" rev=\"8145\">Jared Wilson\u003C\u002Fa>\u003C\u002Fdfn> returned to his starting role at center after not starting the past two games due to injury. He now has started five games this season.\u003C\u002Fli>\r\n\u003C\u002Ful>\r\n\u003Cstrong>Up Next: \u003C\u002Fstrong>\r\n\r\n\u003Cul>\r\n\t\u003Cli>The Bulldogs (6-1, 4-1 SEC) have an open date and return to action Nov. 2 against Florida (4-3, 2-2 SEC) in Jacksonville. The Gators beat Kentucky in Gainesville tonight and are off next week too.\u003C\u002Fli>\r\n\u003C\u002Ful>\r\n",66547,"With tonight's 30-15 victory, No. 5 Georgia has now won 45 of its past 46 games including 31 of its past 32 SEC regular season games. The Bulldogs are 52-3 in their last 55 games.",{"id":200,"title":202,"abbreviation":196,"shortTitle":18,"shortname":199,"facebook":197,"twitter":203,"gender":173,"pinterest":18,"instagram":201,"youtube":18,"globalSportShortname":199,"globalSportNameSlug":199,"tickets":18,"youtubePlaylistId":440,"globalSportId":198,"nonSport":122,"showAtVs":7,"gameSynonym":441},"PLL9JwEC9oBY-vW-4HwV4hYsDIg33NPolT","Games",{"caption":18,"creditText":443,"focalPoint":12,"url":435,"absoluteUrl":435,"altText":116,"title":12,"creditName":12},"Jay Janner\u002FAmerican-Statesman \u002F USA TODAY NETWORK via Imagn Images",{"youtube":12,"archive":12,"metadata":445},{"title":12,"thumbnail":12},[],[],[],[450,460,469,478,486,494,502,511,519,528,537],{"rosterPlayerId":451,"rosterId":452,"playerId":453,"rpPositionShort":454,"rpJerseyNumber":455,"firstName":456,"lastName":457,"headshot":458,"sport":459},8064,1202,1784,"QB","15","Carson","Beck","\u002Fimages\u002F2021\u002F6\u002F22\u002FBeck_Carson_2021.jpg",{"abbrev":196,"shortDisplay":18,"shortName":199,"globalSportId":198,"globalSportNameSlug":199,"globalSportGender":173,"id":200,"title":202},{"rosterPlayerId":461,"rosterId":452,"playerId":462,"rpPositionShort":463,"rpJerseyNumber":464,"firstName":465,"lastName":466,"headshot":467,"sport":468},8155,2778,"RB","1","Trevor","Etienne","\u002Fimages\u002F2024\u002F8\u002F14\u002FEtienne__Trevor.jpg",{"abbrev":196,"shortDisplay":18,"shortName":199,"globalSportId":198,"globalSportNameSlug":199,"globalSportGender":173,"id":200,"title":202},{"rosterPlayerId":470,"rosterId":452,"playerId":471,"rpPositionShort":472,"rpJerseyNumber":473,"firstName":474,"lastName":475,"headshot":476,"sport":477},8080,2236,"DB","6","Daylen","Everette","\u002Fimages\u002F2022\u002F2\u002F10\u002FEverette_Daylen_2022.jpg",{"abbrev":196,"shortDisplay":18,"shortName":
