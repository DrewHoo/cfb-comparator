auto" role="tablist"><button id="v-0-5-0-3-0-tab-0" data-test-id="s-tab__link" class="s-tab flex select-none items-center whitespace-nowrap s-tab--selected s-text-regular-bold" type="button" role="tab" aria-selected="true" aria-controls="v-0-5-0-3-0-panel-0" tabindex="0"><svg data-test-id="s-icon__root" focusable="false" role="img" fill="currentColor" style="" class="s-icon s-icon-user s-icon--size-small s-icon--left mr-2" aria-hidden="true"><use xlink:href="/sidearm-icons.svg#icon-user"></use></svg><!--[--> Bio <!--]--><!----></button></div><div class="s-tab-panels pt-[36px] pt-[36px]"><div id="v-0-5-0-3-0-panel-0" class="s-tab-item s-tab-item--selected" data-test-id="s-tab-item__root" role="tabpanel" aria-labelledby="v-0-5-0-3-0-tab-0" tabindex="0"><!--[--><div class="s-text-paragraph-longform text-theme-safe"><div class="break-words legacy_to_nextgen sidearm_prose">Chris Petersen retired from from coaching following the 2019 college football season, having spent 33 years as a coach, including eight (2006-13) as head coach at Boise State and six more (2014-19) as head coach at the University of Washington.<br />
 <br />
• Compiled a career record of 147-38, good for a .795 winning percentage, the second-highest among active NCAA-FBS coaches with five or more years experience, as of the end of the 2019 season.<br />
• Earned his 100th career coaching victory in just his 117th career game, making him the fifth-fastest coach in college football history to reach 100 victories. Also won more games (61) in his first five seasons as a head coach than any coach in history.<br />
• Two-time winner of the Paul "Bear" Bryant National Coach of the Year Award (2006 and 2009), while also winning the Bobby Dodd Coach of the Year (2010) and the Gene Stallings Award (2017) for humanitarian work.<br />
• Posted a won-lost record of 92-12 during eight seasons as head coach at Boise State, leading the Broncos to five conference championships and two undefeated seasons (13-0 in 2006 and 14-0 in 2009).<br />
• Went 55-26 as head coach at Washington, leading the Huskies to Pac-12 Conference titles in both 2016 and 2018.<br />
• Led the Huskies to the four-team College Football Playoffs in 2016, the UW's only CFP appearance to date, and to New Years Six bowl games in three straight seasons: 2016 (Peach Bowl), 2017 (Fiesta Bowl) and 2018 (Rose Bowl).<br />
• In six seasons at UW, never lost to Washington State in the annual Apple Cup rivalry game, winning all six meetings.<br />
• Attained a long record of leading teams to the highest levels of academic success at both Boise State and Washington.<br />
• For the seasons 2015-18 (data released in 2020), led the UW program to the highest four-year Academic Progress Rate (APR) score in the the history of major-college football. The NCAA uses the APR to measure teams' academic success, progress and retention.<br />
• UW became the first program other than Stanford to lead the Pac-12 Conference in APR, and has done so for the last three years.<br />
• Prior to Petersen's arrival, the UW football team had never before achieved a cumulative grade point average of 3.00 or better. In 11 of the last 12 academic quarters with Petersen in charge, the team combined for a GPA over 3.00, twice reaching a high of 3.16.<br />
• In all, 31 individuals who played at UW under Petersen were selected in the NFL Draft, and as of May, 2020, 41 former Huskies were listed on NFL rosters, all but two of whom played for Petersen.<br />
• During his six seasons at Washington, a total of 31 players were named first-team All-Pac-12, while 17 earned some level of All-America recognition, including 12 first-team selections.<br />
• During his six seasons at Washington, a total of 36 football players earned first-team Academic All-Pac-12, while 17 earned Academic All-District and two were named Pac-12 Scholar-Athlete of the Year for football.<br />
• In his first season as head coach at Boise State (2006), led the Broncos to a 13-0 record and a win over Oklahoma in the Fiesta Bowl, widely considered one of the greatest bowl games in history.<br />
• Along with five league titles at Boise State, led his teams to a 57-6 record in conference play, over eight seasons.<br />
• Led Boise State to national recognition awards for NCAA Academic Progress Rate three years in a row. In 2011, Boise State was the only program to finish in the top 10 in the final college football polls, and among the top 10 percent in APR.<br />
• Prior to becoming Boise State's head coach, served as the Broncos offensive coordinator for five seasons. His offenses led the nation in scoring in 2002 and 2003.<br />
• During his career, also spent time as an assistant coach at UC Davis, the University of Pittsburgh, the University of Oregon and Portland State University.<br />
• Played quarterback at Sacramento City College, and then UC Davis, earning a bachelor's degree in psychology and a master's in educational psychology. Set numerous records at Davis, and his marks for season and career completion percentage both still stand.<br />
• Named his conference's Player of the Year and UC Davis' Male Athlete of the Year following his senior season, when he was team captain and winner of his team's MVP and most inspirational award. Inducted into the Cal Aggie Athletic Hall of Fame in 1997.<br />
• Grew up in Yuba City, Calif., and now resides in Bellevue, Wash., along with his wife, Barbara. He and Barbara are the parents of two adult sons, Jack and Sam.<br />

2,"url":12,"icon":578,"oldIcon":579},{"platformName":581,"userName":12,"url":12,"icon":582,"oldIcon":583},{"platformName":585,"userName":12,"url":12,"icon":586,"oldIcon":587},{"platformName":589,"userName":12,"url":12,"icon":590,"oldIcon":591},{"platformName":593,"userName":12,"url":12,"icon":594,"oldIcon":12},6111,{},{},{"4174738615067052":1313},{"applyCustomFormatting":125,"isHeadCoach":125,"id":1314,"latestBioId":1314,"title":113,"firstName":115,"lastName":116,"email":18,"phone":18,"bio":1315,"twitter":1316,"custom1":18,"custom2":18,"custom3":18,"custom4":18,"image":1317,"images":1320,"displayFields":1321,"url":12,"staffId":1325,"socialMediaR":1326,"sport":1341,"sports":1342},4183,"Chris Petersen retired from from coaching following the 2019 college football season, having spent 33 years as a coach, including eight (2006-13) as head coach at Boise State and six more (2014-19) as head coach at the University of Washington.\u003Cbr \u002F>\r\n \u003Cbr \u002F>\r\n• Compiled a career record of 147-38, good for a .795 winning percentage, the second-highest among active NCAA-FBS coaches with five or more years experience, as of the end of the 2019 season.\u003Cbr \u002F>\r\n• Earned his 100th career coaching victory in just his 117th career game, making him the fifth-fastest coach in college football history to reach 100 victories. Also won more games (61) in his first five seasons as a head coach than any coach in history.\u003Cbr \u002F>\r\n• Two-time winner of the Paul \"Bear\" Bryant National Coach of the Year Award (2006 and 2009), while also winning the Bobby Dodd Coach of the Year (2010) and the Gene Stallings Award (2017) for humanitarian work.\u003Cbr \u002F>\r\n• Posted a won-lost record of 92-12 during eight seasons as head coach at Boise State, leading the Broncos to five conference championships and two undefeated seasons (13-0 in 2006 and 14-0 in 2009).\u003Cbr \u002F>\r\n• Went 55-26 as head coach at Washington, leading the Huskies to Pac-12 Conference titles in both 2016 and 2018.\u003Cbr \u002F>\r\n• Led the Huskies to the four-team College Football Playoffs in 2016, the UW's only CFP appearance to date, and to New Years Six bowl games in three straight seasons: 2016 (Peach Bowl), 2017 (Fiesta Bowl) and 2018 (Rose Bowl).\u003Cbr \u002F>\r\n• In six seasons at UW, never lost to Washington State in the annual Apple Cup rivalry game, winning all six meetings.\u003Cbr \u002F>\r\n• Attained a long record of leading teams to the highest levels of academic success at both Boise State and Washington.\u003Cbr \u002F>\r\n• For the seasons 2015-18 (data released in 2020), led the UW program to the highest four-year Academic Progress Rate (APR) score in the the history of major-college football. The NCAA uses the APR to measure teams' academic success, progress and retention.\u003Cbr \u002F>\r\n• UW became the first program other than Stanford to lead the Pac-12 Conference in APR, and has done so for the last three years.\u003Cbr \u002F>\r\n• Prior to Petersen's arrival, the UW football team had never before achieved a cumulative grade point average of 3.00 or better. In 11 of the last 12 academic quarters with Petersen in charge, the team combined for a GPA over 3.00, twice reaching a high of 3.16.\u003Cbr \u002F>\r\n• In all, 31 individuals who played at UW under Petersen were selected in the NFL Draft, and as of May, 2020, 41 former Huskies were listed on NFL rosters, all but two of whom played for Petersen.\u003Cbr \u002F>\r\n• During his six seasons at Washington, a total of 31 players were named first-team All-Pac-12, while 17 earned some level of All-America recognition, including 12 first-team selections.\u003Cbr \u002F>\r\n• During his six seasons at Washington, a total of 36 football players earned first-team Academic All-Pac-12, while 17 earned Academic All-District and two were named Pac-12 Scholar-Athlete of the Year for football.\u003Cbr \u002F>\r\n• In his first season as head coach at Boise State (2006), led the Broncos to a 13-0 record and a win over Oklahoma in the Fiesta Bowl, widely considered one of the greatest bowl games in history.\u003Cbr \u002F>\r\n• Along with five league titles at Boise State, led his teams to a 57-6 record in conference play, over eight seasons.\u003Cbr \u002F>\r\n• Led Boise State to national recognition awards for NCAA Academic Progress Rate three years in a row. In 2011, Boise State was the only program to finish in the top 10 in the final college football polls, and among the top 10 percent in APR.\u003Cbr \u002F>\r\n• Prior to becoming Boise State's head coach, served as the Broncos offensive coordinator for five seasons. His offenses led the nation in scoring in 2002 and 2003.\u003Cbr \u002F>\r\n• During his career, also spent time as an assistant coach at UC Davis, the University of Pittsburgh, the University of Oregon and Portland State University.\u003Cbr \u002F>\r\n• Played quarterback at Sacramento City College, and then UC Davis, earning a bachelor's degree in psychology and a master's in educational psychology. Set numerous records at Davis, and his marks for season and career completion percentage both still stand.\u003Cbr \u002F>\r\n• Named his conference's Player of the Year and UC Davis' Male Athlete of the Year following his senior season, when he was team captain and winner of his team's MVP and most inspirational award. Inducted into the Cal Aggie Athletic Hall of Fame in 1997.\u003Cbr \u002F>\r\n• Grew up in Yuba City, Calif., and now resides in Bellevue, Wash., along with his wife, Barbara. He and Barbara are the parents of two adult sons, Jack and Sam.\u003Cbr \u002F>\r\n \u003Cbr \u002F>\r\n \u003Cbr \u002F>\r\n ","https:\u002F\u002Ftwitter.com\u002FCoachPeteUW",{"url":1318,"altText":18,"title":18,"mediaCaption":12,"creditName":12,"absoluteUrl":1319},"\u002Fimages\u002F2017\u002F7\u002F31\u002FPetersen_Chris_2017.jpg","https:\u002F\u002Fgohuskies.com\u002Fimages\u002F2017\u002F7\u002F31\u002FPetersen_Chris_2017.jpg"
