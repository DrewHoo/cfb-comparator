id="s-share__linkedin-link" href="https://www.linkedin.com/sharing/share-offsite/?url=" target="_blank" class="s-share-item s-share-item__linkedin flex w-full items-center justify-center text-center text-[18px] last:border-0 border-r" aria-label="Share via Linked-in, opens in new tab"><svg data-test-id="s-icon__root" focusable="false" role="img" fill="currentColor" style="" class="s-icon s-icon-social-linkedin s-icon--size-regular" aria-hidden="true"><use xlink:href="/sidearm-icons-social.svg#icon-social-linkedin"></use></svg></a></div></div><!----><!----><!----></div><div class="flex pt-[32px]"><!----><div id="storyContainer" tabindex="-1" class="relative w-full print:static"><!--[--><span></span><!----><div data-sidearm-html="true" data-safe-html="true" id="storyPageContentBody" tabindex="-1" class="story-page__content__body s-text-paragraph-longform text-theme-safe min-h-[200px] max-w-none prose"><p><strong>TUSCALOOSA, Ala.</strong> - Kalen DeBoer, winner of the 2023 Associated Press, AFCA, Eddie Robinson, George Munger, Walter Camp and Home Depot Coach of the Year awards, has been selected as head football coach for the Alabama Crimson Tide, Director of Athletics Greg Byrne announced on Friday. DeBoer comes to Tuscaloosa after spending the last two seasons at Washington.</p>

<p>"We are excited to welcome Kalen and Nicole DeBoer, and their daughters, Alexis and Avery, to The University of Alabama," said Byrne. "Coach DeBoer has proven he is a winner and has done an incredible job as a head coach at each of his stops. One of the things I told our team the other day is we are going to get someone who is not only a great coach with the Xs and Os, but also someone who cares about his players and someone I'd want my sons to play for, just like I would have wanted them to play for Coach Saban. We got that in Coach DeBoer. He is ready to get to work, and we look forward to him leading the Alabama Crimson Tide football program for years to come. We are grateful to our leadership in President Stuart R. Bell, Chancellor Finis St. John and The University of Alabama System Board of Trustees for their support during this process."</p>

<p>In his nine seasons as a head coach, DeBoer has won 104 games while only losing 12, which includes a 25-3 record with the Huskies. In 2023, he led Washington to the College Football Playoff National Championship Game, won the Pac-12 Championship and recorded the most wins in a season in program history (14).</p>

<p>"I have always had an incredible respect for Alabama football and its commitment to excellence," DeBoer said. "The tradition-rich history of this program is unmatched across the landscape of college athletics, and I look forward to continue that moving forward. Following Coach Saban is an honor. He has been the standard for college football, and his success is unprecedented. I would not have left Washington for just any school. The chance to lead the football program at The University of Alabama is the opportunity of a lifetime. My family and I feel truly blessed and look forward to becoming a part of the Tuscaloosa community. I want to thank Director of Athletics Greg Byrne, President Stuart R. Bell, Chancellor Finis St. John and The University of Alabama System Board of Trustees for their belief in me to lead this program."</p>

<p>DeBoer became the first Washington coach to win 11-or-more games in consecutive seasons, after going 11-2 in 2022 and 14-1 in 2023, and the first to win a bowl game in his initial season with the Huskies. That success resulted in back-to-back Pac-12 Coach of the Year honors. His Washington squads also went 10-1 against ranked teams while DeBoer owns an 18-3 record in playoff games as a head coach.</p>

<p>"I am thrilled to welcome Kalen DeBoer as the new leader of the Crimson Tide football program," said UA President Stuart R. Bell. "With great enthusiasm for the future, we are confident that Coach DeBoer will uphold the proud tradition and standard of excellence synonymous with Alabama Athletics. I extend my sincere gratitude to Athletic Director Greg Byrne for his exceptional leadership throughout this process. Additionally, we appreciate Chancellor Finis St. John and The University of Alabama System Board of Trustees for their continued support of our great institution."</p>

<p>Coach DeBoer has proven to be nothing but a winner in his coaching career, producing success at every stop along the way. Along with winning the Pac-12 and the Sugar Bowl over No. 3 Texas in New Orleans, his 2023 Washington squad recorded two top-10 wins over Oregon along with victories against No. 12 Oregon State, No. 13 Utah and No. 24 USC.</p>

<p>He guided Michael Penix Jr. to the Maxwell Award and a record-setting season with 4,903 yards passing, 36 touchdowns and a 157.1 passer rating. Receiver Rome Odunze caught 92 passes for 1,640 yards and 13 touchdowns while running back Killon Johnson gained 1,195 yards with 16 scores.</p>

<p>In his first year at UW, he led the Huskies to an 11-2 overall record, including a 3-0 mark against ranked teams, and a win over Texas in the Valero Alamo Bowl. His Huskies swept its three Northwest rivals and finished in a tie for second in the Pac-12, while DeBore was named Pac-12 Co-Coach of the Year. Not only were the 11 wins in 2022 three more than any previous first-year head coach had compiled at UW, DeBoer was also the only UW football coach ever to win a bowl game in his first season.</p>

<p>Prior to his time with the Huskies, DeBoer spent two seasons at Fresno State from 2020-21. Including the pandemic-shortened 2020 season, DeBoer's teams made great strides on both sides of the ball, posting a 12-6 record.<br>
 <br>
In 2021, Fresno State went 9-3 and earned a berth in the New Mexico Bowl. The offense finished first in the MWC and 14th in the nation in total offense (464.8 yards per game) along with second in the conference and 26th in FBS in scoring (30.5 points per game). The Bulldogs' passing offense ranked second in conference and ninth in the country, averaging 326.7 yards per game.<br>
 <br>
The offense, and passing game in particular, also flourished in 2020, as it produced a conference-best 479.3 yards total offense per game and the league's second-highest points per game total (32.8). Fresno State also led the Mountain West in passing yards per game and ranked fifth in the FBS in that category with 356.3 per game.<br>
 <br>
In DeBoer's two seasons in Fresno, the defense also made vast improvements in nearly every team defensive category compared to the 2019 squad, the year before his arrival.<br>
 <br>
Before leading Fresno State's program, DeBoer was on staff at Indiana University as offensive coordinator and quarterbacks coach. He helped guide the Hoosiers to an 8-5 record and a berth in the Gator Bowl.<br>
 <br>
The Hoosiers' eight victories in 2019 matched their highest win total in 26 seasons, and IU ranked No. 3 in the Big Ten in total offense. Indiana averaged 432.8 yards of total offense per game, throwing for 302.4 yards per contest while rushing for 130.4.<br>
 <br>
DeBoer joined then-head coach Jeff Tedford as the Fresno State offensive coordinator and quarterbacks coach. In two seasons in that role, DeBoer helped the Bulldogs to overall records of 10-4 (2017) and 12-2 (2018), along with two division titles, two bowl game victories and the Mountain West Conference Championship in 2018.<br>
 <br>
DeBoer's two years as the Bulldogs' offensive coordinator concluded with a Mountain West Championship and Las Vegas Bowl win to cap a 22-6 run during the 2017-18 seasons. Those two seasons included double-digit winning seasons each year, coming off a 1-11 campaign in 2016, the year prior to Tedford's (and DeBoer's) arrival.<br>
 <br>
Fresno State reached unprecedented heights in year two with DeBoer as the coordinator. The Bulldogs posted a school-record 12 victories and finished ranked No. 18 in both polls.<br>
 <br>
A school-record setting wide receiver at the University of Sioux Falls (S.D.), DeBoer later led his alma mater to three NAIA National Championships in five seasons as head coach, winning titles in 2006, 2008 and 2009, while also finishing as runner-up in 2007 and making the semifinals in his first season as head coach in 2005.<br>
 <br>
During his five seasons at Sioux Falls, DeBoer compiled a 67-3 overall record, including a 49-1 mark in Great Plains Athletic Conference play. He was NAIA National Coach of the Year in each of his three championship seasons at USF.<br>
 <br>
DeBoer coached three NAIA National Players of the Year winners in quarterbacks Lorenzo Brown (2009) and Chad Cavender (2007) and running back Nick Kortan (2002). During his time at USF, he helped develop 25 first team All-Americans.<br>
 <br>
After the 2009 season, he took a job at Southern Illinois as offensive coordinator and wide receivers coach from 2010 through 2013. He moved to Eastern Michigan as offensive coordinator and quarterbacks coach from 2014 through 2016, helping the Eagles to their third-ever bowl-game berth in 2016. That year, the Eagles posted their first .500-or-better season since 1995 and tied the Football Bowl Subdivision mark for biggest turnarounds in 2016, improving on its one-win season in 2015.<br>
 <br>
A 1998 graduate of Sioux Falls with a degree in secondary education, DeBoer was a record-setting football and baseball student-athlete. During his football career, he compiled 3,400 yards and 33 touchdowns on 234 career receptions – all school records at the time – and played on the 1996 NAIA Division II National Championship team. He also played baseball for the Cougars, batting .520 (still a school record) as a senior in 1998. His career average of .492 is tops in USF history, as are his 37 career homers and .944 slugging percentage.</p>

<p>DeBoer and his wife, Nicole, have two daughters, Alexis and Avery.</p>

<p>While appropriate members of The Board of Trustees have been notified of the proposed terms and conditions of this proposed appointment, the financial terms remain subject to approval by The Board of Trustees.</p>

ending the last two seasons at Washington.\u003C\u002Fp>\r\n\r\n\u003Cp>\"We are excited to welcome Kalen and Nicole DeBoer, and their daughters, Alexis and Avery, to The University of Alabama,\" said Byrne. \"Coach DeBoer has proven he is a winner and has done an incredible job as a head coach at each of his stops. One of the things I told our team the other day is we are going to get someone who is not only a great coach with the Xs and Os, but also someone who cares about his players and someone I'd want my sons to play for, just like I would have wanted them to play for Coach Saban. We got that in Coach DeBoer. He is ready to get to work, and we look forward to him leading the Alabama Crimson Tide football program for years to come. We are grateful to our leadership in President Stuart R. Bell, Chancellor Finis St. John and The University of Alabama System Board of Trustees for their support during this process.\"\u003C\u002Fp>\r\n\r\n\u003Cp>In his nine seasons as a head coach, DeBoer has won 104 games while only losing 12, which includes a 25-3 record with the Huskies. In 2023, he led Washington to the College Football Playoff National Championship Game, won the Pac-12 Championship and recorded the most wins in a season in program history (14).\u003C\u002Fp>\r\n\r\n\u003Cp>\"I have always had an incredible respect for Alabama football and its commitment to excellence,\" DeBoer said. \"The tradition-rich history of this program is unmatched across the landscape of college athletics, and I look forward to continue that moving forward. Following Coach Saban is an honor. He has been the standard for college football, and his success is unprecedented. I would not have left Washington for just any school. The chance to lead the football program at The University of Alabama is the opportunity of a lifetime. My family and I feel truly blessed and look forward to becoming a part of the Tuscaloosa community. I want to thank Director of Athletics Greg Byrne, President Stuart R. Bell, Chancellor Finis St. John and The University of Alabama System Board of Trustees for their belief in me to lead this program.\"\u003C\u002Fp>\r\n\r\n\u003Cp>DeBoer became the first Washington coach to win 11-or-more games in consecutive seasons, after going 11-2 in 2022 and 14-1 in 2023, and the first to win a bowl game in his initial season with the Huskies. That success resulted in back-to-back Pac-12 Coach of the Year honors. His Washington squads also went 10-1 against ranked teams while DeBoer owns an 18-3 record in playoff games as a head coach.\u003C\u002Fp>\r\n\r\n\u003Cp>\"I am thrilled to welcome Kalen DeBoer as the new leader of the Crimson Tide football program,\" said UA President Stuart R. Bell. \"With great enthusiasm for the future, we are confident that Coach DeBoer will uphold the proud tradition and standard of excellence synonymous with Alabama Athletics. I extend my sincere gratitude to Athletic Director Greg Byrne for his exceptional leadership throughout this process. Additionally, we appreciate Chancellor Finis St. John and The University of Alabama System Board of Trustees for their continued support of our great institution.\"\u003C\u002Fp>\r\n\r\n\u003Cp>Coach DeBoer has proven to be nothing but a winner in his coaching career, producing success at every stop along the way. Along with winning the Pac-12 and the Sugar Bowl over No. 3 Texas in New Orleans, his 2023 Washington squad recorded two top-10 wins over Oregon along with victories against No. 12 Oregon State, No. 13 Utah and No. 24 USC.\u003C\u002Fp>\r\n\r\n\u003Cp>He guided Michael Penix Jr. to the Maxwell Award and a record-setting season with 4,903 yards passing, 36 touchdowns and a 157.1 passer rating. Receiver Rome Odunze caught 92 passes for 1,640 yards and 13 touchdowns while running back Killon Johnson gained 1,195 yards with 16 scores.\u003C\u002Fp>\r\n\r\n\u003Cp>In his first year at UW, he led the Huskies to an 11-2 overall record, including a 3-0 mark against ranked teams, and a win over Texas in the Valero Alamo Bowl. His Huskies swept its three Northwest rivals and finished in a tie for second in the Pac-12, while DeBore was named Pac-12 Co-Coach of the Year. Not only were the 11 wins in 2022 three more than any previous first-year head coach had compiled at UW, DeBoer was also the only UW football coach ever to win a bowl game in his first season.\u003C\u002Fp>\r\n\r\n\u003Cp>Prior to his time with the Huskies, DeBoer spent two seasons at Fresno State from 2020-21. Including the pandemic-shortened 2020 season, DeBoer's teams made great strides on both sides of the ball, posting a 12-6 record.\u003Cbr>\r\n \u003Cbr>\r\nIn 2021, Fresno State went 9-3 and earned a berth in the New Mexico Bowl. The offense finished first in the MWC and 14th in the nation in total offense (464.8 yards per game) along with second in the conference and 26th in FBS in scoring (30.5 points per game). The Bulldogs' passing offense ranked second in conference and ninth in the country, averaging 326.7 yards per game.\u003Cbr>\r\n \u003Cbr>\r\nThe offense, and passing game in particular, also flourished in 2020, as it produced a conference-best 479.3 yards total offense per game and the league's second-highest points per game total (32.8). Fresno State also led the Mountain West in passing yards per game and ranked fifth in the FBS in that category with 356.3 per game.\u003Cbr>\r\n \u003Cbr>\r\nIn DeBoer's two seasons in Fresno, the defense also made vast improvements in nearly every team defensive category compared to the 2019 squad, the year before his arrival.\u003Cbr>\r\n \u003Cbr>\r\nBefore leading Fresno State's program, DeBoer was on staff at Indiana University as offensive coordinator and quarterbacks coach. He helped guide the Hoosiers to an 8-5 record and a berth in the Gator Bowl.\u003Cbr>\r\n \u003Cbr>\r\nThe Hoosiers' eight victories in 2019 matched their highest win total in 26 seasons, and IU ranked No. 3 in the Big Ten in total offense. Indiana averaged 432.8 yards of total offense per game, throwing for 302.4 yards per contest while rushing for 130.4.\u003Cbr>\r\n \u003Cbr>\r\nDeBoer joined then-head coach Jeff Tedford as the Fresno State offensive coordinator and quarterbacks coach. In two seasons in that role, DeBoer helped the Bulldogs to overall records of 10-4 (2017) and 12-2 (2018), along with two division titles, two bowl game victories and the Mountain West Conference Championship in 2018.\u003Cbr>\r\n \u003Cbr>\r\nDeBoer's two years as the Bulldogs' offensive coordinator concluded with a Mountain West Championship and Las Vegas Bowl win to cap a 22-6 run during the 2017-18 seasons. Those two seasons included double-digit winning seasons each year, coming off a 1-11 campaign in 2016, the year prior to Tedford's (and DeBoer's) arrival.\u003Cbr>\r\n \u003Cbr>\r\nFresno State reached unprecedented heights in year two with DeBoer as the coordinator. The Bulldogs posted a school-record 12 victories and finished ranked No. 18 in both polls.\u003Cbr>\r\n \u003Cbr>\r\nA school-record setting wide receiver at the University of Sioux Falls (S.D.), DeBoer later led his alma mater to three NAIA National Championships in five seasons as head coach, winning titles in 2006, 2008 and 2009, while also finishing as runner-up in 2007 and making the semifinals in his first season as head coach in 2005.\u003Cbr>\r\n \u003Cbr>\r\nDuring his five seasons at Sioux Falls, DeBoer compiled a 67-3 overall record, including a 49-1 mark in Great Plains Athletic Conference play. He was NAIA National Coach of the Year in each of his three championship seasons at USF.\u003Cbr>\r\n \u003Cbr>\r\nDeBoer coached three NAIA National Players of the Year winners in quarterbacks Lorenzo Brown (2009) and Chad Cavender (2007) and running back Nick Kortan (2002). During his time at USF, he helped develop 25 first team All-Americans.\u003Cbr>\r\n \u003Cbr>\r\nAfter the 2009 season, he took a job at Southern Illinois as offensive coordinator and wide receivers coach from 2010 through 2013. He moved to Eastern Michigan as offensive coordinator and quarterbacks coach from 2014 through 2016, helping the Eagles to their third-ever bowl-game berth in 2016. That year, the Eagles posted their first .500-or-better season since 1995 and tied the Football Bowl Subdivision mark for biggest turnarounds in 2016, improving on its one-win season in 2015.\u003Cbr>\r\n \u003Cbr>\r\nA 1998 graduate of Sioux Falls with a degree in secondary education, DeBoer was a record-setting football and baseball student-athlete. During his football career, he compiled 3,400 yards and 33 touchdowns on 234 career receptions – all school records at the time – and played on the 1996 NAIA Division II National Championship team. He also played baseball for the Cougars, batting .520 (still a school record) as a senior in 1998. His career average of .492 is tops in USF history, as are his 37 career homers and .944 slugging percentage.\u003C\u002Fp>\r\n\r\n\u003Cp>DeBoer and his wife, Nicole, have two daughters, Alexis and Avery.\u003C\u002Fp>\r\n\r\n\u003Cp>While appropriate members of The Board of Trustees have been notified of the proposed terms and conditions of this proposed appointment, the financial terms remain subject to approval by The Board of Trustees.\u003C\u002Fp>\r\n",48270,"\u003Cstrong>TUSCALOOSA, Ala.\u003C\u002Fstrong> - Kalen DeBoer, winner of the 2023 Associated Press, AFCA, Eddie Robinson, George Munger, Walter Camp and Home Depot Coach of the Year awards, has been selected as head football coach for the Alabama Crimson Tide, Director of Athletics Greg Byrne announced on Friday. DeBoer comes to Tuscaloosa after spending the last two seasons at Washington.",{"id":184,"title":186,"abbreviation":180,"shortTitle":186,"shortname":183,"facebook":181,"twitter":188,"gender":171,"pinterest":18,"instagram":185,"youtube":18,"globalSportShortname":183,"globalSportNameSlug":183,"tickets":187,"youtubePlaylistId":382,"g
