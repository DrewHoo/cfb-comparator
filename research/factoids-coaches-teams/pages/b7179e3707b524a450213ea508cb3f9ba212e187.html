e \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5451\" rel=\"smarttag\" rev=\"5451\">Kendall Milton\u003C\u002Fa>\u003C\u002Fdfn> and junior \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5450\" rel=\"smarttag\" rev=\"5450\">Kenny McIntosh\u003C\u002Fa>\u003C\u002Fdfn> share the load.\u003Cbr>\r\n\u003Cbr>\r\nWhite, McIntosh and sophomore \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5426\" rel=\"smarttag\" rev=\"5426\">Daijun Edwards\u003C\u002Fa>\u003C\u002Fdfn> all scored rushing touchdowns at Vanderbilt, along with WR \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5449\" rel=\"smarttag\" rev=\"5449\">Ladd McConkey\u003C\u002Fa>\u003C\u002Fdfn> and TE \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5495\" rel=\"smarttag\" rev=\"5495\">Brock Bowers\u003C\u002Fa>\u003C\u002Fdfn>.\u003Cbr>\r\n\u003Cbr>\r\nDuring the win over No. 3 Clemson, White headlined the group with 74 yards on 13 carries, including a total of 32 yards on Georgia's final drive of the game when they ran out the last 4:49 of the game.\u003Cbr>\r\n\u003Cbr>\r\nMilton was the leading rusher in the win over the Gamecocks with 10 carries for 66 yards as the Bulldogs tallied 184 yards on 31 carries (5.9 avg.). Milton did not play at Vanderbilt. This performance included a 23-yard scoring scamper by Cook, who also caught a 4-yard touchdown pass.\r\n\u003Cdiv class=\"fb-stats-section-title\">A Look At The Offensive Line\u003C\u002Fdiv>\r\n\u003Cbr>\r\nThere is plenty of competition for playing time on the offensive line for second-year Offensive Line coach \u003Cdfn>\u003Ca href=\"\u002Fcoaches.aspx?rc=2808\" rel=\"smarttag\" rev=\"2808\">Matt Luke\u003C\u002Fa>\u003C\u002Fdfn>.\u003Cbr>\r\n\u003Cbr>\r\nSenior \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5467\" rel=\"smarttag\" rev=\"5467\">Jamaree Salyer\u003C\u002Fa>\u003C\u002Fdfn> (LT), redshirt freshman \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5461\" rel=\"smarttag\" rev=\"5461\">Tate Ratledge\u003C\u002Fa>\u003C\u002Fdfn> (LG), redshirt freshman \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5480\" rel=\"smarttag\" rev=\"5480\">Sedrick Van Pran\u003C\u002Fa>\u003C\u002Fdfn> (C), fifth-year senior \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5469\" rel=\"smarttag\" rev=\"5469\">Justin Shaffer\u003C\u002Fa>\u003C\u002Fdfn> (RG) and redshirt sophomore \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5448\" rel=\"smarttag\" rev=\"5448\">Warren McClendon\u003C\u002Fa>\u003C\u002Fdfn> (RT) were the starters versus Clemson.\u003Cbr>\r\n\u003Cbr>\r\nVan Pran emerged as an option at C after Ericson sustained an injury during preseason camp. After Van Pran got the start at C in the season opener, Ericson had to replace Ratledge at LG in the first quarter after Ratledge went down with a right foot injury and has not played since that game. Ericson has started the last three games at RG.\u003Cbr>\r\n\u003Cbr>\r\nMcClendon was a 2020 Freshman All-American after starting the last nine games. Salyer and Shaffer have each started 16 career games.\r\n\u003Cdiv class=\"fb-stats-section-title\">Ton Of Targets\u003C\u002Fdiv>\r\n\u003Cbr>\r\nGeorgia has completed passes to a minimum of nine different Bulldogs in each game this season.\u003Cbr>\r\n\u003Cbr>\r\n\u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5436\" rel=\"smarttag\" rev=\"5436\">Kearis Jackson\u003C\u002Fa>\u003C\u002Fdfn>, \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5403\" rel=\"smarttag\" rev=\"5403\">Dominick Blaylock\u003C\u002Fa>\u003C\u002Fdfn> and \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5457\" rel=\"smarttag\" rev=\"5457\">George Pickens\u003C\u002Fa>\u003C\u002Fdfn> are working their way back to getting 100 percent from injuries.\u003Cbr>\r\n\u003Cbr>\r\nIn the meantime, sophomores \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5411\" rel=\"smarttag\" rev=\"5411\">Jermaine Burton\u003C\u002Fa>\u003C\u002Fdfn> and \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5466\" rel=\"smarttag\" rev=\"5466\">Marcus Rosemy-Jacksaint\u003C\u002Fa>\u003C\u002Fdfn> and redshirt freshmen \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5449\" rel=\"smarttag\" rev=\"5449\">Ladd McConkey\u003C\u002Fa>\u003C\u002Fdfn>, \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5471\" rel=\"smarttag\" rev=\"5471\">Arian Smith\u003C\u002Fa>\u003C\u002Fdfn> and \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5464\" rel=\"smarttag\" rev=\"5464\">Justin Robinson\u003C\u002Fa>\u003C\u002Fdfn> will be in the mix with true freshman AD Mitchell.\u003Cbr>\r\n\u003Cbr>\r\nMcConkey became the third Bulldog to have a receiving and rushing touchdown in the same game in the matchup versus Vanderbilt. Both he and freshman TE \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5495\" rel=\"smarttag\" rev=\"5495\">Brock Bowers\u003C\u002Fa>\u003C\u002Fdfn> accomplished the feat versus the Commodores.\u003Cbr>\r\n\u003Cbr>\r\nBurton caught his second touchdown passes in as many games against South Carolina and Mitchell posted career highs of four catches for 77 yards and a score versus the Gamecocks.\u003Cbr>\r\n\u003Cbr>\r\nJackson and McConkey are sharing the punt return duties as well.\r\n\u003Cdiv class=\"fb-stats-section-title\">Productive Start To Bowers' Career\u003C\u002Fdiv>\r\n\u003Cbr>\r\nFreshman TE \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5495\" rel=\"smarttag\" rev=\"5495\">Brock Bowers\u003C\u002Fa>\u003C\u002Fdfn> has a team-best 18 catches for 272 yards and five touchdowns (four rec., one rush) and has started all four games.\u003Cbr>\r\n\u003Cbr>\r\nAgainst #3 Clemson, he led the Bulldogs with six catches for 43 yards in the victory. His first touchdown catch of his career was an 89 yarder from \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5401\" rel=\"smarttag\" rev=\"5401\">Stetson Bennett\u003C\u002Fa>\u003C\u002Fdfn> versus UAB. This was the ninthlongest passing TD in school history.\u003Cbr>\r\n\u003Cbr>\r\nAt Vanderbilt, Bowers had a 12-yard rushing touchdown on his first career carry and for the second week in a row he was the leading receiver with four catches for 69 yards and two touchdowns.\u003Cbr>\r\n\u003Cbr>\r\nBowers has three touchdown receptions of 25+ yards and was the first Bulldog since Sony Michel (2017 vs. UK) to score three touchdowns in a game.\u003Cbr>\r\n\u003Cbr>\r\nBowers became just the eighth true freshman to start a season opener in the \u003Cdfn>\u003Ca href=\"\u002Fcoaches.aspx?rc=2766\" rel=\"smarttag\" rev=\"2766\">Kirby Smart\u003C\u002Fa>\u003C\u002Fdfn> era. Bowers saw increased reps during fall camp when junior \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5428\" rel=\"smarttag\" rev=\"5428\">John FitzPatrick\u003C\u002Fa>\u003C\u002Fdfn> and sophomore \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5488\" rel=\"smarttag\" rev=\"5488\">Darnell Washington\u003C\u002Fa>\u003C\u002Fdfn> missed time with injuries.\u003C\u002Fdiv>\r\n\u003C\u002Fdiv>\r\n\u003Cbutton class=\"expandable-menu\" type=\"button\">DEFENSE \u003Ci class=\"sf-arrows-down-thin\">\u003C\u002Fi>\u003C\u002Fbutton>\r\n\r\n\u003Cdiv class=\"expanded-menu-items\">\r\n\u003Cdiv class=\"expanded-item-inner\">\r\n\u003Cp>\r\n\r\n\u003Cdiv class=\"fb-stats-section-title\">Creating Havoc Again In 2021\u003C\u002Fdiv>\r\n\u003Cbr>\r\nDefensive coordinator \u003Cdfn>\u003Ca href=\"\u002Fcoaches.aspx?rc=2785\" rel=\"smarttag\" rev=\"2785\">Dan Lanning\u003C\u002Fa>\u003C\u002Fdfn> is now in his fourth year and the Bulldogs feature the nation's top Scoring Defense allowing just 5.8 points\u002Fgame. Georgia is second in Passing Defense (115.8 y\u002Fg) and seventh in Rushing Defense (69.5 y\u002Fg).\u003Cbr>\r\n\u003Cbr>\r\nGeorgia is tied for ninth nationally with 15 sacks.\u003Cbr>\r\n\u003Cbr>\r\nThe Georgia defense has allowed just one touchdown this year. The Bulldogs' first two opponents did not score until the fourth quarter. UAB's only touchdown came on a pick-six. Clemson managed only a field goal. All 13 of South Carolina's points came after three turnovers, including two field goals and a fourth quarter touchdown. Following a 62-0 shutout at Vanderbilt, three of Georgia's opponents have failed to score before halftime.\u003Cbr>\r\n\u003Cbr>\r\nHead coach \u003Cdfn>\u003Ca href=\"\u002Fcoaches.aspx?rc=2766\" rel=\"smarttag\" rev=\"2766\">Kirby Smart\u003C\u002Fa>\u003C\u002Fdfn> stresses the importance of making havoc plays and how those plays give the defense momentum. Turnovers (interceptions, forced fumbles), deflections, tackles for loss, including sacks, are examples of havoc plays.\u003Cbr>\r\n \r\n\u003Ctable class=\"fb-stats-table\">\r\n\t\u003Ctbody>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd colspan=\"3\" style=\"color: #fff; background-color: #cc0000; padding: 10px; font-weight: bold;\">Havoc Summary In 2021\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Cth>Game\u003C\u002Fth>\r\n\t\t\t\u003Cth>Georgia\u003C\u002Fth>\r\n\t\t\t\u003Cth>Final Score\u003C\u002Fth>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>vs. #3 Clemson\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>1 INT (1 TD), 8 TFLs, 7 Sacks\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>W, 10-3\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>vs. UAB\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>3 INT (1 TD), 6 TFLs, 3 Sacks\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>Georgia 56-7\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>vs. South Carolina\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>1 INT, 6 TFLs, 3 Sacks\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>Georgia 40-13\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>@ Vanderbilt\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>2 INTs, 4 TFLs, 1 Sack\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>Georgia 62-0\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\u003C\u002Ftbody>\r\n\u003C\u002Ftable>\r\n\r\n\u003Cdiv class=\"fb-stats-section-title\">Secondary Finding Their Way\u003C\u002Fdiv>\r\n\u003Cbr>\r\nWhile some may refer to Georgia as \"RBU\", one could make a case for \"DBU\" with the recent Bulldogs now in the NFL including four who were drafted last season (\u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=4767\" rel=\"smarttag\" rev=\"4767\">Eric Stokes\u003C\u002Fa>\u003C\u002Fdfn>, 1st Round, Green Bay; \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=4702\" rel=\"smarttag\" rev=\"4702\">Tyson Campbell\u003C\u002Fa>\u003C\u002Fdfn>, 2nd Round, Jacksonville; \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=4733\" rel=\"smarttag\" rev=\"4733\">Richard LeCounte\u003C\u002Fa>\u003C\u002Fdfn>, 5th round, Cleveland; \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=4781\" rel=\"smarttag\" rev=\"4781\">Mark Webb\u003C\u002Fa>\u003C\u002Fdfn>, 7th round, L.A. Chargers).\u003Cbr>\r\n\u003Cbr>\r\nThe Bulldogs lead the SEC with seven interceptions. Most recently, senior \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5472\" rel=\"smarttag\" rev=\"5472\">Christopher Smith\u003C\u002Fa>\u003C\u002Fdfn> and freshman \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5378\" rel=\"smarttag\" rev=\"5378\">Kamari Lassiter\u003C\u002Fa>\u003C\u002Fdfn> each snagged one in the 62-0 win over the Commodores. Junior \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5418\" rel=\"smarttag\" rev=\"5418\">Lewis Cine\u003C\u002Fa>\u003C\u002Fdfn> and freshman \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5462\" rel=\"smarttag\" rev=\"5462\">Kelee Ringo\u003C\u002Fa>\u003C\u002Fdfn> each had an interception versus UAB after Smith scored the game's only touchdown with a 74-yard INT return for a TD against #3 Clemson.\u003Cbr>\r\n\u003Cbr>\r\nTo help offset these losses, Georgia landed a pair talented players via the transfer portal in All-ACC first teamer \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5576\" rel=\"smarttag\" rev=\"5576\">Derion Kendrick\u003C\u002Fa>\u003C\u002Fdfn> (Clemson) and All-America \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5577\" rel=\"smarttag\" rev=\"5577\">Tykee Smith\u003C\u002Fa>\u003C\u002Fdfn> (West Virginia). However, Smith went down with a foot injury in camp and has yet to play.\u003Cbr>\r\n\u003Cbr>\r\nKendrick has his first career pick for the Bulldogs (fourth of his career after snagging three for Clemson) during the win over USC.\u003Cbr>\r\n\u003Cbr>\r\nSmith scored the only touchdown in the win over No. 3 Clemson on a 74-yard interception return (the first pick of his career). He earned SEC Defensive Player of the Week honors following his performance. Cine had a team-high nine tackles and two pass breakups while Brini tallied four stops and Speed had a pair of tackles.\u003Cbr>\r\n\u003Cbr>\r\nSeniors \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5405\" rel=\"smarttag\" rev=\"5405\">Latavious Brini\u003C\u002Fa>\u003C\u002Fdfn> and \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5474\" rel=\"smarttag\" rev=\"5474\">Ameer Speed\u003C\u002Fa>\u003C\u002Fdfn> are manning the cornerback spots for the Bulldogs during their final seasons.\r\n\u003Cdiv class=\"fb-stats-section-title\">Making An Impact Up Front\u003C\u002Fdiv>\r\n\u003Cbr>\r\nPreseason All-American \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5423\" rel=\"smarttag\" rev=\"5423\">Jordan Davis\u003C\u002Fa>\u003C\u002Fdfn> joins fifth-year \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5493\" rel=\"smarttag\" rev=\"5493\">Devonte Wyatt\u003C\u002Fa>\u003C\u002Fdfn> as the veterans in the center of the defensive line. The pair combined for six tackles, including two tackles for loss and a sack, and a pass breakup against No. 3 Clemson. Davis was named the Bronko Nagurski National Defensive Player of the Week as well as the SEC Defensive Lineman of the Week after his effort against the Tigers.\u003Cbr>\r\n\u003Cbr>\r\nThe duo is joined by junior \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5485\" rel=\"smarttag\" rev=\"5485\">Travon Walker\u003C\u002Fa>\u003C\u002Fdfn>, sophomore \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5415\" rel=\"smarttag\" rev=\"5415\">Jalen Carter\u003C\u002Fa>\u003C\u002Fdfn>, junior \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5487\" rel=\"smarttag\" rev=\"5487\">Tramel Walthour\u003C\u002Fa>\u003C\u002Fdfn> and sophomore \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5475\" rel=\"smarttag\" rev=\"5475\">Nazir Stackhouse\u003C\u002Fa>\u003C\u002Fdfn> who comprise the rotation of the Bulldog front. Walker had four tackles and a sack in the 2021 opener while Carter chipped in with two stops, including a sack.\u003Cbr>\r\n\u003Cbr>\r\nCarter tied for the team lead with three stops against Vanderbilt, including one of the team's four tackles for loss.\u003Cbr>\r\n\u003Cbr>\r\nClemson was held to two yards rushing as Georgia's defense tallied seven sacks.\u003Cbr>\r\n\u003Cbr>\r\nDavis shared a sack with teammate \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5473\" rel=\"smarttag\" rev=\"5473\">Nolan Smith\u003C\u002Fa>\u003C\u002Fdfn> that led to a South Carolina safety as Davis and Wyatt combined for four stops and two TFLs in the win over the Gamecocks.\r\n\u003Cdiv class=\"fb-stats-section-title\">Bulldog Backers\u003C\u002Fdiv>\r\n\u003Cbr>\r\nSenior ILB \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5478\" rel=\"smarttag\" rev=\"5478\">Channing Tindall\u003C\u002Fa>\u003C\u002Fdfn> shares the team lead in tackles (19) with junior S \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5418\" rel=\"smarttag\" rev=\"5418\">Lewis Cine\u003C\u002Fa>\u003C\u002Fdfn>. He is joined by junior \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5425\" rel=\"smarttag\" rev=\"5425\">Nakobe Dean\u003C\u002Fa>\u003C\u002Fdfn> and junior \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5484\" rel=\"smarttag\" rev=\"5484\">Quay Walker\u003C\u002Fa>\u003C\u002Fdfn> in the middle. Dean was a semifinalist for the 2020 Butkus Award.\u003Cbr>\r\n\u003Cbr>\r\nTindall was the leading tackler in the rout of UAB as he had seven tackles and a sack. He followed that up with another seven stops against South Carolina.\u003Cbr>\r\n\u003Cbr>\r\nDean set the tone early against No. 3 Clemson as he finished with a pair of sacks and five tackles on the night.\u003Cbr>\r\n\u003Cbr>\r\nSenior \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5398\" rel=\"smarttag\" rev=\"5398\">Adam Anderson\u003C\u002Fa>\u003C\u002Fdfn> and junior \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5473\" rel=\"smarttag\" rev=\"5473\">Nolan Smith\u003C\u002Fa>\u003C\u002Fdfn> are filling the spot vacated by NFL second round pick \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=4749\" rel=\"smarttag\" rev=\"4749\">Azeez Ojulari\u003C\u002Fa>\u003C\u002Fdfn>. Through the first four games of 2021, Anderson has 12 tackles and three sacks while Smith has 15 stops and 2.5 sacks.\u003Cbr>\r\n\u003Cbr>\r\nSmith exploded for a career-high eight tackles against the Gamecocks in a performance that included 1.5 sacks and a forced fumble.\u003C\u002Fdiv>\r\n\u003C\u002Fdiv>\r\n\u003Cbutton class=\"expandable-menu\" type=\"button\">SPECIAL TEAMS \u003Ci class=\"sf-arrows-down-thin\">\u003C\u002Fi>\u003C\u002Fbutton>\r\n\r\n\u003Cdiv class=\"expanded-menu-items\">\r\n\u003Cdiv class=\"expanded-item-inner\">\r\n\u003Cp>\r\n\r\n\u003Cdiv class=\"fb-stats-section-title\">One Of Country's Top Punting Units Returns\u003C\u002Fdiv>\r\n\u003Cbr>\r\nSenior punter and 2020 Ray Guy Award finalist \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5413\" rel=\"smarttag\" rev=\"5413\">Jake Camarda\u003C\u002Fa>\u003C\u002Fdfn> was the SEC Special Teams Player of the Year last season. He posted an SEC best 46.6 average that ranked fourth in the country and was named a FWAA Second-Team All-American. Camarda is a preseason All-American at his position in 2021.\u003Cbr>\r\n\u003Cbr>\r\nCamarda had five punts for a net average of 43.4 and dropped four inside the 20-yard line with a long of 51 during the season-opening win over No. 3 Clemson. He was included on the Ray Guy Award's \"Ray's 8\" for his performance versus the Tigers.\u003Cbr>\r\n\u003Cbr>\r\nThis year, Camarda is averaging 45.5 yards\u002Fpunt placing eight inside in the 20 and five have been 50+. Georgia leads the SEC in net punting at 44.1. Camarda is averaging 45.5 yards\u002Fpunt, which is on pace for a school record. Drew Butler, the 2009 Ray Guy Award winner, owns the Bulldog record with a 45.4 mark.\u003Cbr>\r\n\u003Cbr>\r\nCamarda is also handling most of the UGA kickoffs this year.\r\n\u003Cdiv class=\"fb-stats-section-title\">Jack-Pod\u003C\u002Fdiv>\r\n\u003Cbr>\r\nFor his career, junior PK \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5458\" rel=\"smarttag\" rev=\"5458\">Jack Podlesny\u003C\u002Fa>\u003C\u002Fdfn> is 17-for-22 on field goals and 60-for-60 on PATs. This year, he is 4-for-6 on FGs and 22- for-22 on PATs. Podlesny made his debut in the 2020 season opening win at Arkansas and capped his first year by earning Offensive MVP honors at the Chick-fil-A Peach Bowl. In the 24-21 win over #8 Cincinnati, Podlesny accounted for 10 points, including the game-winning 53-yard FG with three seconds remaining.\u003Cbr>\r\n\u003Cbr>\r\nGeorgia entered the 2021 season with the NCAA record for Consecutive PATs Made. The streak now stands at 352 and involves six kickers (Marshall Morgan, Patrick Beless, William Ham, David Marvin, Rodrigo Blankenship and Podlesny) and dates back to 2014.\u003Cbr>\r\n\u003Cbr>\r\nGeorgia's snappers this year include returning starters junior \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5483\" rel=\"smarttag\" rev=\"5483\">Payne Walker\u003C\u002Fa>\u003C\u002Fdfn> and redshirt sophomore \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5453\" rel=\"smarttag\" rev=\"5453\">William Mote\u003C\u002Fa>\u003C\u002Fdfn>. Walker snaps on field goals and PATs while Mote handles the snaps for punts.\u003C\u002Fdiv>\r\n\u003C\u002Fdiv>\r\n\u003Cbutton class=\"expandable-menu\" type=\"button\">OTHER NOTES \u003Ci class=\"sf-arrows-down-thin\">\u003C\u002Fi>\u003C\u002Fbutton>\r\n\r\n\u003Cdiv class=\"expanded-menu-items\">\r\n\u003Cdiv class=\"expanded-item-inner\">\r\n\u003Cp>\r\n\r\n\u003Cdiv class=\"fb-stats-section-title\">Trio Of Preseason All-Americans\u003C\u002Fdiv>\r\n\u003Cbr>\r\nSenior punter \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5413\" rel=\"smarttag\" rev=\"5413\">Jake Camarda\u003C\u002Fa>\u003C\u002Fdfn> (1st Team) along with senior offensive lineman \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5467\" rel=\"smarttag\" rev=\"5467\">Jamaree Salyer\u003C\u002Fa>\u003C\u002Fdfn> (2nd Team) and senior defensive lineman \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5423\" rel=\"smarttag\" rev=\"5423\">Jordan Davis\u003C\u002Fa>\u003C\u002Fdfn> (2nd Team) have been named preseason All-Americans by the Associated Press. Camarda, a Ray Guy Award finalist in 2020, made the AP 3rd team a year ago when he was honored as the SEC's Special Teams Player of the Year as voted on the league coaches.\u003Cbr>\r\n\u003Cbr>\r\nThe Bulldogs also had four players earn 2021 Walter Camp Second Team All-America honors this preseason. Davis, Camarda and junior WR \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5457\" rel=\"smarttag\" rev=\"5457\">George Pickens\u003C\u002Fa>\u003C\u002Fdfn> were included on the squad. Pickens will be unavailable during the first portion of the season after tearing his ACL during the spring.\u003Cbr>\r\n\u003Cbr>\r\n\u003Cstrong>Bulldogs on 2021 National Award Watch Lists\u003C\u002Fstrong>\u003Cbr>\r\nBednarik Award (Defensive Player): \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5425\" rel=\"smarttag\" rev=\"5425\">Nakobe Dean\u003C\u002Fa>\u003C\u002Fdfn>, \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5423\" rel=\"smarttag\" rev=\"5423\">Jordan Davis\u003C\u002Fa>\u003C\u002Fdfn>\u003Cbr>\r\nButkus Award (LB): \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5398\" rel=\"smarttag\" rev=\"5398\">Adam Anderson\u003C\u002Fa>\u003C\u002Fdfn>, \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5425\" rel=\"smarttag\" rev=\"5425\">Nakobe Dean\u003C\u002Fa>\u003C\u002Fdfn>, \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5484\" rel=\"smarttag\" rev=\"5484\">Quay Walker\u003C\u002Fa>\u003C\u002Fdfn>\u003Cbr>\r\nLou Groza Award (Kicker): \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5458\" rel=\"smarttag\" rev=\"5458\">Jack Podlesny\u003C\u002Fa>\u003C\u002Fdfn>\u003Cbr>\r\nRay Guy Award (Punter): \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5413\" rel=\"smarttag\" rev=\"5413\">Jake Camarda\u003C\u002Fa>\u003C\u002Fdfn>\u003Cbr>\r\nLombardi Award (Lineman): \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5469\" rel=\"smarttag\" rev=\"5469\">Justin Shaffer\u003C\u002Fa>\u003C\u002Fdfn>, \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5467\" rel=\"smarttag\" rev=\"5467\">Jamaree Salyer\u003C\u002Fa>\u003C\u002Fdfn>)\u003Cbr>\r\nLott Trophy (Defensive Player): \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5425\" rel=\"smarttag\" rev=\"5425\">Nakobe Dean\u003C\u002Fa>\u003C\u002Fdfn>\u003Cbr>\r\nMackey Award (TE): \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5574\" rel=\"smarttag\" rev=\"5574\">Arik Gilbert\u003C\u002Fa>\u003C\u002Fdfn>, \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5488\" rel=\"smarttag\" rev=\"5488\">Darnell Washington\u003C\u002Fa>\u003C\u002Fdfn>\u003Cbr>\r\nManning Award (QB): \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5422\" rel=\"smarttag\" rev=\"5422\">JT Daniels\u003C\u002Fa>\u003C\u002Fdfn>\u003Cbr>\r\nMaxwell Award (Player of the Year): \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5422\" rel=\"smarttag\" rev=\"5422\">JT Daniels\u003C\u002Fa>\u003C\u002Fdfn>\u003Cbr>\r\nNagurski Trophy (Defensive Player): \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5423\" rel=\"smarttag\" rev=\"5423\">Jordan Davis\u003C\u002Fa>\u003C\u002Fdfn>, \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5425\" rel=\"smarttag\" rev=\"5425\">Nakobe Dean\u003C\u002Fa>\u003C\u002Fdfn>, \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5577\" rel=\"smarttag\" rev=\"5577\">Tykee Smith\u003C\u002Fa>\u003C\u002Fdfn>\u003Cbr>\r\nDavey O'Brien Award (QB): \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5422\" rel=\"smarttag\" rev=\"5422\">JT Daniels\u003C\u002Fa>\u003C\u002Fdfn>\u003Cbr>\r\nOutland Trophy (Interior Lineman): \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5423\" rel=\"smarttag\" rev=\"5423\">Jordan Davis\u003C\u002Fa>\u003C\u002Fdfn>, \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5467\" rel=\"smarttag\" rev=\"5467\">Jamaree Salyer\u003C\u002Fa>\u003C\u002Fdfn>, \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5469\" rel=\"smarttag\" rev=\"5469\">Justin Shaffer\u003C\u002Fa>\u003C\u002Fdfn>\u003Cbr>\r\nRimington Trophy (C): \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5427\" rel=\"smarttag\" rev=\"5427\">Warren Ericson\u003C\u002Fa>\u003C\u002Fdfn>\u003Cbr>\r\nJohnny Unitas Award (QB): \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5422\" rel=\"smarttag\" rev=\"5422\">JT Daniels\u003C\u002Fa>\u003C\u002Fdfn>\u003Cbr>\r\nDoak Walker Award (RB): \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5421\" rel=\"smarttag\" rev=\"5421\">James Cook\u003C\u002Fa>\u003C\u002Fdfn>, \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5491\" rel=\"smarttag\" rev=\"5491\">Zamir White\u003C\u002Fa>\u003C\u002Fdfn>\r\n\u003Cdiv class=\"fb-stats-section-title\">First-Time Starters\u003C\u002Fdiv>\r\n\u003Cbr>\r\nGeorgia had seven first-time starters in the 2021 season opener against No. 3 Clemson in Charlotte. The Bulldogs had 19 first-time starters in 2020, including seven in the opener. vs. #3 CU: Bowers, McConkey, Ratledge, Van Pran, Kendrick (1st at UGA), Speed, T. Walker\u003Cbr>\r\n\u003Cbr>\r\n\u003Cstrong>vs. #3 CU:\u003C\u002Fstrong> Bowers, McConkey, Ratledge, Van Pran, Kendrick (1st at UGA), Speed, T. Walker\u003Cbr>\r\n\u003Cstrong>vs. UAB:\u003C\u002Fstrong> none\u003Cbr>\r\n\u003Cstrong>vs. SC:\u003C\u002Fstrong> Mitchell\u003Cbr>\r\n\u003Cstrong>@ VU:\u003C\u002Fstrong> Ringo\r\n\r\n\u003Cdiv class=\"fb-stats-section-title\">The True Freshman Experience\u003C\u002Fdiv>\r\n\u003Cbr>\r\nDuring the 2021 season opener, six true freshmen saw action against the Tigers in Charlotte at Bank of America Stadium.\u003Cbr>\r\n\u003Cbr>\r\nIn 2020, a total of 10 true freshmen played for the Bulldogs.\r\n\u003Cdiv class=\"fb-stats-section-title\">Bulldog Captains\u003C\u002Fdiv>\r\n\u003Cbr>\r\n\u003Cstrong>vs. #3 CU:\u003C\u002Fstrong> \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5421\" rel=\"smarttag\" rev=\"5421\">James Cook\u003C\u002Fa>\u003C\u002Fdfn>, \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5422\" rel=\"smarttag\" rev=\"5422\">JT Daniels\u003C\u002Fa>\u003C\u002Fdfn> & \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5425\" rel=\"smarttag\" rev=\"5425\">Nakobe Dean\u003C\u002Fa>\u003C\u002Fdfn>\u003Cbr>\r\n\u003Cstrong>vs. UAB:\u003C\u002Fstrong> Jamaree Sayler, \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5491\" rel=\"smarttag\" rev=\"5491\">Zamir White\u003C\u002Fa>\u003C\u002Fdfn>, \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5472\" rel=\"smarttag\" rev=\"5472\">Christopher Smith\u003C\u002Fa>\u003C\u002Fdfn>\u003Cbr>\r\n\u003Cstrong>vs. SC:\u003C\u002Fstrong> \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5478\" rel=\"smarttag\" rev=\"5478\">Channing Tindall\u003C\u002Fa>\u003C\u002Fdfn>, \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5423\" rel=\"smarttag\" rev=\"5423\">Jordan Davis\u003C\u002Fa>\u003C\u002Fdfn>, \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5436\" rel=\"smarttag\" rev=\"5436\">Kearis Jackson\u003C\u002Fa>\u003C\u002Fdfn>\u003Cbr>\r\n\u003Cstrong>@ VU:\u003C\u002Fstrong> \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5413\" rel=\"smarttag\" rev=\"5413\">Jake Camarda\u003C\u002Fa>\u003C\u002Fdfn>, \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5428\" rel=\"smarttag\" rev=\"5428\">John FitzPatrick\u003C\u002Fa>\u003C\u002Fdfn>, \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5473\" rel=\"smarttag\" rev=\"5473\">Nolan Smith\u003C\u002Fa>\u003C\u002Fdfn>\r\n\r\n\u003Cdiv class=\"fb-stats-section-title\">Points Off Turnovers\u003C\u002Fdiv>\r\n\u003Cbr>\r\nGeorgia is +2 in turnover margin in 2021. The Bulldogs have scored 49 points off nine turnovers. Opponents have scored 20 points off seven Georgia miscues.\u003Cbr>\r\n\u003Cbr>\r\n\u003Cstrong>vs. #3 CU:\u003C\u002Fstrong> (W, 10-3) UGA got 7 points off 1 turnover; CU got no points off 2 turnovers.\u003Cbr>\r\n\u003Cstrong>vs. UAB:\u003C\u002Fstrong> (W, 56-7) UGA got 14 points off 3 turnovers; UAB got 7 points off 1 turnover\u003Cbr>\r\n\u003Cstrong>vs. SC:\u003C\u002Fstrong> (W, 40-13) UGA got 14 points off 2 turnovers; SC got 13 points off 3 turnovers\u003Cbr>\r\n\u003Cstrong>@ VU:\u003C\u002Fstrong> (W, 62-0) UGA got 14 points off 3 turnovers; VU got no points off 1 turnover\r\n\r\n\u003Cdiv class=\"fb-stats-section-title\">Big Plays\u003C\u002Fdiv>\r\n\u003Cbr>\r\nUGA has 12 plays that have covered 25 yards or more while opponents have 7.\u003Cbr>\r\n\u003Cbr>\r\n\u003Cstrong>GAME 1:\u003C\u002Fstrong> #5 Georgia vs. #3 Clemson (W, 10-3)\u003Cbr>\r\nUGA: 2 plays; Longest: 74-yard KOR TD (C. Smith)\u003Cbr>\r\n#3 CU: 1 play; 44-yard pass (Uiagalelei to Ngata)\u003Cbr>\r\n\u003Cbr>\r\n\u003Cstrong>GAME 2:\u003C\u002Fstrong> #2 Georgia vs. UAB (W, 56-7)\u003Cbr>\r\nUGA: 7 plays; 89-yard TD pass (Bennett to Bowers)\u003Cbr>\r\nUAB: 1 play; 61-yard INT return for TD (K. Swoopes)\u003Cbr>\r\n\u003Cbr>\r\n\u003Cstrong>GAME 3:\u003C\u002Fstrong> #2 Georgia vs. South Carolina (W, 40-13)\u003Cbr>\r\nUGA: 3 plays; 43-yd TD pass (Daniels to Burton)\u003Cbr>\r\nSC: 5 plays; 61-yd pass (Nolan to Vann)\u003Cbr>\r\n\u003Cbr>\r\n\u003Cstrong>GAME 4:\u003C\u002Fstrong> #2 Georgia @ Vanderbilt (W, 62-0)\u003Cbr>\r\nUGA: 5 plays; 29-yd TD pass (Bennett to Bowers)\u003Cbr>\r\nVU: 0 plays\u003C\u002Fdiv>\r\n\u003C\u002Fdiv>\r\n\u003C\u002Fdiv>\r\n\u003Cbr>\r\n\u003Cbr>\r\n\u003Cscript>\r\nvar acc = document.getElementsByClassName(\"expandable-menu\");\r\nvar i;\r\n\r\nfor (i = 0; i \u003C acc.length; i++) {\r\
