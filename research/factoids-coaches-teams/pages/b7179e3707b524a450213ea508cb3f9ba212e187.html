<div class="fb-stats-section-title">Georgia-Arkansas Series History</div>
<br>
Georgia leads the all-time series with Arkansas by a 11-4 margin. The two programs last met in Fayetteville to open the shortened 2020 season with the Bulldogs knocking off the Razorbacks 37-10. Arkansas left Sanford Stadium with a 31-24 win during its last trip to Athens in 2010. The first four clashes in the series came in bowl games starting with the 1969 Sugar Bowl, a 16-2 Arkansas win. Also of note, Georgia captured the 2002 SEC Championship with a 30-3 victory over the Razorbacks in Atlanta.<br>
<br>
This Saturday's showdown marks the second matchup between Bulldog head coach <dfn><a href="/coaches.aspx?rc=2766" rel="smarttag" rev="2766">Kirby Smart</a></dfn> and Arkansas' Sam Pittman, who spent the 2016-19 seasons at Georgia, the first three as the offensive line coach and the final year as Associate Head Coach in charge of the offensive line.<br>
<br>
Pittman is just one of several Razorbacks on staff with Georgia connections. Former Bulldog special teams coach Scott Fountain is the Assistant Head Coach/Special Teams Coordinator for the Razorbacks. Former Georgia assistant strength coaches Jamil Walker and Ed Ellis are on staff as Walker serves as the team's head strength coach while Ellis is the senior associate director. Former Bulldog Fernando Velasco serves as the team's Director of Player Development, while former Bulldog staffer Patrick Doherty is the Director of Football Operations.
<div class="fb-stats-section-title">Top 10 Foes In Smart Era</div>
<br>
Georgia is 11-6 against top-10 teams under <dfn><a href="/coaches.aspx?rc=2766" rel="smarttag" rev="2766">Kirby Smart</a></dfn>, including 3-0 at home. Most recently, the Bulldogs started the 2021 season by edging then No. 3 Clemson 10-3 in Charlotte, N.C., during the Duke's Mayo Classic. The Bulldogs ended last season with a 24-21 win over eighth-ranked and undefeated Cincinnati during the Chick-fil-A Peach Bowl in Atlanta. Georgia's highest-ranked win under Smart was over No. 2 Oklahoma (54-48, 2OT) in a CFP Semifinal at the 2018 Rose Bowl Game.
<div class="fb-stats-section-title">ESPN College GameDay Is Athens Bound</div>
<br>
This will mark the first time ESPN College GameDay will be in Athens since coming for the showdown of No. 4 Georgia versus No. 7 Auburn in 2020. The Bulldogs left the Tigers behind in that matchup 27-6. This marked the last top-10 matchup in Athens. The production was trimmed down because of the COVID-19 regulations and was set up in Sanford Stadium's west side plaza rather than the traditional Myer's Quad. GameDay was also in Charlotte for the top-five matchup against Clemson. This marks the sixth time that GameDay has come to Athens.
<div class="fb-stats-section-title">Dominating Defense</div>
<br>
Currently Georgia leads the nation in Scoring Defense giving up just 5.8 points per game. The defense has allowed just one touchdown this season and it came in the fourth quarter versus South Carolina with the Bulldogs leading 40-6. Georgia's opponents have advanced to the Red Zone only four times this season resulting in three field goals and turning it over once on downs.<br>
<br>
Georgia had held its first four opponents to a total of 23 points. Georgia topped UAB 56-7 and it is worth nothing that the Blazers' touchdown came on a pick-six.<br>
<br>
Most recently, Vanderbilt was held to 77 yards on 46 plays and just four first downs, including one by a penalty. That was the lowest total offense by a Bulldog opponent since 2009 when Georgia blanked Tennessee Tech 38-0 holding them to 55 yards on 47 plays. Georgia's win over the Commodores was the second-largest margin of victory in an SEC game in school history, trailing only the 75-0 win over Florida in 1942 in Jacksonville. Also, Georgia has now had six shutouts in Smart era, including four in the SEC.<br>
<br>
During the Bulldogs' win over No. 3 Clemson in Charlotte, N.C., the Tigers finished the night with just three points on 60 plays and 180 yards as Georgia tallied seven sacks. Clemson's three points were the fewest scored in the Dabo Swinney era and the fewest for the program since 2007.
<div class="fb-stats-section-title">Recognition During Arkansas Game</div>
<br>
A couple of in-game recognitions this Saturday will include the latest Circle of Honor inductees as well as a presentation of the 2020-21 recipients of the Joel Eaves Award.<br>
<br>
At halftime, Georgia will honor this year's 31 Bulldog Olympians and Paralympians who left Tokyo with 13 medals.

<button class="expandable-menu" type="button">HEAD COACH KIRBY SMART <i class="sf-arrows-down-thin"></i></button>

<div class="expanded-menu-items">

<p>

<div class="fb-stats-section-title">Head Coach <dfn><a href="/coaches.aspx?rc=2766" rel="smarttag" rev="2766">Kirby Smart</a></dfn></div>

<div style="width: 300px; float: left; margin-right: 20px; margin-bottom: 20px; border: thin solid #ddd; padding: 20px; max-width: 40%"><img alt="Head Coach Kirby Smart" src="https://georgiadogs.com/images/2019/8/26/smart_biophoto_300.png" style="display: inline-block; width: 100%; max-width: 300px;"><br>
<strong>Personal</strong><br>
Full Name: Kirby Paul Smart<br>
Birthdate: December 23, 1975<br>
Birthplace: Montgomery, Alabama<br>
Family: Wife: Mary Beth; Children: twins Weston and Julia (Feb. 8, 2008), and Andrew (May 25, 2012)<br>
High School: Bainbridge (Ga.)<br>
College: BBA Georgia '98; MS Arkansas State State '03<br>
<br>
<strong>Coaching Experience</strong><br>
1999 Georgia Admin. Asst.<br>
2000 Valdosta State Defensive Backs<br>
2001 Valdosta State Def. Coord.<br>
2002-03 FSU Grad. Assistant<br>
2004 Arkansas State Defensive Backs<br>
2005 Georgia Running Backs<br>
2006 Miami Dolphins Safeties<br>
2007 Alabama Asst. HC/DBs<br>
2008-13, '15 Alabama Def. Coord./ILBs<br>
2014 Alabama Asst. HC/Safeties<br>
2016-current Georgia Head Coach<br>
<br>
<strong>Playing Experience</strong><br>
Georgia (1995-98): Four-year letterman as defensive back. First team All-SEC in '98; 13 career interceptions; four-time member of SEC Academic Honor Roll.<br>
Bainbridge H.S. (1991-93): Three-year letterman in football, basketball, and baseball; first team Class AAAA All-State as a senior; 16 career interceptions.<br>
High School Coach: Sonny Smart (father)</div>
<br>
Three SEC Eastern Division championships, 52 wins, one SEC title, four bowl victories, and an appearance in one national championship game are more than respectable rewards over a five-year period. That's what Georgia got when it hired former Bulldog player and assistant coach <dfn><a href="/coaches.aspx?rc=2766" rel="smarttag" rev="2766">Kirby Smart</a></dfn> to head the program in December, 2015.<br>
<br>
The 2020 Bulldogs became Smart's fourth straight team to earn a New Year's Six bowl game. With a Chick-fil-A Peach Bowl victory, the 2020 Bulldog senior class tied the record for the most wins by a senior class in school history (44), set by the 2005 and 2019 teams. That was also Smart's fourth straight team to finish the regular season ranked in the top ten of the College Football Playoff rankings.<br>
<br>
Smart's 2019 Bulldogs became the first team in school history to win 11 or more games for a third straight season. The senior class posted a four-year record of 44-12, matching the school record of 44 wins for a senior class. Georgia defeated three Top 15 teams in the final CFP ranking — Notre Dame, Florida, and Auburn — and finished as the fourth-ranked team in the final polls. The season was capped by a dominant win over Baylor in the Allstate Sugar Bowl.<br>
<br>
When Georgia looked for a head coach after the 2015 season, the arrows pointed to <dfn><a href="/coaches.aspx?rc=2766" rel="smarttag" rev="2766">Kirby Smart</a></dfn>, longtime Alabama defensive coordinator and former UGA player and assistant. The 2017 Associated Press SEC Coach of the Year has not disappointed.<br>
<br>
In his first year leading the Bulldogs, Georgia extended its school record to 20 consecutive bowl appearances and had wins over No. 8 Auburn and No. 22 UNC. In 2017, Smart directed UGA to a 13-2 record, an SEC title, a win at The Rose Bowl Game during the CFP semifinal and a spot in the National Championship. He was named the Maxwell Football Club's George Munger National Coach of the Year. Before 2017, the Bulldogs last SEC title was 2005.<br>
<br>
The 2018 and 2019 Bulldogs advanced to the SEC title game, secured an invite to the Sugar Bowl and combined for a 23-5 record.<br>
<br>
He has also made an immediate impact in recruiting, posting the nation's No. 1 class in 2018, the second-ranked class in 2019 and the third-ranked class in 2017 and 2020.<br>
<br>
In addition to coaching, Smart oversees the <dfn><a href="/coaches.aspx?rc=2766" rel="smarttag" rev="2766">Kirby Smart</a></dfn> Family Foundation, which is focused on being champions in the community by supporting and giving back to needy children and families. In September of 2020, Smart and his wife Mary Beth pledged $1 million to support social justice and student-athletes impacted by COVID-19.
<h3>Quick Facts</h3>

<ul>
	<li>Advanced to 2017-19 SECCGs, making Georgia the first from the East to win at least three straight since 1996.</li>
	<li>Since 2017, Georgia is 19-2 in SEC East contests. Went 6-0 in the division in 2017-18 for the first time since the SEC split into divisions in 1992.</li>
	<li>2017 Georgia Munger National Coach of the Year finalist, leading UGA to a 13-2 record, a Rose Bowl Game victory and an appearance the CFP National Championship Game.</li>
	<li>The Bulldogs' No. 2 AP ranking in 2017 was the team's top AP ranking since week three of the 2008 season when Georgia was No. 2.</li>
	<li>Eight fourth-quarter comebacks, including wins over #8 AU ('16), #22 UNC in Atlanta ('16), @ #24 Notre Dame ('17), vs. #2 Oklahoma in 2018 Rose Bowl Game. vs. #8 Cincinnati in 2021 Chick-fil-A Peach Bowl.</li>
	<li>Led UGA to its first win over a ranked team in a season opener away from Sanford Stadium in school history.</li>
</ul>

<div class="fb-stats-section-title">Looking For More Explosive Plays</div>
<br>
Georgia returns eight starters on offense through four games in 2021, the Bulldogs are averaging 43.5 points/game. In their last three games, Georgia has scored 158 points (52.7 points/game).<br>
<br>
The Bulldogs return their top five running backs, headlined by <dfn><a href="/roster.aspx?rp_id=5491" rel="smarttag" rev="5491">Zamir White</a></dfn>. Georgia's top three receivers are also back in <dfn><a href="/roster.aspx?rp_id=5436" rel="smarttag" rev="5436">Kearis Jackson</a></dfn>, <dfn><a href="/roster.aspx?rp_id=5457" rel="smarttag" rev="5457">George Pickens</a></dfn> (currently injured) and <dfn><a href="/roster.aspx?rp_id=5411" rel="smarttag" rev="5411">Jermaine Burton</a></dfn>. Pickens is coming back from a knee injury that happened in the spring.<br>
<br>
Georgia has had five touchdown passes that have covered at least 38 yards. Most recently, <dfn><a href="/roster.aspx?rp_id=5422" rel="smarttag" rev="5422">JT Daniels</a></dfn> had a 38 yarder to freshman AD Mitchell and a 43 yarder to Burton against South Carolina. On the year, Burton has 12 catches for 219 yards to be the Bulldogs' secondleading receiver. Mitchell was named the SEC Freshman of the Week following the win over the Gamecocks.<br>
<br>
On the second play of the game versus UAB, Burton caught a 73-yard touchdown pass from <dfn><a href="/roster.aspx?rp_id=5401" rel="smarttag" rev="5401">Stetson Bennett</a></dfn>. Also, Bennett had two more TD bombs in that game, a 61 yarder to redshirt freshman WR <dfn><a href="/roster.aspx?rp_id=5471" rel="smarttag" rev="5471">Arian Smith</a></dfn> and an 89 yarder to freshman TE <dfn><a href="/roster.aspx?rp_id=5495" rel="smarttag" rev="5495">Brock Bowers</a></dfn>. Smith has missed the last two games with an injury.<br>
<br>
The 2020 season was the first under offensive coordinator <dfn><a href="/coaches.aspx?rc=2809" rel="smarttag" rev="2809">Todd Monken</a></dfn>, who placed a premium on explosive plays, which are at least a 12-yard rush or a 16-yard completion.<br>

<div class="fb-stats-section-title">Daniels 7-0 As A Starter</div>
<br>
<dfn><a href="/roster.aspx?rp_id=5422" rel="smarttag" rev="5422">JT Daniels</a></dfn>, an Irvine, Calif., native who was recovering from a torn ACL at Southern Cal in 2019, served as Georgia's starting quarterback from game 7 of the Bulldogs' 2020 campaign through the 2021 opener.<br>
<br>
Daniels did not play against UAB due to an injury as senior <dfn><a href="/roster.aspx?rp_id=5401" rel="smarttag" rev="5401">Stetson Bennett</a></dfn> got the start in a 56-7 win. Daniels returned to the starting lineup against South Carolina and has led Georgia to two straight victories over the Gamecocks and at Vanderbilt. He played just the first quarter against the Commodores as Georgia built a 35-0 lead.<br>
<br>
Georgia ranks ninth nationally on third down conversions (28-for- 52, 53.8 percent) and a large reason of that is because of the play of Daniels. This year on third downs, he is 16-for-18 for 152 yards and two TDs, one INT and one sack. Twelve of the completions have resulted in a first down.<br>
<br>
Bennett enjoyed a career a record-setting performance torching the Blazers for a school record tying five touchdown passes (all in the first half). He finished the day 10-for-12 for 288 yards with his scoring strikes covering 9, 12, 61, 73 and 89 yards. Bennett was named the SEC Offensive Player of the Week as well as to the Davey O'Brien Award's Great 8 list following his performance.<br>

<div class="fb-stats-section-title">Sharing The Load At RB</div>
<br>
Seniors <dfn><a href="/roster.aspx?rp_id=5491" rel="smarttag" rev="5491">Zamir White</a></dfn> and <dfn><a href="/roster.aspx?rp_id=5421" rel="smarttag" rev="5421">James Cook</a></dfn> along with sophomore <dfn><a href="/roster.aspx?rp_id=5451" rel="smarttag" rev="5451">Kendall Milton</a></dfn> and junior <dfn><a href="/roster.aspx?rp_id=5450" rel="smarttag" rev="5450">Kenny McIntosh</a></dfn> share the load.<br>
<br>
White, McIntosh and sophomore <dfn><a href="/roster.aspx?rp_id=5426" rel="smarttag" rev="5426">Daijun Edwards</a></dfn> all scored rushing touchdowns at Vanderbilt, along with WR <dfn><a href="/roster.aspx?rp_id=5449" rel="smarttag" rev="5449">Ladd McConkey</a></dfn> and TE <dfn><a href="/roster.aspx?rp_id=5495" rel="smarttag" rev="5495">Brock Bowers</a></dfn>.<br>
<br>
During the win over No. 3 Clemson, White headlined the group with 74 yards on 13 carries, including a total of 32 yards on Georgia's final drive of the game when they ran out the last 4:49 of the game.<br>
<br>
Milton was the leading rusher in the win over the Gamecocks with 10 carries for 66 yards as the Bulldogs tallied 184 yards on 31 carries (5.9 avg.). Milton did not play at Vanderbilt. This performance included a 23-yard scoring scamper by Cook, who also caught a 4-yard touchdown pass.
<div class="fb-stats-section-title">A Look At The Offensive Line</div>
<br>
There is plenty of competition for playing time on the offensive line for second-year Offensive Line coach <dfn><a href="/coaches.aspx?rc=2808" rel="smarttag" rev="2808">Matt Luke</a></dfn>.<br>
<br>
Senior <dfn><a href="/roster.aspx?rp_id=5467" rel="smarttag" rev="5467">Jamaree Salyer</a></dfn> (LT), redshirt freshman <dfn><a href="/roster.aspx?rp_id=5461" rel="smarttag" rev="5461">Tate Ratledge</a></dfn> (LG), redshirt freshman <dfn><a href="/roster.aspx?rp_id=5480" rel="smarttag" rev="5480">Sedrick Van Pran</a></dfn> (C), fifth-year senior <dfn><a href="/roster.aspx?rp_id=5469" rel="smarttag" rev="5469">Justin Shaffer</a></dfn> (RG) and redshirt sophomore <dfn><a href="/roster.aspx?rp_id=5448" rel="smarttag" rev="5448">Warren McClendon</a></dfn> (RT) were the starters versus Clemson.<br>
<br>
Van Pran emerged as an option at C after Ericson sustained an injury during preseason camp. After Van Pran got the start at C in the season opener, Ericson had to replace Ratledge at LG in the first quarter after Ratledge went down with a right foot injury and has not played since that game. Ericson has started the last three games at RG.<br>
<br>
McClendon was a 2020 Freshman All-American after starting the last nine games. Salyer and Shaffer have each started 16 career games.
<div class="fb-stats-section-title">Ton Of Targets</div>
<br>
Georgia has completed passes to a minimum of nine different Bulldogs in each game this season.<br>
<br>
<dfn><a href="/roster.aspx?rp_id=5436" rel="smarttag" rev="5436">Kearis Jackson</a></dfn>, <dfn><a href="/roster.aspx?rp_id=5403" rel="smarttag" rev="5403">Dominick Blaylock</a></dfn> and <dfn><a href="/roster.aspx?rp_id=5457" rel="smarttag" rev="5457">George Pickens</a></dfn> are working their way back to getting 100 percent from injuries.<br>
<br>
In the meantime, sophomores <dfn><a href="/roster.aspx?rp_id=5411" rel="smarttag" rev="5411">Jermaine Burton</a></dfn> and <dfn><a href="/roster.aspx?rp_id=5466" rel="smarttag" rev="5466">Marcus Rosemy-Jacksaint</a></dfn> and redshirt freshmen <dfn><a href="/roster.aspx?rp_id=5449" rel="smarttag" rev="5449">Ladd McConkey</a></dfn>, <dfn><a href="/roster.aspx?rp_id=5471" rel="smarttag" rev="5471">Arian Smith</a></dfn> and <dfn><a href="/roster.aspx?rp_id=5464" rel="smarttag" rev="5464">Justin Robinson</a></dfn> will be in the mix with true freshman AD Mitchell.<br>
<br>
McConkey became the third Bulldog to have a receiving and rushing touchdown in the same game in the matchup versus Vanderbilt. Both he and freshman TE <dfn><a href="/roster.aspx?rp_id=5495" rel="smarttag" rev="5495">Brock Bowers</a></dfn> accomplished the feat versus the Commodores.<br>
<br>
Burton caught his second touchdown passes in as many games against South Carolina and Mitchell posted career highs of four catches for 77 yards and a score versus the Gamecocks.<br>
<br>
Jackson and McConkey are sharing the punt return duties as well.
<div class="fb-stats-section-title">Productive Start To Bowers' Career</div>
<br>
Freshman TE <dfn><a href="/roster.aspx?rp_id=5495" rel="smarttag" rev="5495">Brock Bowers</a></dfn> has a team-best 18 catches for 272 yards and five touchdowns (four rec., one rush) and has started all four games.<br>
<br>
Against #3 Clemson, he led the Bulldogs with six catches for 43 yards in the victory. His first touchdown catch of his career was an 89 yarder from <dfn><a href="/roster.aspx?rp_id=5401" rel="smarttag" rev="5401">Stetson Bennett</a></dfn> versus UAB. This was the ninthlongest passing TD in school history.<br>
<br>
At Vanderbilt, Bowers had a 12-yard rushing touchdown on his first career carry and for the second week in a row he was the leading receiver with four catches for 69 yards and two touchdowns.<br>
<br>
Bowers has three touchdown receptions of 25+ yards and was the first Bulldog since Sony Michel (2017 vs. UK) to score three touchdowns in a game.<br>
<br>
Bowers became just the eighth true freshman to start a season opener in the <dfn><a href="/coaches.aspx?rc=2766" rel="smarttag" rev="2766">Kirby Smart</a></dfn> era. Bowers saw increased reps during fall camp when junior <dfn><a href="/roster.aspx?rp_id=5428" rel="smarttag" rev="5428">John FitzPatrick</a></dfn> and sophomore <dfn><a href="/roster.aspx?rp_id=5488" rel="smarttag" rev="5488">Darnell Washington</a></dfn> missed time with injuries.</div>
</div>

<div class="fb-stats-section-title">Creating Havoc Again In 2021</div>
<br>
Defensive coordinator <dfn><a href="/coaches.aspx?rc=2785" rel="smarttag" rev="2785">Dan Lanning</a></dfn> is now in his fourth year and the Bulldogs feature the nation's top Scoring Defense allowing just 5.8 points/game. Georgia is second in Passing Defense (115.8 y/g) and seventh in Rushing Defense (69.5 y/g).<br>
<br>
Georgia is tied for ninth nationally with 15 sacks.<br>
<br>
The Georgia defense has allowed just one touchdown this year. The Bulldogs' first two opponents did not score until the fourth quarter. UAB's only touchdown came on a pick-six. Clemson managed only a field goal. All 13 of South Carolina's points came after three turnovers, including two field goals and a fourth quarter touchdown. Following a 62-0 shutout at Vanderbilt, three of Georgia's opponents have failed to score before halftime.<br>
<br>
Head coach <dfn><a href="/coaches.aspx?rc=2766" rel="smarttag" rev="2766">Kirby Smart</a></dfn> stresses the importance of making havoc plays and how those plays give the defense momentum. Turnovers (interceptions, forced fumbles), deflections, tackles for loss, including sacks, are examples of havoc plays.<br>

<div class="fb-stats-section-title">Secondary Finding Their Way</div>
<br>
While some may refer to Georgia as "RBU", one could make a case for "DBU" with the recent Bulldogs now in the NFL including four who were drafted last season (<dfn><a href="/roster.aspx?rp_id=4767" rel="smarttag" rev="4767">Eric Stokes</a></dfn>, 1st Round, Green Bay; <dfn><a href="/roster.aspx?rp_id=4702" rel="smarttag" rev="4702">Tyson Campbell</a></dfn>, 2nd Round, Jacksonville; <dfn><a href="/roster.aspx?rp_id=4733" rel="smarttag" rev="4733">Richard LeCounte</a></dfn>, 5th round, Cleveland; <dfn><a href="/roster.aspx?rp_id=4781" rel="smarttag" rev="4781">Mark Webb</a></dfn>, 7th round, L.A. Chargers).<br>
<br>
The Bulldogs lead the SEC with seven interceptions. Most recently, senior <dfn><a href="/roster.aspx?rp_id=5472" rel="smarttag" rev="5472">Christopher Smith</a></dfn> and freshman <dfn><a href="/roster.aspx?rp_id=5378" rel="smarttag" rev="5378">Kamari Lassiter</a></dfn> each snagged one in the 62-0 win over the Commodores. Junior <dfn><a href="/roster.aspx?rp_id=5418" rel="smarttag" rev="5418">Lewis Cine</a></dfn> and freshman <dfn><a href="/roster.aspx?rp_id=5462" rel="smarttag" rev="5462">Kelee Ringo</a></dfn> each had an interception versus UAB after Smith scored the game's only touchdown with a 74-yard INT return for a TD against #3 Clemson.<br>
<br>
To help offset these losses, Georgia landed a pair talented players via the transfer portal in All-ACC first teamer <dfn><a href="/roster.aspx?rp_id=5576" rel="smarttag" rev="5576">Derion Kendrick</a></dfn> (Clemson) and All-America <dfn><a href="/roster.aspx?rp_id=5577" rel="smarttag" rev="5577">Tykee Smith</a></dfn> (West Virginia). However, Smith went down with a foot injury in camp and has yet to play.<br>
<br>
Kendrick has his first career pick for the Bulldogs (fourth of his career after snagging three for Clemson) during the win over USC.<br>
<br>
Smith scored the only touchdown in the win over No. 3 Clemson on a 74-yard interception return (the first pick of his career). He earned SEC Defensive Player of the Week honors following his performance. Cine had a team-high nine tackles and two pass breakups while Brini tallied four stops and Speed had a pair of tackles.<br>
<br>
Seniors <dfn><a href="/roster.aspx?rp_id=5405" rel="smarttag" rev="5405">Latavious Brini</a></dfn> and <dfn><a href="/roster.aspx?rp_id=5474" rel="smarttag" rev="5474">Ameer Speed</a></dfn> are manning the cornerback spots for the Bulldogs during their final seasons.
<div class="fb-stats-section-title">Making An Impact Up Front</div>
<br>
Preseason All-American <dfn><a href="/roster.aspx?rp_id=5423" rel="smarttag" rev="5423">Jordan Davis</a></dfn> joins fifth-year <dfn><a href="/roster.aspx?rp_id=5493" rel="smarttag" rev="5493">Devonte Wyatt</a></dfn> as the veterans in the center of the defensive line. The pair combined for six tackles, including two tackles for loss and a sack, and a pass breakup against No. 3 Clemson. Davis was named the Bronko Nagurski National Defensive Player of the Week as well as the SEC Defensive Lineman of the Week after his effort against the Tigers.<br>
<br>
The duo is joined by junior <dfn><a href="/roster.aspx?rp_id=5485" rel="smarttag" rev="5485">Travon Walker</a></dfn>, sophomore <dfn><a href="/roster.aspx?rp_id=5415" rel="smarttag" rev="5415">Jalen Carter</a></dfn>, junior <dfn><a href="/roster.aspx?rp_id=5487" rel="smarttag" rev="5487">Tramel Walthour</a></dfn> and sophomore <dfn><a href="/roster.aspx?rp_id=5475" rel="smarttag" rev="5475">Nazir Stackhouse</a></dfn> who comprise the rotation of the Bulldog front. Walker had four tackles and a sack in the 2021 opener while Carter chipped in with two stops, including a sack.<br>
<br>
Carter tied for the team lead with three stops against Vanderbilt, including one of the team's four tackles for loss.<br>
<br>
Clemson was held to two yards rushing as Georgia's defense tallied seven sacks.<br>
<br>
Davis shared a sack with teammate <dfn><a href="/roster.aspx?rp_id=5473" rel="smarttag" rev="5473">Nolan Smith</a></dfn> that led to a South Carolina safety as Davis and Wyatt combined for four stops and two TFLs in the win over the Gamecocks.
<div class="fb-stats-section-title">Bulldog Backers</div>
<br>
Senior ILB <dfn><a href="/roster.aspx?rp_id=5478" rel="smarttag" rev="5478">Channing Tindall</a></dfn> shares the team lead in tackles (19) with junior S <dfn><a href="/roster.aspx?rp_id=5418" rel="smarttag" rev="5418">Lewis Cine</a></dfn>. He is joined by junior <dfn><a href="/roster.aspx?rp_id=5425" rel="smarttag" rev="5425">Nakobe Dean</a></dfn> and junior <dfn><a href="/roster.aspx?rp_id=5484" rel="smarttag" rev="5484">Quay Walker</a></dfn> in the middle. Dean was a semifinalist for the 2020 Butkus Award.<br>
<br>
Tindall was the leading tackler in the rout of UAB as he had seven tackles and a sack. He followed that up with another seven stops against South Carolina.<br>
<br>
Dean set the tone early against No. 3 Clemson as he finished with a pair of sacks and five tackles on the night.<br>
<br>
Senior <dfn><a href="/roster.aspx?rp_id=5398" rel="smarttag" rev="5398">Adam Anderson</a></dfn> and junior <dfn><a href="/roster.aspx?rp_id=5473" rel="smarttag" rev="5473">Nolan Smith</a></dfn> are filling the spot vacated by NFL second round pick <dfn><a href="/roster.aspx?rp_id=4749" rel="smarttag" rev="4749">Azeez Ojulari</a></dfn>. Through the first four games of 2021, Anderson has 12 tackles and three sacks while Smith has 15 stops and 2.5 sacks.<br>
<br>
Smith exploded for a career-high eight tackles against the Gamecocks in a performance that included 1.5 sacks and a forced fumble.</div>
</div>

<div class="fb-stats-section-title">One Of Country's Top Punting Units Returns</div>
<br>
Senior punter and 2020 Ray Guy Award finalist <dfn><a href="/roster.aspx?rp_id=5413" rel="smarttag" rev="5413">Jake Camarda</a></dfn> was the SEC Special Teams Player of the Year last season. He posted an SEC best 46.6 average that ranked fourth in the country and was named a FWAA Second-Team All-American. Camarda is a preseason All-American at his position in 2021.<br>
<br>
Camarda had five punts for a net average of 43.4 and dropped four inside the 20-yard line with a long of 51 during the season-opening win over No. 3 Clemson. He was included on the Ray Guy Award's "Ray's 8" for his performance versus the Tigers.<br>
<br>
This year, Camarda is averaging 45.5 yards/punt placing eight inside in the 20 and five have been 50+. Georgia leads the SEC in net punting at 44.1. Camarda is averaging 45.5 yards/punt, which is on pace for a school record. Drew Butler, the 2009 Ray Guy Award winner, owns the Bulldog record with a 45.4 mark.<br>
<br>
Camarda is also handling most of the UGA kickoffs this year.
<div class="fb-stats-section-title">Jack-Pod</div>
<br>
For his career, junior PK <dfn><a href="/roster.aspx?rp_id=5458" rel="smarttag" rev="5458">Jack Podlesny</a></dfn> is 17-for-22 on field goals and 60-for-60 on PATs. This year, he is 4-for-6 on FGs and 22- for-22 on PATs. Podlesny made his debut in the 2020 season opening win at Arkansas and capped his first year by earning Offensive MVP honors at the Chick-fil-A Peach Bowl. In the 24-21 win over #8 Cincinnati, Podlesny accounted for 10 points, including the game-winning 53-yard FG with three seconds remaining.<br>
<br>
Georgia entered the 2021 season with the NCAA record for Consecutive PATs Made. The streak now stands at 352 and involves six kickers (Marshall Morgan, Patrick Beless, William Ham, David Marvin, Rodrigo Blankenship and Podlesny) and dates back to 2014.<br>
<br>
Georgia's snappers this year include returning starters junior <dfn><a href="/roster.aspx?rp_id=5483" rel="smarttag" rev="5483">Payne Walker</a></dfn> and redshirt sophomore <dfn><a href="/roster.aspx?rp_id=5453" rel="smarttag" rev="5453">William Mote</a></dfn>. Walker snaps on field goals and PATs while Mote handles the snaps for punts.</div>
</div>

 100%; max-width: 300px; display: inline-block;\">\u003C\u002Ftd>\r\n\t\t\t\u003Ctd width=\"10%\">\u003Cspan style=\"font-size: 50px;\">vs. \u003C\u002Fspan>\u003C\u002Ftd>\r\n\t\t\t\u003Ctd width=\"45%\">\u003Cimg alt=\"Georgia Helmet\" src=\"https:\u002F\u002Fgeorgiadogs.com\u002Fimages\u002F2021\u002F8\u002F21\u002Fhelmets_uga_l.png\" style=\"width: 100%; max-width: 300px; display: inline-block;\">\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Cth colspan=\"3\" style=\"padding-top: 8px; opacity: 0.8;\">\u003Cspan class=\"helmet-top-line\">SATURDAY, OCTOBER 2 - 12:00 p.m. ET\u003C\u002Fspan>\u003Cbr>\r\n\t\t\t\u003Cspan style=\"font-size: 14px;\">Dooley Field at Sanford Stadium - Athens, Ga.\u003C\u002Fspan>\u003C\u002Fth>\r\n\t\t\u003C\u002Ftr>\r\n\t\u003C\u002Ftbody>\r\n\u003C\u002Ftable>\r\n\r\n\u003Cdiv class=\"game-info\">\r\n\u003Cdiv class=\"fb-stats-section-title\">Game & Broadcast Info\u003C\u002Fdiv>\r\n\r\n\u003Cul>\r\n\t\u003Cli>\u003Cstrong>Kickoff:\u003C\u002Fstrong> Saturday, October 2 - 12:00 p.m. ET\u003C\u002Fli>\r\n\t\u003Cli>\u003Cstrong>Location:\u003C\u002Fstrong> Dooley Field at Sanford Stadium (92,746) | Athens, Ga.\u003C\u002Fli>\r\n\t\u003Cli>\u003Cstrong>2021 Records:\u003C\u002Fstrong> Georgia 4-0 (2-0 SEC), Arkansas 4-0 (1-0 SEC)\u003C\u002Fli>\r\n\t\u003Cli>\u003Cstrong>History:\u003C\u002Fstrong> \u003Ca href=\"https:\u002F\u002Fgeorgiadogs.com\u002Fsports\u002Ffootball\u002Fopponent-history\u002Funiversity-of-arkansas\u002F30\">Georgia vs. Arkansas All-Time Series Results: UGA 11-4\u003C\u002Fa>\u003C\u002Fli>\r\n\t\u003Cli>\u003Cstrong>Rankings:\u003C\u002Fstrong> Georgia #2, Arkansas #8\u002F11\u003C\u002Fli>\r\n\t\u003Cli>\u003Cstrong>TV:\u003C\u002Fstrong> ESPN - Chris Fowler (PxP), Kirk Herbstreit (analyst),\u003C\u002Fli>\r\n\t\u003Cli>\u003Cstrong>Video Stream:\u003C\u002Fstrong> \u003Ca href=\"http:\u002F\u002Fwww.espn.com\u002Fwatch\u002Fplayer?id=f12ed3b1-a6c1-472a-95fa-9073d3df93bf\" target=\"_blank\">ESPN+\u003C\u002Fa>\u003C\u002Fli>\r\n\t\u003Cli>\u003Cstrong>Radio:\u003C\u002Fstrong> WSB AM 750 - Bulldog Network | \u003Ca href=\"http:\u002F\u002Fwww.georgiadogs.com\u002Fmultimedia\u002Fgeo-radio-affiliates.html\">Affiliates\u003C\u002Fa> | Scott Howard (PxP), Eric Zeier (Color), DJ Shockley (sideline)\u003C\u002Fli>\r\n\t\u003Cli>\u003Cstrong>Audio Stream:\u003C\u002Fstrong> \u003Ca href=\"https:\u002F\u002Fgeorgiadogs.com\u002Fshowcase?Live=4041\" target=\"_blank\">georgiadogs.com\u003C\u002Fa>\u003C\u002Fli>\r\n\t\u003Cli>\u003Cstrong>Satellite:\u003C\u002Fstrong> SiriusXM: 81\u002F81\u002F81\u003C\u002Fli>\r\n\t\u003Cli>\u003Cstrong>Web Stats:\u003C\u002Fstrong> \u003Ca href=\"https:\u002F\u002Fgeorgiadogs.com\u002Fsidearmstats\u002Ffootball\u002Fsummary\" target=\"_blank\">GameTracker\u003C\u002Fa>\u003C\u002Fli>\r\n\t\u003Cli>\u003Cstrong>Twitter:\u003C\u002Fstrong> #ARKvsUGA\u003C\u002Fli>\r\n\t\u003Cli>\u003Cstrong>ReBroadcast:\u003C\u002Fstrong> SEC Network: TBA\u003C\u002Fli>\r\n\t\u003Cli>\u003Cstrong>ESPN's College GameDay Built by The Home Depot\u003C\u002Fstrong> 9-11:00 a.m. - Myers Quad\u003C\u002Fli>\r\n\t\u003Cli>\u003Cstrong>ESPN's College GameDay Built by The Home Depot\u003C\u002Fstrong> 11-12:00 p.m. - Sanford Stadium\u003C\u002Fli>\r\n\u003C\u002Ful>\r\n\u003C\u002Fdiv>\r\n\r\n\u003Cdiv class=\"everything-in-here\">\u003Cbutton class=\"expandable-menu\" type=\"button\">TEAM COMPARISONS \u003Ci class=\"sf-arrows-down-thin\">\u003C\u002Fi>\u003C\u002Fbutton>\r\n\r\n\u003Cdiv class=\"expanded-menu-items\">\r\n\u003Cdiv class=\"expanded-item-inner\">\r\n\u003Cp>\r\n\r\n\u003Ctable cellpadding=\"5\" cellspacing=\"5\" class=\"gridtable\" style=\"border: 0px solid #fff;\" width=\"100%\">\r\n\t\u003Ctbody>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd align=\"right\" style=\"background-color: #cc0000; color: #fff;\" width=\"30%\">\u003Cstrong>Georgia\u003C\u002Fstrong>\u003C\u002Ftd>\r\n\t\t\t\u003Ctd align=\"center\" style=\"background-color: #000; color: #fff;\" width=\"30%\">2021 Averages\u003C\u002Ftd>\r\n\t\t\t\u003Ctd style=\"background-color: #9D2235; color: #fff;\" width=\"30%\">\u003Cstrong>Arkansas\u003C\u002Fstrong>\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd align=\"right\">43.8\u003C\u002Ftd>\r\n\t\t\t\u003Ctd align=\"center\">Scoring Offense\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>35.8\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd align=\"right\">5.8\u003C\u002Ftd>\r\n\t\t\t\u003Ctd align=\"center\">Scoring Defense\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>14.5\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd align=\"right\">+2\u003C\u002Ftd>\r\n\t\t\t\u003Ctd align=\"center\">Turnover Margin\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>+3\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd align=\"right\">454.2\u003C\u002Ftd>\r\n\t\t\t\u003Ctd align=\"center\">Total Offense\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>480.0\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd align=\"right\">176.5\u003C\u002Ftd>\r\n\t\t\t\u003Ctd align=\"center\">Rushing Offense\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>261.0\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd align=\"right\">277.8\u003C\u002Ftd>\r\n\t\t\t\u003Ctd align=\"center\">Passing Offense\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>219.0\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd align=\"right\">10.1\u003C\u002Ftd>\r\n\t\t\t\u003Ctd align=\"center\">Punt Returns\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>3.2\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd align=\"right\">22.0\u003C\u002Ftd>\r\n\t\t\t\u003Ctd align=\"center\">Kickoff Returns\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>27.2\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\u003C\u002Ftbody>\r\n\u003C\u002Ftable>\r\n\u003C\u002Fdiv>\r\n\u003C\u002Fdiv>\r\n\u003Cbutton class=\"expandable-menu\" type=\"button\">GAME PREVIEW \u003Ci class=\"sf-arrows-down-thin\">\u003C\u002Fi>\u003C\u002Fbutton>\r\n\r\n\u003Cdiv class=\"expanded-menu-items\">\r\n\u003Cdiv class=\"expanded-item-inner\">\r\n\u003Cdiv class=\"fb-stats-section-title\">Georgia-Arkansas Series History\u003C\u002Fdiv>\r\n\u003Cbr>\r\nGeorgia leads the all-time series with Arkansas by a 11-4 margin. The two programs last met in Fayetteville to open the shortened 2020 season with the Bulldogs knocking off the Razorbacks 37-10. Arkansas left Sanford Stadium with a 31-24 win during its last trip to Athens in 2010. The first four clashes in the series came in bowl games starting with the 1969 Sugar Bowl, a 16-2 Arkansas win. Also of note, Georgia captured the 2002 SEC Championship with a 30-3 victory over the Razorbacks in Atlanta.\u003Cbr>\r\n\u003Cbr>\r\nThis Saturday's showdown marks the second matchup between Bulldog head coach \u003Cdfn>\u003Ca href=\"\u002Fcoaches.aspx?rc=2766\" rel=\"smarttag\" rev=\"2766\">Kirby Smart\u003C\u002Fa>\u003C\u002Fdfn> and Arkansas' Sam Pittman, who spent the 2016-19 seasons at Georgia, the first three as the offensive line coach and the final year as Associate Head Coach in charge of the offensive line.\u003Cbr>\r\n\u003Cbr>\r\nPittman is just one of several Razorbacks on staff with Georgia connections. Former Bulldog special teams coach Scott Fountain is the Assistant Head Coach\u002FSpecial Teams Coordinator for the Razorbacks. Former Georgia assistant strength coaches Jamil Walker and Ed Ellis are on staff as Walker serves as the team's head strength coach while Ellis is the senior associate director. Former Bulldog Fernando Velasco serves as the team's Director of Player Development, while former Bulldog staffer Patrick Doherty is the Director of Football Operations.\r\n\u003Cdiv class=\"fb-stats-section-title\">Top 10 Foes In Smart Era\u003C\u002Fdiv>\r\n\u003Cbr>\r\nGeorgia is 11-6 against top-10 teams under \u003Cdfn>\u003Ca href=\"\u002Fcoaches.aspx?rc=2766\" rel=\"smarttag\" rev=\"2766\">Kirby Smart\u003C\u002Fa>\u003C\u002Fdfn>, including 3-0 at home. Most recently, the Bulldogs started the 2021 season by edging then No. 3 Clemson 10-3 in Charlotte, N.C., during the Duke's Mayo Classic. The Bulldogs ended last season with a 24-21 win over eighth-ranked and undefeated Cincinnati during the Chick-fil-A Peach Bowl in Atlanta. Georgia's highest-ranked win under Smart was over No. 2 Oklahoma (54-48, 2OT) in a CFP Semifinal at the 2018 Rose Bowl Game.\r\n\u003Cdiv class=\"fb-stats-section-title\">ESPN College GameDay Is Athens Bound\u003C\u002Fdiv>\r\n\u003Cbr>\r\nThis will mark the first time ESPN College GameDay will be in Athens since coming for the showdown of No. 4 Georgia versus No. 7 Auburn in 2020. The Bulldogs left the Tigers behind in that matchup 27-6. This marked the last top-10 matchup in Athens. The production was trimmed down because of the COVID-19 regulations and was set up in Sanford Stadium's west side plaza rather than the traditional Myer's Quad. GameDay was also in Charlotte for the top-five matchup against Clemson. This marks the sixth time that GameDay has come to Athens.\r\n\u003Cdiv class=\"fb-stats-section-title\">Dominating Defense\u003C\u002Fdiv>\r\n\u003Cbr>\r\nCurrently Georgia leads the nation in Scoring Defense giving up just 5.8 points per game. The defense has allowed just one touchdown this season and it came in the fourth quarter versus South Carolina with the Bulldogs leading 40-6. Georgia's opponents have advanced to the Red Zone only four times this season resulting in three field goals and turning it over once on downs.\u003Cbr>\r\n\u003Cbr>\r\nGeorgia had held its first four opponents to a total of 23 points. Georgia topped UAB 56-7 and it is worth nothing that the Blazers' touchdown came on a pick-six.\u003Cbr>\r\n\u003Cbr>\r\nMost recently, Vanderbilt was held to 77 yards on 46 plays and just four first downs, including one by a penalty. That was the lowest total offense by a Bulldog opponent since 2009 when Georgia blanked Tennessee Tech 38-0 holding them to 55 yards on 47 plays. Georgia's win over the Commodores was the second-largest margin of victory in an SEC game in school history, trailing only the 75-0 win over Florida in 1942 in Jacksonville. Also, Georgia has now had six shutouts in Smart era, including four in the SEC.\u003Cbr>\r\n\u003Cbr>\r\nDuring the Bulldogs' win over No. 3 Clemson in Charlotte, N.C., the Tigers finished the night with just three points on 60 plays and 180 yards as Georgia tallied seven sacks. Clemson's three points were the fewest scored in the Dabo Swinney era and the fewest for the program since 2007.\r\n\u003Cdiv class=\"fb-stats-section-title\">Recognition During Arkansas Game\u003C\u002Fdiv>\r\n\u003Cbr>\r\nA couple of in-game recognitions this Saturday will include the latest Circle of Honor inductees as well as a presentation of the 2020-21 recipients of the Joel Eaves Award.\u003Cbr>\r\n\u003Cbr>\r\nAt halftime, Georgia will honor this year's 31 Bulldog Olympians and Paralympians who left Tokyo with 13 medals.\r\n\u003Cp>\r\n\u003C\u002Fdiv>\r\n\u003C\u002Fdiv>\r\n\u003Cbutton class=\"expandable-menu\" type=\"button\">HEAD COACH KIRBY SMART \u003Ci class=\"sf-arrows-down-thin\">\u003C\u002Fi>\u003C\u002Fbutton>\r\n\r\n\u003Cdiv class=\"expanded-menu-items\">\r\n\u003Cdiv class=\"expanded-item-inner\">\r\n\u003Cp>\r\n\r\n\u003Cdiv class=\"fb-stats-section-title\">Head Coach \u003Cdfn>\u003Ca href=\"\u002Fcoaches.aspx?rc=2766\" rel=\"smarttag\" rev=\"2766\">Kirby Smart\u003C\u002Fa>\u003C\u002Fdfn>\u003C\u002Fdiv>\r\n\r\n\u003Cdiv style=\"width: 300px; float: left; margin-right: 20px; margin-bottom: 20px; border: thin solid #ddd; padding: 20px; max-width: 40%\">\u003Cimg alt=\"Head Coach Kirby Smart\" src=\"https:\u002F\u002Fgeorgiadogs.com\u002Fimages\u002F2019\u002F8\u002F26\u002Fsmart_biophoto_300.png\" style=\"display: inline-block; width: 100%; max-width: 300px;\">\u003Cbr>\r\n\u003Cstrong>Personal\u003C\u002Fstrong>\u003Cbr>\r\nFull Name: Kirby Paul Smart\u003Cbr>\r\nBirthdate: December 23, 1975\u003Cbr>\r\nBirthplace: Montgomery, Alabama\u003Cbr>\r\nFamily: Wife: Mary Beth; Children: twins Weston and Julia (Feb. 8, 2008), and Andrew (May 25, 2012)\u003Cbr>\r\nHigh School: Bainbridge (Ga.)\u003Cbr>\r\nCollege: BBA Georgia '98; MS Arkansas State State '03\u003Cbr>\r\n\u003Cbr>\r\n\u003Cstrong>Coaching Experience\u003C\u002Fstrong>\u003Cbr>\r\n1999 Georgia Admin. Asst.\u003Cbr>\r\n2000 Valdosta State Defensive Backs\u003Cbr>\r\n2001 Valdosta State Def. Coord.\u003Cbr>\r\n2002-03 FSU Grad. Assistant\u003Cbr>\r\n2004 Arkansas State Defensive Backs\u003Cbr>\r\n2005 Georgia Running Backs\u003Cbr>\r\n2006 Miami Dolphins Safeties\u003Cbr>\r\n2007 Alabama Asst. HC\u002FDBs\u003Cbr>\r\n2008-13, '15 Alabama Def. Coord.\u002FILBs\u003Cbr>\r\n2014 Alabama Asst. HC\u002FSafeties\u003Cbr>\r\n2016-current Georgia Head Coach\u003Cbr>\r\n\u003Cbr>\r\n\u003Cstrong>Playing Experience\u003C\u002Fstrong>\u003Cbr>\r\nGeorgia (1995-98): Four-year letterman as defensive back. First team All-SEC in '98; 13 career interceptions; four-time member of SEC Academic Honor Roll.\u003Cbr>\r\nBainbridge H.S. (1991-93): Three-year letterman in football, basketball, and baseball; first team Class AAAA All-State as a senior; 16 career interceptions.\u003Cbr>\r\nHigh School Coach: Sonny Smart (father)\u003C\u002Fdiv>\r\n\u003Cbr>\r\nThree SEC Eastern Division championships, 52 wins, one SEC title, four bowl victories, and an appearance in one national championship game are more than respectable rewards over a five-year period. That's what Georgia got when it hired former Bulldog player and assistant coach \u003Cdfn>\u003Ca href=\"\u002Fcoaches.aspx?rc=2766\" rel=\"smarttag\" rev=\"2766\">Kirby Smart\u003C\u002Fa>\u003C\u002Fdfn> to head the program in December, 2015.\u003Cbr>\r\n\u003Cbr>\r\nThe 2020 Bulldogs became Smart's fourth straight team to earn a New Year's Six bowl game. With a Chick-fil-A Peach Bowl victory, the 2020 Bulldog senior class tied the record for the most wins by a senior class in school history (44), set by the 2005 and 2019 teams. That was also Smart's fourth straight team to finish the regular season ranked in the top ten of the College Football Playoff rankings.\u003Cbr>\r\n\u003Cbr>\r\nSmart's 2019 Bulldogs became the first team in school history to win 11 or more games for a third straight season. The senior class posted a four-year record of 44-12, matching the school record of 44 wins for a senior class. Georgia defeated three Top 15 teams in the final CFP ranking — Notre Dame, Florida, and Auburn — and finished as the fourth-ranked team in the final polls. The season was capped by a dominant win over Baylor in the Allstate Sugar Bowl.\u003Cbr>\r\n\u003Cbr>\r\nWhen Georgia looked for a head coach after the 2015 season, the arrows pointed to \u003Cdfn>\u003Ca href=\"\u002Fcoaches.aspx?rc=2766\" rel=\"smarttag\" rev=\"2766\">Kirby Smart\u003C\u002Fa>\u003C\u002Fdfn>, longtime Alabama defensive coordinator and former UGA player and assistant. The 2017 Associated Press SEC Coach of the Year has not disappointed.\u003Cbr>\r\n\u003Cbr>\r\nIn his first year leading the Bulldogs, Georgia extended its school record to 20 consecutive bowl appearances and had wins over No. 8 Auburn and No. 22 UNC. In 2017, Smart directed UGA to a 13-2 record, an SEC title, a win at The Rose Bowl Game during the CFP semifinal and a spot in the National Championship. He was named the Maxwell Football Club's George Munger National Coach of the Year. Before 2017, the Bulldogs last SEC title was 2005.\u003Cbr>\r\n\u003Cbr>\r\nThe 2018 and 2019 Bulldogs advanced to the SEC title game, secured an invite to the Sugar Bowl and combined for a 23-5 record.\u003Cbr>\r\n\u003Cbr>\r\nHe has also made an immediate impact in recruiting, posting the nation's No. 1 class in 2018, the second-ranked class in 2019 and the third-ranked class in 2017 and 2020.\u003Cbr>\r\n\u003Cbr>\r\nIn addition to coaching, Smart oversees the \u003Cdfn>\u003Ca href=\"\u002Fcoaches.aspx?rc=2766\" rel=\"smarttag\" rev=\"2766\">Kirby Smart\u003C\u002Fa>\u003C\u002Fdfn> Family Foundation, which is focused on being champions in the community by supporting and giving back to needy children and families. In September of 2020, Smart and his wife Mary Beth pledged $1 million to support social justice and student-athletes impacted by COVID-19.\r\n\u003Ch3>Quick Facts\u003C\u002Fh3>\r\n\r\n\u003Cul>\r\n\t\u003Cli>Advanced to 2017-19 SECCGs, making Georgia the first from the East to win at least three straight since 1996.\u003C\u002Fli>\r\n\t\u003Cli>Since 2017, Georgia is 19-2 in SEC East contests. Went 6-0 in the division in 2017-18 for the first time since the SEC split into divisions in 1992.\u003C\u002Fli>\r\n\t\u003Cli>2017 Georgia Munger National Coach of the Year finalist, leading UGA to a 13-2 record, a Rose Bowl Game victory and an appearance the CFP National Championship Game.\u003C\u002Fli>\r\n\t\u003Cli>The Bulldogs' No. 2 AP ranking in 2017 was the team's top AP ranking since week three of the 2008 season when Georgia was No. 2.\u003C\u002Fli>\r\n\t\u003Cli>Eight fourth-quarter comebacks, including wins over #8 AU ('16), #22 UNC in Atlanta ('16), @ #24 Notre Dame ('17), vs. #2 Oklahoma in 2018 Rose Bowl Game. vs. #8 Cincinnati in 2021 Chick-fil-A Peach Bowl.\u003C\u002Fli>\r\n\t\u003Cli>Led UGA to its first win over a ranked team in a season opener away from Sanford Stadium in school history.\u003C\u002Fli>\r\n\u003C\u002Ful>\r\n\r\n\u003Ctable class=\"fb-stats-table\" style=\"width: 100%;\">\r\n\t\u003Ctbody>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Cth colspan=\"5\" style=\"background-color:#cc0000; color:#fff; text-align:center; font-weight:bold;\">Coach Smart's Record\u003C\u002Fth>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Cth>Year\u003C\u002Fth>\r\n\t\t\t\u003Cth>W\u003C\u002Fth>\r\n\t\t\t\u003Cth>L\u003C\u002Fth>\r\n\t\t\t\u003Cth>Pct.\u003C\u002Fth>\r\n\t\t\t\u003Cth>SEC\u003C\u002Fth>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>2016\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>8\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>5\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>.615\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>4-4\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>2017\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>13\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>2\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>.866\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>7-1\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>2018\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>11\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>3\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>.786\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>7-1\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>2019\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>12\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>2\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>.857\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>7-2\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>2020\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>8\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>2\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>.800\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>7-2\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>2021\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>4\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>0\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>1.000\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>2-0\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>Total\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>56\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>14\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>.800\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>35-12\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd colspan=\"5\">includes 2017-19 SECCGs, 2018 CFPNC\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\u003C\u002Ftbody>\r\n\u003C\u002Ftable>\r\n\r\n\u003Cdiv class=\"fb-stats-section-title\">Top Ind. Single-Game Performances Under Smart\u003C\u002Fdiv>\r\n\u003Cbr>\r\n\u003Cstrong>Top Ind. Single-Game Performances Under Smart\u003C\u002Fstrong>\u003Cbr>\r\n\u003Cstrong>Rushing Yards:\u003C\u002Fstrong> 222 002F11\u002F21)\u003Cbr>\r\n\u003Cstrong>Tackles:\u003C\u002Fstrong> 15, \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5425\" rel=\"smarttag\" rev=\"5425\">Nakobe Dean\u003C\u002Fa>\u003C\u002Fdfn> vs. #8 UF (11\u002F7\u002F20)\u003Cbr>\r\n\u003Cstrong>Sacks:\u003C\u002Fstrong> 3, Trenton Thompson vs. TCU (12\u002F30\u002F16); 3, \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=4749\" rel=\"smarttag\" rev=\"4749\">Azeez Ojulari\u003C\u002Fa>\u003C\u002Fdfn> vs. #8 UC (1\u002F1\u002F21)\u003Cbr>\r\n\u003Cstrong>TFL:\u003C\u002Fstrong> 3, \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=4749\" rel=\"smarttag\" rev=\"4749\">Azeez Ojulari\u003C\u002Fa>\u003C\u002Fdfn> vs. #7 AU (10\u002F3\u002F20); Thompson vs. Nicholls (9\u002F10\u002F16); 3, \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=4749\" rel=\"smarttag\" rev=\"4749\">Azeez Ojulari\u003C\u002Fa>\u003C\u002Fdfn> vs. #8 UC (1\u002F1\u002F21)\r\n\r\n\u003Cdiv class=\"fb-stats-section-title\">21 Defense\u002FSpecial Teams Scores\u003C\u002Fdiv>\r\n\u003Cbr>\r\nUnder \u003Cdfn>\u003Ca href=\"\u002Fcoaches.aspx?rc=2766\" rel=\"smarttag\" rev=\"2766\">Kirby Smart\u003C\u002Fa>\u003C\u002Fdfn>, Georgia has registered 21 scores on defense or special teams. The Dogs are 18-1 when they register a non-offensive score under Smart. This season, Georgia has had three: \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5472\" rel=\"smarttag\" rev=\"5472\">Christopher Smith's\u003C\u002Fa>\u003C\u002Fdfn> 74-yd INTreturn (#3 CU); \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5374\" rel=\"smarttag\" rev=\"5374\">Jamon Dumas-Johnson's\u003C\u002Fa>\u003C\u002Fdfn> 20-yd INT return (UAB); safety (SC). The only loss came versus #8 UF in 2020.\r\n\u003Cdiv class=\"fb-stats-section-title\">Eight Victories When Tied Or Trailing Late\u003C\u002Fdiv>\r\n\r\n\u003Ctable class=\"fb-stats-table\">\r\n\t\u003Ctbody>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Cth>Year\u003C\u002Fth>\r\n\t\t\t\u003Cth>Opponent\u003C\u002Fth>\r\n\t\t\t\u003Cth>Start of 4th Qtr.\u003C\u002Fth>\r\n\t\t\t\u003Cth>Final\u003C\u002Fth>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>2016\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>%#22 UNC\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>Trailed 24-23\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>33-24\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>2016\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>@ MIZZ\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>Trailed 27-21\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>28-27\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>2016\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>@ UK\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>Trailed 21-16\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>27-24\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>2016\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>#8 AUB\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>Tied 7-7\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>13-7\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>2016\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>^TCU\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>Trailed 23-21\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>31-23\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>2017\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>#24 UND\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>17-16, trailed 19-17 with 10:21 left\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>20-19\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>2018\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>$ #2 Oklahoma 31-31\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>trailed 45-38 with 0:55 left\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>54-48 2ot\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>2020\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>#8 Cincinnati\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>Trailed 21-10, trailed 21-19 with :03 left\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>24-21\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\u003C\u002Ftbody>\r\n\u003C\u002Ftable>\r\n\u003Cbr>\r\n%Chick-fil-A Kickoff Classic; ^Liberty Bowl; $Rose Bowl Game\u003C\u002Fdiv>\r\n\u003C\u002Fdiv>\r\n\u003Cbutton class=\"expandable-menu\" type=\"button\">OFFENSE \u003Ci class=\"sf-arrows-down-thin\">\u003C\u002Fi>\u003C\u002Fbutton>\r\n\r\n\u003Cdiv class=\"expanded-menu-items\">\r\n\u003Cdiv class=\"expanded-item-inner\">\r\n\u003Cdiv class=\"fb-stats-section-title\">Looking For More Explosive Plays\u003C\u002Fdiv>\r\n\u003Cbr>\r\nGeorgia returns eight starters on offense through four games in 2021, the Bulldogs are averaging 43.5 points\u002Fgame. In their last three games, Georgia has scored 158 points (52.7 points\u002Fgame).\u003Cbr>\r\n\u003Cbr>\r\nThe Bulldogs return their top five running backs, headlined by \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5491\" rel=\"smarttag\" rev=\"5491\">Zamir White\u003C\u002Fa>\u003C\u002Fdfn>. Georgia's top three receivers are also back in \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5436\" rel=\"smarttag\" rev=\"5436\">Kearis Jackson\u003C\u002Fa>\u003C\u002Fdfn>, \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5457\" rel=\"smarttag\" rev=\"5457\">George Pickens\u003C\u002Fa>\u003C\u002Fdfn> (currently injured) and \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5411\" rel=\"smarttag\" rev=\"5411\">Jermaine Burton\u003C\u002Fa>\u003C\u002Fdfn>. Pickens is coming back from a knee injury that happened in the spring.\u003Cbr>\r\n\u003Cbr>\r\nGeorgia has had five touchdown passes that have covered at least 38 yards. Most recently, \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5422\" rel=\"smarttag\" rev=\"5422\">JT Daniels\u003C\u002Fa>\u003C\u002Fdfn> had a 38 yarder to freshman AD Mitchell and a 43 yarder to Burton against South Carolina. On the year, Burton has 12 catches for 219 yards to be the Bulldogs' secondleading receiver. Mitchell was named the SEC Freshman of the Week following the win over the Gamecocks.\u003Cbr>\r\n\u003Cbr>\r\nOn the second play of the game versus UAB, Burton caught a 73-yard touchdown pass from \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5401\" rel=\"smarttag\" rev=\"5401\">Stetson Bennett\u003C\u002Fa>\u003C\u002Fdfn>. Also, Bennett had two more TD bombs in that game, a 61 yarder to redshirt freshman WR \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5471\" rel=\"smarttag\" rev=\"5471\">Arian Smith\u003C\u002Fa>\u003C\u002Fdfn> and an 89 yarder to freshman TE \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5495\" rel=\"smarttag\" rev=\"5495\">Brock Bowers\u003C\u002Fa>\u003C\u002Fdfn>. Smith has missed the last two games with an injury.\u003Cbr>\r\n\u003Cbr>\r\nThe 2020 season was the first under offensive coordinator \u003Cdfn>\u003Ca href=\"\u002Fcoaches.aspx?rc=2809\" rel=\"smarttag\" rev=\"2809\">Todd Monken\u003C\u002Fa>\u003C\u002Fdfn>, who placed a premium on explosive plays, which are at least a 12-yard rush or a 16-yard completion.\u003Cbr>\r\n \r\n\u003Ctable class=\"fb-stats-table\">\r\n\t\u003Ctbody>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd colspan=\"4\" style=\"color: #fff; background-color: #cc0000; padding: 10px; font-weight: bold;\">Explosive Play Summary In 2021\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>vs. #3 Clemson\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>2 (R, P)\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>1 (P)\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>Georgia 10-3\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>vs. UAB\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>13 (7 R, 6 P)\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>4 (3 R, P)\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>Georgia 56-7\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>vs. South Carolina\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>12 (5 R, 7 P)\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>6 (R, 5 P)\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>Georgia 40-13\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>@ Vanderbilt\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>11 (6 R, 5 P)\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>1 (R)\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>Georgia 62-0\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd colspan=\"4\">\u003Cstrong>Longest Rush by Georgia:\u003C\u002Fstrong> 24-yard TD by \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5449\" rel=\"smarttag\" rev=\"5449\">Ladd McConkey\u003C\u002Fa>\u003C\u002Fdfn> @ VU\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd colspan=\"4\">\u003Cstrong>Longest Rush by Opp.:\u003C\u002Fstrong> 23-yard by Larry Wooden (UAB)\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd colspan=\"4\">\u003Cstrong>Longest Completion by Georgia:\u003C\u002Fstrong> 89-yard TD vs. UAB (\u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5401\" rel=\"smarttag\" rev=\"5401\">Stetson Bennett\u003C\u002Fa>\u003C\u002Fdfn> to \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5495\" rel=\"smarttag\" rev=\"5495\">Brock Bowers\u003C\u002Fa>\u003C\u002Fdfn>)\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd colspan=\"4\">\u003Cstrong>Longest Completion by Opp.:\u003C\u002Fstrong> 61-yard by SC (Noland to Vann)\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\u003C\u002Ftbody>\r\n\u003C\u002Ftable>\r\n\r\n\u003Cdiv class=\"fb-stats-section-title\">Daniels 7-0 As A Starter\u003C\u002Fdiv>\r\n\u003Cbr>\r\n\u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5422\" rel=\"smarttag\" rev=\"5422\">JT Daniels\u003C\u002Fa>\u003C\u002Fdfn>, an Irvine, Calif., native who was recovering from a torn ACL at Southern Cal in 2019, served as Georgia's starting quarterback from game 7 of the Bulldogs' 2020 campaign through the 2021 opener.\u003Cbr>\r\n\u003Cbr>\r\nDaniels did not play against UAB due to an injury as senior \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5401\" rel=\"smarttag\" rev=\"5401\">Stetson Bennett\u003C\u002Fa>\u003C\u002Fdfn> got the start in a 56-7 win. Daniels returned to the starting lineup against South Carolina and has led Georgia to two straight victories over the Gamecocks and at Vanderbilt. He played just the first quarter against the Commodores as Georgia built a 35-0 lead.\u003Cbr>\r\n\u003Cbr>\r\nGeorgia ranks ninth nationally on third down conversions (28-for- 52, 53.8 percent) and a large reason of that is because of the play of Daniels. This year on third downs, he is 16-for-18 for 152 yards and two TDs, one INT and one sack. Twelve of the completions have resulted in a first down.\u003Cbr>\r\n\u003Cbr>\r\nBennett enjoyed a career a record-setting performance torching the Blazers for a school record tying five touchdown passes (all in the first half). He finished the day 10-for-12 for 288 yards with his scoring strikes covering 9, 12, 61, 73 and 89 yards. Bennett was named the SEC Offensive Player of the Week as well as to the Davey O'Brien Award's Great 8 list following his performance.\u003Cbr>\r\n \r\n\u003Ctable class=\"fb-stats-table\">\r\n\t\u003Ctbody>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd colspan=\"8\" style=\"color: #fff; background-color: #cc0000; padding: 10px; font-weight: bold;\">\u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=5422\" rel=\"smarttag\" rev=\"5422\">JT Daniels\u003C\u002Fa>\u003C\u002Fdfn> Passing (USC\u002FUGA Career)\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Cth>\u003Cstrong>2018 (@ USC)\u003C\u002Fstrong>\u003C\u002Fth>\r\n\t\t\t\u003Cth>\u003Cstrong>Att\u003C\u002Fstrong>\u003C\u002Fth>\r\n\t\t\t\u003Cth>\u003Cstrong>Cmp\u003C\u002Fstrong>\u003C\u002Fth>\r\n\t\t\t\u003Cth>\u003Cstrong>TD\u003C\u002Fstrong>\u003C\u002Fth>\r\n\t\t\t\u003Cth>\u003Cstrong>Int\u003C\u002Fstrong>\u003C\u002Fth>\r\n\t\t\t\u003Cth>\u003Cstrong>Yds\u003C\u002Fstrong>\u003C\u002Fth>\r\n\t\t\t\u003Cth>\u003Cstrong>Sk\u003C\u002Fstrong>\u003C\u002Fth>\r\n\t\t\t\u003Cth>\u003Cstrong>Eff.\u003C\u002Fstrong>\u003C\u002Fth>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>UNLV (W)\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>35\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>21\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>1\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>0\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>282\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>2\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>137.1\u003C\u002Ftd>\r\n\t\t\u0
