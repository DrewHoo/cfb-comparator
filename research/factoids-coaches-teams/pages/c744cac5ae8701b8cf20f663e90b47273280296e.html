<div class="position-title">Another Top 10 Matchup</div>
<br>
For the second year in a row, the Georgia-Florida game will be a top-10 matchup. Last season, No. 7 Georgia topped the No. 9 Gators 36-17. Before 2018, the last time the teams met when both were ranked came in 2012, and the No. 12 Bulldogs upset No. 3 Florida 17-9. Georgia is 3-3 all-time in the Florida series when both teams are ranked in the top 10. In the <dfn><a href="/coaches.aspx?rc=2592" rel="smarttag" rev="2592">Kirby Smart</a></dfn> era, Georgia is 6-3 versus top-10 teams.<br>
 
<div class="position-title">2018 Flashback: #7 Georgia 36, #9 Florida 17</div>
<br>
Seventh-ranked Georgia won a top-10 matchup against the ninth-ranked Gators in front of a crowd of 84,463 at TIAA Bank Field and a CBS national television audience. It was Georgia's second straight win in the series and fifth in the last eight years.<br>
<br>
<dfn><a href="/roster.aspx?rp_id=3967" rel="smarttag" rev="3967">Jake Fromm</a></dfn> competed 17-of-24 passes for 240 yards and three touchdowns. The TD passes all came on a third down while the Bulldog defense held Florida to 275 yards of total offense on 58 plays plus forced three turnovers. The three TD passes by Fromm tied the UGA mark in the UF series in the modern era, joining Aaron Murray (2010), Matthew Stafford (2007) and Buck Belue (1980).<br>
<br>
Georgia's offense tallied 429 yards on 65 plays. Florida had a memorable goal-line stand. After a Feleipe Franks fumble near his own goal line late in the third quarter, Georgia got the ball at the 1 and ran six plays before settling for a field goal and a 23-14 advantage.<br>
<br>
Early in the fourth quarter, UF had pulled to within nine, and the Bulldogs responded with a pair of scores. First, Georgia drove the ball 75 yards on nine plays capped by a 24-yard touchdown to <dfn><a href="/roster.aspx?rp_id=3090" rel="smarttag" rev="3090">Terry Godwin</a></dfn> on third-and-nine. Then after forcing a Gator punt, the Bulldogs went 66 yards on six plays, culminating with a 33-yard touchdown scamper by <dfn><a href="/roster.aspx?rp_id=4015" rel="smarttag" rev="4015">D'Andre Swift</a></dfn>. <dfn><a href="/roster.aspx?rp_id=3959" rel="smarttag" rev="3959">Tae Crowder</a></dfn> and <dfn><a href="/roster.aspx?rp_id=3985" rel="smarttag" rev="3985">Richard LeCounte</a></dfn> recovered Gator fumbles while Tyrique Mc- Ghee notched an interception. <dfn><a href="/roster.aspx?rp_id=4003" rel="smarttag" rev="4003">Monty Rice</a></dfn> finished with a career-high 11 tackles.<br>
 
<div class="position-title">Rushing Leader Gets The Win Again In 2018</div>
<br>
For the 13th straight year in the series, the team with the most rushing yards got the victory as Georgia outgained UF 189 to 170 in the 2018 contest. Georgia junior <dfn><a href="/roster.aspx?rp_id=3100" rel="smarttag" rev="3100">Elijah Holyfield</a></dfn> had a career-high 20 carries for 71 yards while sophomore <dfn><a href="/roster.aspx?rp_id=4015" rel="smarttag" rev="4015">D'Andre Swift</a></dfn> finished with a career-high 104 yards on just 12 carries for an 8.7 average.<br>
 
<div class="position-title">Series History</div>
<br>
Once again, Georgia and Florida meet with huge implications in the Southeastern Conference Eastern Division race. Georgia is 6-1 overall with a 3-1 mark in the SEC while Florida stands 7-1 and 4-1 in the league. In the all-time series with Florida, Georgia holds a 52-43-2 advantage including 45-41-1 in Jacksonville. Florida has the series 51-43-2 in favor of Georgia because it does not count the Bulldogs 52-0 victory in 1904 that was played in Macon.<br>
<br>
The Bulldogs are riding a two-game winning streak in the series after Florida captured three straight victories from 2014-16. Bulldog coach <dfn><a href="/coaches.aspx?rc=2592" rel="smarttag" rev="2592">Kirby Smart</a></dfn> is 2-1 against Florida while Gators coach Dan Mullen is in his second season with the Gators.<br>
 
<div class="position-title">Both Teams Coming Off Open Date</div>
<br>
This is only the eighth time in the series when both teams have had a bye before the game in Jacksonville. The first came in 2011 and Georgia is 4-3 against the Gators following both teams having a bye week. This marks the 27th time in the series that the Gators have had an open date before the matchup. Florida is 18-8 against the Bulldogs after an open date. Georgia is 7-6 following a bye week before playing the Gators, including a 26-17 win last year. In its last action, Florida topped South Carolina 38-27 in Columbia, S.C., on Oct. 19.<br>
 
<div class="position-title">Georgia-Florida Hall Of Fame Class of 2019</div>
<br>
On Friday, Nov. 1, the latest class is set for induction into the Georgia-Florida Hall of Fame. Georgia linebackers <dfn><a href="/staff.aspx?staff=3650" rel="smarttag" rev="3650">Jarvis Jones</a></dfn> and Rennie Curran along with Florida linebacker Brandon Spikes and defensive lineman Brad Culpepper will be inducted during the 24th annual luncheon at TIAA Bank Field. For more on this year's class, visit www.GAFLjax.com.<br>
 
<div class="position-title">Head Coach <dfn><a href="/coaches.aspx?rc=2592" rel="smarttag" rev="2592">Kirby Smart</a></dfn></div>

<div style="width: 300px; float: left; margin-right: 20px; margin-bottom: 20px; border: thin solid #ddd; padding: 20px;"><img alt="" src="https://georgiadogs.com/images/2019/8/26/smart_biophoto_300.png" style="display: inline-block;"><br>
<strong>Personal</strong><br>
Full Name: Kirby Paul Smart<br>
Birthdate: December 23, 1975<br>

Georgia (1995-98): Four-year letterman as defensive back. First team All-SEC in '98; 13 career interceptions; four-time member of SEC Academic Honor Roll.<br>
Bainbridge H.S. (1991-93): Three-year letterman in football, basketball, and baseball; first team Class AAAA All-State as a senior; 16 career interceptions.<br>

<br>
When Georgia looked for a head coach after the 2015 season, the arrows pointed to <dfn><a href="/coaches.aspx?rc=2592" rel="smarttag" rev="2592">Kirby Smart</a></dfn>, longtime Alabama defensive coordinator and former UGA player and assistant. The 2017 Associated Press SEC Coach of the Year has not disappointed.<br>
<br>
In his first year leading the Dogs in 2016, Georgia extended its school record to 20 consecutive bowl appearances and had five fourth-quarter comebacks including wins over No. 8 Auburn and No. 22 UNC.<br>
<br>
In 2017, Smart directed UGA to a 13-2 record, an SEC title, a win at The Rose Bowl Game during the CFP semifinal and a spot in the National Championship. He was named the Maxwell Football Club's George Munger National Coach of the Year. Before 2017, the Bulldogs last SEC title was 2005.<br>
<br>
The 2019 season saw the Bulldogs go 11-3 and earn a second straight trip to the SEC Championship Game and a berth to the Sugar Bowl.<br>
<br>
He has also made an immediate impact in recruiting, posting the nation's top-ranked class in 2018, the second-ranked class in 2019 and the third-ranked class in 2017. In addition to coaching, Smart oversees the <dfn><a href="/coaches.aspx?rc=2592" rel="smarttag" rev="2592">Kirby Smart</a></dfn> Family Foundation, which is focused on being champions in the community by supporting and giving back to needy children and families.<br>
<br>
Smart officially came home to Georgia on Dec. 6, 2015. But he still had unfinished business at Alabama, which was chasing a national title. He juggled two jobs for a month until January 11, 2016, when the Tide won its fourth national championship in a seven-year span. Twelve hours later, he was at work in Athens.

<br>

<div class="position-title">Pound The Rock</div>
<br>
Georgia is the only FBS team to have four different players go over 1,000 yards rushing during the 2017 and 2018 seasons. One of those from 2018 returns in Jr. <dfn><a href="/roster.aspx?rp_id=4015" rel="smarttag" rev="4015">D'Andre Swift</a></dfn>, who led the team with 1,049 and 10 touchdowns in 14 games last year with five starts. This season, Swift is averaging 6.8 yards/carry on 110 attempts for 760 yards and seven TDs. He also has 13 rec. for 148 yds. and a score.<br>
<br>
Most recently, Swift earned SEC Offensive Player of the Week honors after carrying the ball 21 times for 179 yards (8.5 avg.) in the win over UK. This was the highest output for Swift since he piled up a career-high 186 on 17 carries during the win over No. 24 Auburn last year.<br>
<br>
He now has seven career games with at least 100 yards, including a 104-yd. performance versus #9 Florida in 2018.<br>
<br>
Along with Swift, Georgia's tailbacks who have shared the load include Sr. <dfn><a href="/roster.aspx?rp_id=3972" rel="smarttag" rev="3972">Brian Herrien</a></dfn>, So. <dfn><a href="/roster.aspx?rp_id=3957" rel="smarttag" rev="3957">James Cook</a></dfn> and RFr. <dfn><a href="/roster.aspx?rp_id=4024" rel="smarttag" rev="4024">Zamir White</a></dfn>. Five different Bulldog tailbacks have scored this season.<br>
<br>
Fr. <dfn><a href="/roster.aspx?rp_id=4072" rel="smarttag" rev="4072">Kenny McIntosh</a></dfn> had a career long 62-yard TD run against Arkansas State and has also been active on special teams.<br>
<br>
Herrien got his first career start at VU and had 12 carries for 65 yards and a touchdown. He had a career high 88 yards on 11 carries at UT this year. White, who missed the 2018 season with an ACL injury and recovery, made his debut with five carries for 51 yards (10.2 avg.) with Bulldog fans chanting his nickname "Zeus" from the stadium seats at VU.<br>
 
<div class="position-title">A Look At The Line</div>
<br>
Georgia's starting offensive line averages 6 feet, 5 inches and 328.6 pounds, making it the biggest unit in Bulldog history.<br>
<br>
Georgia is ranked second nationally giving up only four sacks through seven games, including three of those versus USC.<br>
<br>
Georgia leads the SEC at 237.1 rushing yards/game.<br>
<br>
The Bulldogs returned four of five starters, including All- American LT <dfn><a href="/roster.aspx?rp_id=4016" rel="smarttag" rev="4016">Andrew Thomas</a></dfn> and Freshman All-American RT <dfn><a href="/roster.aspx?rp_id=4026" rel="smarttag" rev="4026">Isaiah Wilson</a></dfn> and <dfn><a href="/roster.aspx?rp_id=3987" rel="smarttag" rev="3987">Cade Mays</a></dfn>, who lined up at guard and tackle last season and has continued that trend in 2019. The aforementioned trio is also joined by juniors <dfn><a href="/roster.aspx?rp_id=3983" rel="smarttag" rev="3983">Solomon Kindley</a></dfn> and <dfn><a href="/roster.aspx?rp_id=3955" rel="smarttag" rev="3955">Ben Cleveland</a></dfn> and sophomore <dfn><a href="/roster.aspx?rp_id=3974" rel="smarttag" rev="3974">Trey Hill</a></dfn>, who all had starts in 2018. Hill is the Bulldogs' starter at C.<br>
<br>
Thomas was named the SEC Offensive Lineman of the Week following Georgia's dominating win over Vanderbilt. More recently he was named a Midseason All-American by several publications and sites.<br>
<br>
This season, Wilson, Kindley and junior <dfn><a href="/roster.aspx?rp_id=4009" rel="smarttag" rev="4009">Justin Shaffer</a></dfn> have all missed time with injuries. Sophomore <dfn><a href="/roster.aspx?rp_id=4007" rel="smarttag" rev="4007">Jamaree Salyer</a></dfn> has also filled in during these absences.<br>
 
<div class="position-title">Top Targets</div>
<br>
Georgia's leading receivers this year are freshman <dfn><a href="/roster.aspx?rp_id=4075" rel="smarttag" rev="4075">George Pickens</a></dfn> (23 rec.-318 yds.-2 TDs), graduate transfer <dfn><a href="/roster.aspx?rp_id=4061" rel="smarttag" rev="4061">Lawrence Cager</a></dfn> (19-245-3) and junior <dfn><a href="/roster.aspx?rp_id=4004" rel="smarttag" rev="4004">Demetris Robertson</a></dfn> (18-205-3). Cager, who completed his undergraduate degree at Miami (Fla.), sat out the Kentucky game with a rib cage injury that he sustained during the South Carolina game.<br>
<br>
Pickens had career highs with seven catches for 98 yards versus the Gamecocks. Robertson had a career high five catches for 51 yards and a score in the game.<br>
<br>
Freshman <dfn><a href="/roster.aspx?rp_id=4060" rel="smarttag" rev="4060">Dominick Blaylock</a></dfn> (11-206-2) has also shined this season. Blaylock had his first career 100-yard game in the win over Arkansas State (4-112-1). He is also serving as the team's punt returner of late.<br>
<br>
Senior <dfn><a href="/roster.aspx?rp_id=4010" rel="smarttag" rev="4010">Tyler Simmons</a></dfn> (10-89-0) is the veteran of the group. Simmons finished with a career high four catches for 33 yards versus South Carolina.<br>
<br>
The Bulldogs also have a pair of veteran tight ends in senior <dfn><a href="/roster.aspx?rp_id=4027" rel="smarttag" rev="4027">Charlie Woerner</a></dfn> and graduate transfer <dfn><a href="/roster.aspx?rp_id=4084" rel="smarttag" rev="4084">Eli Wolf</a></dfn> (Tennessee). Wolf has nine catches for 116 yards this season, including four for 73 against Murray State.<br>
 
<div class="position-title">Defense Leading The Way</div>
<br>
Georgia leads the SEC in Scoring Defense at 10.6 points/ game (No. 5 nationally), Rushing Defense at 85.7 yds/g (No. 5 nationally) and in Total Defense at 266.7 yds/g (No. 7 nationally). The Bulldogs have allowed just 74 points in 2019 (eight TDs, six FGs).<br>
<br>
The Bulldogs are the only team in the country yet to allow a rushing touchdown.<br>
<br>
The defense has posted 18 scoreless quarters, including shutouts against Arkansas State (55-0) and Kentucky (21-0). In its last five games, Georgia has surrendered just 10 points in the second half, which includes a field goal in double overtime. The Bulldogs have outscored opponents in the second half 112-20, including 65-7 in the fourth quarter.<br>
<br>
Most recently, Georgia blanked the Wildcats, held them to 177 total yards, including only 17 passing, and only allowed them in the Red Zone once.<br>
<br>
Georgia was trailing #7 Notre Dame 10-7 at the half (the touchdown allowed was on a five-play, 8-yard drive following a turnover) and held the Irish scoreless in the third quarter and just a touchdown in the final period in the 23-17 win.<br>
<br>
Through the first three games, Georgia had 12 sacks. However, the Bulldogs have just four through their last four games. Currently, Georgia is 10th (16) in the league in sacks after totaling just 24 last year. Florida leads the league with 29 in eight games.<br>
 
<div class="position-title">Up Front</div>
<br>
The personnel up front this season includes primarily <dfn><a href="/roster.aspx?rp_id=3960" rel="smarttag" rev="3960">Jordan Davis</a></dfn>, <dfn><a href="/roster.aspx?rp_id=3941" rel="smarttag" rev="3941">Michael Barnett</a></dfn>, <dfn><a href="/roster.aspx?rp_id=3954" rel="smarttag" rev="3954">Tyler Clark</a></dfn>, <dfn><a href="/roster.aspx?rp_id=3973" rel="smarttag" rev="3973">Malik Herring</a></dfn> and <dfn><a href="/roster.aspx?rp_id=4028" rel="smarttag" rev="4028">Devonte Wyatt</a></dfn>.<br>
<br>
The Bulldogs had 15 hurries in the latest victory over Kentucky and kept the Wildcats to only two completions.<br>
<br>
Clark finished with three tackles, including a tackle for loss on a 3rd-and-goal from the 2 yard line in double overtime, versus USC while Barnett led all interior linemen with five stops.<br>
<br>
The Bulldogs held #7 Notre Dame to just 46 yards rushing and have still not allowed a rushing touchdown this season.<br>
 
<div class="position-title">Reed Leading Defensive Backfield</div>
<br>
Graduate <dfn><a href="/roster.aspx?rp_id=4001" rel="smarttag" rev="4001">J.R. Reed</a></dfn> and Jr. <dfn><a href="/roster.aspx?rp_id=3985" rel="smarttag" rev="3985">Richard LeCounte</a></dfn> are starting at the safety spots along with RSo. <dfn><a href="/roster.aspx?rp_id=4014" rel="smarttag" rev="4014">Eric Stokes</a></dfn> and Jr. <dfn><a href="/roster.aspx?rp_id=4063" rel="smarttag" rev="4063">DJ Daniel</a></dfn> on the corners. Jr. <dfn><a href="/roster.aspx?rp_id=4022" rel="smarttag" rev="4022">Mark Webb</a></dfn> and RFr. <dfn><a href="/roster.aspx?rp_id=4025" rel="smarttag" rev="4025">Divaad Wilson</a></dfn> also have a combined six starts in the backfield. Daniel has started the last four games for the injured So. <dfn><a href="/roster.aspx?rp_id=3952" rel="smarttag" rev="3952">Tyson Campbell</a></dfn>.<br>
<br>
Reed is third on the team with 34 stops and LeCounte has 29 tackles so far this season and is fourth.<br>
<br>
With a team-leading six tackles for his name, LeCounte recovered a fumble that Reed forced in the Kentucky game. That turnover set up Georgia's second touchdown.<br>
<br>
Stokes rose to the occasion at Tennessee and had three tackles, including a sack and a forced fumble that turned into a touchdown, and three pass breakups.<br>
<br>
With Campbell unavailable against #7 Notre Dame and Stokes leaving the game in the first series with a knee injury, Georgia leaned on Sr. <dfn><a href="/roster.aspx?rp_id=3989" rel="smarttag" rev="3989">Tyrique McGhee</a></dfn>, Wilson and Daniel on the corners. Wilson had his first career interception and an 11- yard return that set up a field goal. Daniel finished with five stops, including a TFL, and had the final pass breakup at the 7-yard line on fourth down with 0:48 to play.<br>
<br>
Webb forced his first fumble of the year and Reed picked it up and returned it 14 yards for a touchdown against Murray State.<br>
 
<div class="position-title">Linebacker Leaders</div>
<br>
Led by veteran linebackers <dfn><a href="/roster.aspx?rp_id=3959" rel="smarttag" rev="3959">Tae Crowder</a></dfn>, <dfn><a href="/roster.aspx?rp_id=4003" rel="smarttag" rev="4003">Monty Rice</a></dfn> and <dfn><a href="/roster.aspx?rp_id=3969" rel="smarttag" rev="3969">Walter Grant</a></dfn>, the Bulldogs have welcomed in a younger contingent of RFr. <dfn><a href="/roster.aspx?rp_id=3996" rel="smarttag" rev="3996">Azeez Ojulari</a></dfn>, So. <dfn><a href="/roster.aspx?rp_id=4017" rel="smarttag" rev="4017">Channing Tindall</a></dfn>, So. <dfn><a href="/roster.aspx?rp_id=3939" rel="smarttag" rev="3939">Adam Anderson</a></dfn>, JUCO transfer <dfn><a href="/roster.aspx?rp_id=4067" rel="smarttag" rev="4067">Jermaine Johnson</a></dfn> and Fr. <dfn><a href="/roster.aspx?rp_id=4077" rel="smarttag" rev="4077">Nolan Smith</a></dfn> and <dfn><a href="/roster.aspx?rp_id=4065" rel="smarttag" rev="4065">Nakobe Dean</a></dfn> along with So. <dfn><a href="/roster.aspx?rp_id=4020" rel="smarttag" rev="4020">Quay Walker</a></dfn>.<br>
<br>
Dean and Walker came off the bench to each have a teamleading six stops in the shutout of Kentucky. Dean also forced his first fumble.<br>
<br>
Rice and Crowder were co-leaders against South Carolina with a career high 12 tackles each. Crowder led Georgia with nine stops, including a TFL, against #7 Notre Dame. At Tennessee, Crowder scooped up a fumble following a sack by Stokes and returned in 60 yards for a touchdown.<br>
<br>
Johnson earned his first career start against Murray State and responded with four tackles, including a TFL.<br>
<br>
Ojulari was the first freshman captain in the <dfn><a href="/coaches.aspx?rc=2592" rel="smarttag" rev="2592">Kirby Smart</a></dfn> era at UT and responded with a pair of sacks. He was limited to three games in 2018, including the 2019 Sugar Bowl, after recovering from a knee injury during his Sr. year at Marietta HS.<br>
 
<div class="position-title">Blankenship One Of The Best</div>
<br>
2019 Midseason All-American PK <dfn><a href="/roster.aspx?rp_id=3943" rel="smarttag" rev="3943">Rodrigo Blankenship</a></dfn> has tallied 66 points this year. His 9.4 points/game ranks second in the SEC. He is 12-for-14 on FGs and 30-for-30 on PATs.<br>
<br>
He has made three 50 yarders this year (@ VU, @ UT, SC).<br>
<br>
He has been named the SEC Special Teams Player of the Week three times in 2019 (@ VU, vs. #7 ND, @ UT). *Named semifinalist of the 2019 William V. Campbell Trophy for his combined academic success, football performance and exemplary leadership.<br>
<br>
Has connected on a school record 184 consecutive PATs, which ranks second in SEC history. The SEC record is 198 (Daniel Carlson, Auburn, 2014-17). The NCAA record is 233 (Alex Trlica, Texas Tech, 2004-07).<br>
<br>
Set a Rose Bowl Game record by drilling a career-long 55-yard field goal during the 2OT win over #2 Oklahoma. His performance included a 38-yard FG in overtime. In the 2018 National Championship Game, he drilled a 51 yarder in overtime to give Georgia a 23-20 lead over #4 Alabama.<br>

<br>

ders":985,"isLoadingStoryGameLeaders":122,"storyGamesTeamsStats":987,"isLoadingStoryGamesTeamsStats":989,"isStoryContentUnsafeHtml":990,"storyNextGame":991,"isLoadingStoryNextGame":122,"storyContentLoading":1019,"nextStory":1020,"storySettings":1021,"defaultSportTemplate":148,"preloadedTemplates":1026},{},{},{},{},{},{},{},{"8561761414308784":431},{"applyStandardFormatting":7,"blocks":12,"isBlockBased":122,"contentId":432,"contentTitle":112,"contentDate":433,"contentUrl":8,"contentImageUrl":434,"content":435,"contentTemplate":148,"id":436,"title":112,"titleInRotator":7,"subHeadline":18,"teaser":113,"type":437,"byline":18,"appExclusive":122,"date":433,"sportDisplay":202,"sport":438,"sportShortname":199,"primaryImage":441,"imageSource":434,"imageFocalPoint":12,"imageAltText":116,"imageCaption":18,"video":442,"url":8,"redirectAbsoluteUrl":18,"links":444,"homepageFeedTemplate":18,"games":445,"galleryId":368,"galleryImages":515,"writer":12,"players":516,"globalSportMapName":199,"storyMetaDescription":12,"storyMetaOgDescription":12,"storyMetaKeywords":12,"storyMetaOgTitle":12,"imageCreditText":12,"alternateImage":12,"insideContentImage":12,"formattedDate":983,"gamePostStoryId":504,"isMediaOnStoryPage":7},"54733","2019-10-28T10:48:00","\u002Fimages\u002F2019\u002F10\u002F14\u002FFootball_Game_Notes_Florida.jpg","\u003Clink href=\"https:\u002F\u002Ffonts.googleapis.com\u002Fcss?family=Robato:300,500,700\" rel=\"stylesheet\">\r\n\u003Clink href=\"https:\u002F\u002Fstatic.georgiadogs.com\u002Flibrary\u002Fcss\u002F17fb-notes.css\" rel=\"stylesheet\" type=\"text\u002Fcss\">\r\n\u003Cdiv class=\"football-notes\">\r\n\u003Cdiv style=\"text-align: center;\">\u003Ca class=\"notes-btn\" href=\"https:\u002F\u002Fgeorgiadogs.com\u002Ffootball-gamenotes\u002F\" style=\"font-size: 18px; font-weight: bold; color: #fff;\" target=\"_blank\">Complete Game Notes (PDF)\u003C\u002Fa>\u003C\u002Fdiv>\r\n\r\n\u003Ch1>The Georgia Bulldogs vs. The Florida Gators\u003C\u002Fh1>\r\n\r\n\u003Ch2>Game & Broadcast Info\u003C\u002Fh2>\r\n\r\n\u003Cdiv class=\"noteslist\">\r\n\u003Cul>\r\n\t\u003Cli>\u003Cstrong>Kickoff:\u003C\u002Fstrong> Saturday, November 2 - 3:30 p.m. ET\u003C\u002Fli>\r\n\t\u003Cli>\u003Cstrong>Location:\u003C\u002Fstrong> TIAA Bank Field (82,917) - Jacksonville, Fla.\u003C\u002Fli>\r\n\t\u003Cli>\u003Cstrong>2019 Records:\u003C\u002Fstrong> Georgia 6-1 (3-1 SEC), Florida 7-1 (4-1 SEC)\u003C\u002Fli>\r\n\t\u003Cli>\u003Cstrong>History:\u003C\u002Fstrong> \u003Ca href=\"Belisle\">Georgia vs. Florida All-Time Series Results\u003C\u002Fa>\u003C\u002Fli>\r\n\t\u003Cli>\u003Cstrong>Rankings:\u003C\u002Fstrong> Georgia #8\u002F7, Florida #6\u003C\u002Fli>\r\n\t\u003Cli>\u003Cstrong>TV:\u003C\u002Fstrong> CBS - Brad Nessler (PxP), Gary Danielson (analyst), Jamie Erdahl (sidelines)\u003C\u002Fli>\r\n\t\u003Cli>\u003Cstrong>Video Stream:\u003C\u002Fstrong> \u003Ca href=\"http:\u002F\u002Fwww.cbssports.com\u002Fcollege-football\u002Fsec-live\u002F\" target=\"_blank\">CBSSports.com\u003C\u002Fa>\u003C\u002Fli>\r\n\t\u003Cli>\u003Cstrong>Radio:\u003C\u002Fstrong> WSB AM 750 - Bulldog Network | \u003Ca href=\"http:\u002F\u002Fwww.georgiadogs.com\u002Fmultimedia\u002Fgeo-radio-affiliates.html\">Affiliates\u003C\u002Fa> | Scott Howard (PxP), Eric Zeier (Color), Chuck Dowdle (sideline)\u003C\u002Fli>\r\n\t\u003Cli>\u003Cstrong>Audio Stream:\u003C\u002Fstrong> \u003Ca href=\"https:\u002F\u002Fgeorgiadogs.com\u002Fshowcase?Live=3522\" target=\"_blank\">georgiadogs.com\u003C\u002Fa> | \u003Ca href=\"http:\u002F\u002Ftunein.com\u002Fradio\u002FGeorgia-Bulldog-Sports-Network-from-IMG-s230235\u002F\" target=\"_blank\">TuneIn\u003C\u002Fa>\u003C\u002Fli>\r\n\t\u003Cli>\u003Cstrong>Satellite:\u003C\u002Fstrong> SiriusXM: 81\u002F81\u002F81\u003C\u002Fli>\r\n\t\u003Cli>\u003Cstrong>Web Stats:\u003C\u002Fstrong> \u003Ca href=\"https:\u002F\u002Fgeorgiadogs.com\u002Fsidearmstats\u002Ffootball\u002Fsummary\" target=\"_blank\">Live Stats\u003C\u002Fa>\u003C\u002Fli>\r\n\t\u003Cli>\u003Cstrong>Twitter:\u003C\u002Fstrong> #UGAvsFLA\u003C\u002Fli>\r\n\t\u003Cli>\u003Cstrong>ReBroadcast:\u003C\u002Fstrong> SEC Network: 11\u002F1 3AM, 11\u002F1 5AM, 11\u002F6 12PM\u003C\u002Fli>\r\n\u003C\u002Ful>\r\n\u003C\u002Fdiv>\r\n\r\n\u003Ctable cellpadding=\"5\" cellspacing=\"5\" class=\"gridtable\" style=\"border: 0 solid #fff;\" width=\"100%\">\r\n\t\u003Ctbody>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd align=\"right\" style=\"background-color: #cc0000; color: #fff;\" width=\"30%\">\u003Cstrong>Georgia\u003C\u002Fstrong>\u003C\u002Ftd>\r\n\t\t\t\u003Ctd align=\"center\" style=\"background-color: #fff; color: #666;\" width=\"30%\">2019 Averages\u003C\u002Ftd>\r\n\t\t\t\u003Ctd style=\"background-color: #0021A5; color: #FF4A00;\" width=\"30%\">\u003Cstrong>Florida\u003C\u002Fstrong>\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd align=\"right\">36.0\u003C\u002Ftd>\r\n\t\t\t\u003Ctd align=\"center\">Scoring Offense\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>32.5\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd align=\"right\">10.6\u003C\u002Ftd>\r\n\t\t\t\u003Ctd align=\"center\">Scoring Defense\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>15.8\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd align=\"right\">+1\u003C\u002Ftd>\r\n\t\t\t\u003Ctd align=\"center\">Turnover Margin\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>+3\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd align=\"right\">471.3\u003C\u002Ftd>\r\n\t\t\t\u003Ctd align=\"center\">Total Offense\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>419.6\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd align=\"right\">236.9\u003C\u002Ftd>\r\n\t\t\t\u003Ctd align=\"center\">Rushing Offense\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>142.4\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd align=\"right\">234.4\u003C\u002Ftd>\r\n\t\t\t\u003Ctd align=\"center\">Passing Offense\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>277.2\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd align=\"right\">13.7\u003C\u002Ftd>\r\n\t\t\t\u003Ctd align=\"center\">Punt Returns\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>4.8\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd align=\"right\">14.0\u003C\u002Ftd>\r\n\t\t\t\u003Ctd align=\"center\">Kickoff Returns\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>21.0\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\u003C\u002Ftbody>\r\n\u003C\u002Ftable>\r\n \r\n\r\n\u003Cdiv class=\"position-title\">Another Top 10 Matchup\u003C\u002Fdiv>\r\n\u003Cbr>\r\nFor the second year in a row, the Georgia-Florida game will be a top-10 matchup. Last season, No. 7 Georgia topped the No. 9 Gators 36-17. Before 2018, the last time the teams met when both were ranked came in 2012, and the No. 12 Bulldogs upset No. 3 Florida 17-9. Georgia is 3-3 all-time in the Florida series when both teams are ranked in the top 10. In the \u003Cdfn>\u003Ca href=\"\u002Fcoaches.aspx?rc=2592\" rel=\"smarttag\" rev=\"2592\">Kirby Smart\u003C\u002Fa>\u003C\u002Fdfn> era, Georgia is 6-3 versus top-10 teams.\u003Cbr>\r\n \r\n\u003Cdiv class=\"position-title\">2018 Flashback: #7 Georgia 36, #9 Florida 17\u003C\u002Fdiv>\r\n\u003Cbr>\r\nSeventh-ranked Georgia won a top-10 matchup against the ninth-ranked Gators in front of a crowd of 84,463 at TIAA Bank Field and a CBS national television audience. It was Georgia's second straight win in the series and fifth in the last eight years.\u003Cbr>\r\n\u003Cbr>\r\n\u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=3967\" rel=\"smarttag\" rev=\"3967\">Jake Fromm\u003C\u002Fa>\u003C\u002Fdfn> competed 17-of-24 passes for 240 yards and three touchdowns. The TD passes all came on a third down while the Bulldog defense held Florida to 275 yards of total offense on 58 plays plus forced three turnovers. The three TD passes by Fromm tied the UGA mark in the UF series in the modern era, joining Aaron Murray (2010), Matthew Stafford (2007) and Buck Belue (1980).\u003Cbr>\r\n\u003Cbr>\r\nGeorgia's offense tallied 429 yards on 65 plays. Florida had a memorable goal-line stand. After a Feleipe Franks fumble near his own goal line late in the third quarter, Georgia got the ball at the 1 and ran six plays before settling for a field goal and a 23-14 advantage.\u003Cbr>\r\n\u003Cbr>\r\nEarly in the fourth quarter, UF had pulled to within nine, and the Bulldogs responded with a pair of scores. First, Georgia drove the ball 75 yards on nine plays capped by a 24-yard touchdown to \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=3090\" rel=\"smarttag\" rev=\"3090\">Terry Godwin\u003C\u002Fa>\u003C\u002Fdfn> on third-and-nine. Then after forcing a Gator punt, the Bulldogs went 66 yards on six plays, culminating with a 33-yard touchdown scamper by \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=4015\" rel=\"smarttag\" rev=\"4015\">D'Andre Swift\u003C\u002Fa>\u003C\u002Fdfn>. \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=3959\" rel=\"smarttag\" rev=\"3959\">Tae Crowder\u003C\u002Fa>\u003C\u002Fdfn> and \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=3985\" rel=\"smarttag\" rev=\"3985\">Richard LeCounte\u003C\u002Fa>\u003C\u002Fdfn> recovered Gator fumbles while Tyrique Mc- Ghee notched an interception. \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=4003\" rel=\"smarttag\" rev=\"4003\">Monty Rice\u003C\u002Fa>\u003C\u002Fdfn> finished with a career-high 11 tackles.\u003Cbr>\r\n \r\n\u003Cdiv class=\"position-title\">Rushing Leader Gets The Win Again In 2018\u003C\u002Fdiv>\r\n\u003Cbr>\r\nFor the 13th straight year in the series, the team with the most rushing yards got the victory as Georgia outgained UF 189 to 170 in the 2018 contest. Georgia junior \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=3100\" rel=\"smarttag\" rev=\"3100\">Elijah Holyfield\u003C\u002Fa>\u003C\u002Fdfn> had a career-high 20 carries for 71 yards while sophomore \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=4015\" rel=\"smarttag\" rev=\"4015\">D'Andre Swift\u003C\u002Fa>\u003C\u002Fdfn> finished with a career-high 104 yards on just 12 carries for an 8.7 average.\u003Cbr>\r\n \r\n\u003Cdiv class=\"position-title\">Series History\u003C\u002Fdiv>\r\n\u003Cbr>\r\nOnce again, Georgia and Florida meet with huge implications in the Southeastern Conference Eastern Division race. Georgia is 6-1 overall with a 3-1 mark in the SEC while Florida stands 7-1 and 4-1 in the league. In the all-time series with Florida, Georgia holds a 52-43-2 advantage including 45-41-1 in Jacksonville. Florida has the series 51-43-2 in favor of Georgia because it does not count the Bulldogs 52-0 victory in 1904 that was played in Macon.\u003Cbr>\r\n\u003Cbr>\r\nThe Bulldogs are riding a two-game winning streak in the series after Florida captured three straight victories from 2014-16. Bulldog coach \u003Cdfn>\u003Ca href=\"\u002Fcoaches.aspx?rc=2592\" rel=\"smarttag\" rev=\"2592\">Kirby Smart\u003C\u002Fa>\u003C\u002Fdfn> is 2-1 against Florida while Gators coach Dan Mullen is in his second season with the Gators.\u003Cbr>\r\n \r\n\u003Cdiv class=\"position-title\">Both Teams Coming Off Open Date\u003C\u002Fdiv>\r\n\u003Cbr>\r\nThis is only the eighth time in the series when both teams have had a bye before the game in Jacksonville. The first came in 2011 and Georgia is 4-3 against the Gators following both teams having a bye week. This marks the 27th time in the series that the Gators have had an open date before the matchup. Florida is 18-8 against the Bulldogs after an open date. Georgia is 7-6 following a bye week before playing the Gators, including a 26-17 win last year. In its last action, Florida topped South Carolina 38-27 in Columbia, S.C., on Oct. 19.\u003Cbr>\r\n \r\n\u003Cdiv class=\"position-title\">Georgia-Florida Hall Of Fame Class of 2019\u003C\u002Fdiv>\r\n\u003Cbr>\r\nOn Friday, Nov. 1, the latest class is set for induction into the Georgia-Florida Hall of Fame. Georgia linebackers \u003Cdfn>\u003Ca href=\"\u002Fstaff.aspx?staff=3650\" rel=\"smarttag\" rev=\"3650\">Jarvis Jones\u003C\u002Fa>\u003C\u002Fdfn> and Rennie Curran along with Florida linebacker Brandon Spikes and defensive lineman Brad Culpepper will be inducted during the 24th annual luncheon at TIAA Bank Field. For more on this year's class, visit www.GAFLjax.com.\u003Cbr>\r\n \r\n\u003Cdiv class=\"position-title\">Head Coach \u003Cdfn>\u003Ca href=\"\u002Fcoaches.aspx?rc=2592\" rel=\"smarttag\" rev=\"2592\">Kirby Smart\u003C\u002Fa>\u003C\u002Fdfn>\u003C\u002Fdiv>\r\n\r\n\u003Cdiv style=\"width: 300px; float: left; margin-right: 20px; margin-bottom: 20px; border: thin solid #ddd; padding: 20px;\">\u003Cimg alt=\"\" src=\"https:\u002F\u002Fgeorgiadogs.com\u002Fimages\u002F2019\u002F8\u002F26\u002Fsmart_biophoto_300.png\" style=\"display: inline-block;\">\u003Cbr>\r\n\u003Cstrong>Personal\u003C\u002Fstrong>\u003Cbr>\r\nFull Name: Kirby Paul Smart\u003Cbr>\r\nBirthdate: December 23, 1975\u003Cbr>\r\nBirthplace: Montgomery, Alabama\u003Cbr>\r\nFamily: Wife: Mary Beth; Children: twins Weston and Julia (Feb. 8, 2008), and Andrew (May 25, 2012)\u003Cbr>\r\nHigh School: Bainbridge (Ga.)\u003Cbr>\r\nCollege: BBA Georgia '98; MS Arkansas State State '03\u003Cbr>\r\n\u003Cbr>\r\n\u003Cstrong>Coaching Experience\u003C\u002Fstrong>\u003Cbr>\r\n1999 Georgia Admin. Asst.\u003Cbr>\r\n2000 Valdosta State Defensive Backs\u003Cbr>\r\n2001 Valdosta State Def. Coord.\u003Cbr>\r\n2002-03 FSU Grad. Assistant\u003Cbr>\r\n2004 Arkansas State Defensive Backs\u003Cbr>\r\n2005 Georgia Running Backs\u003Cbr>\r\n2006 Miami Dolphins Safeties\u003Cbr>\r\n2007 Alabama Asst. HC\u002FDBs\u003Cbr>\r\n2008-13, '15 Alabama Def. Coord.\u002FILBs\u003Cbr>\r\n2014 Alabama Asst. HC\u002FSafeties\u003Cbr>\r\n2016-current Georgia Head Coach\u003Cbr>\r\n\u003Cbr>\r\n\u003Cstrong>Playing Experience\u003C\u002Fstrong>\u003Cbr>\r\nGeorgia (1995-98): Four-year letterman as defensive back. First team All-SEC in '98; 13 career interceptions; four-time member of SEC Academic Honor Roll.\u003Cbr>\r\nBainbridge H.S. (1991-93): Three-year letterman in football, basketball, and baseball; first team Class AAAA All-State as a senior; 16 career interceptions.\u003Cbr>\r\nHigh School Coach: Sonny Smart (father)\u003C\u002Fdiv>\r\n\u003Cbr>\r\nWhen Georgia looked for a head coach after the 2015 season, the arrows pointed to \u003Cdfn>\u003Ca href=\"\u002Fcoaches.aspx?rc=2592\" rel=\"smarttag\" rev=\"2592\">Kirby Smart\u003C\u002Fa>\u003C\u002Fdfn>, longtime Alabama defensive coordinator and former UGA player and assistant. The 2017 Associated Press SEC Coach of the Year has not disappointed.\u003Cbr>\r\n\u003Cbr>\r\nIn his first year leading the Dogs in 2016, Georgia extended its school record to 20 consecutive bowl appearances and had five fourth-quarter comebacks including wins over No. 8 Auburn and No. 22 UNC.\u003Cbr>\r\n\u003Cbr>\r\nIn 2017, Smart directed UGA to a 13-2 record, an SEC title, a win at The Rose Bowl Game during the CFP semifinal and a spot in the National Championship. He was named the Maxwell Football Club's George Munger National Coach of the Year. Before 2017, the Bulldogs last SEC title was 2005.\u003Cbr>\r\n\u003Cbr>\r\nThe 2019 season saw the Bulldogs go 11-3 and earn a second straight trip to the SEC Championship Game and a berth to the Sugar Bowl.\u003Cbr>\r\n\u003Cbr>\r\nHe has also made an immediate impact in recruiting, posting the nation's top-ranked class in 2018, the second-ranked class in 2019 and the third-ranked class in 2017. In addition to coaching, Smart oversees the \u003Cdfn>\u003Ca href=\"\u002Fcoaches.aspx?rc=2592\" rel=\"smarttag\" rev=\"2592\">Kirby Smart\u003C\u002Fa>\u003C\u002Fdfn> Family Foundation, which is focused on being champions in the community by supporting and giving back to needy children and families.\u003Cbr>\r\n\u003Cbr>\r\nSmart officially came home to Georgia on Dec. 6, 2015. But he still had unfinished business at Alabama, which was chasing a national title. He juggled two jobs for a month until January 11, 2016, when the Tide won its fourth national championship in a seven-year span. Twelve hours later, he was at work in Athens.\r\n\u003Ctable style=\"max-width: 600px; width: 100%;\">\r\n\t\u003Ctbody>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd colspan=\"5\" style=\"background-color:#cc0000; color:#fff; text-align:center; font-weight:bold;\">Coach Smart's Record\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>\u003Cstrong>Year\u003C\u002Fstrong>\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>\u003Cstrong>W\u003C\u002Fstrong>\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>\u003Cstrong>L\u003C\u002Fstrong>\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>\u003Cstrong>Pct.\u003C\u002Fstrong>\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>\u003Cstrong>SEC\u003C\u002Fstrong>\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>2016\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>8\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>5\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>.615\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>4-4\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>2017\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>13\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>2\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>.866\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>7-1\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>2018\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>11\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>3\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>.786\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>7-1\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>2019\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>5\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>1\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>.833\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>2-1\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>Total\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>38\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>11\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>.776\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>22-9\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\u003C\u002Ftbody>\r\n\u003C\u002Ftable>\r\n\u003Cbr>\r\n\u003Cbr>\r\n\u003Cstrong>Did You Know?\u003C\u002Fstrong>\u003Cbr>\r\n\u003Cdfn>\u003Ca href=\"\u002Fcoaches.aspx?rc=2592\" rel=\"smarttag\" rev=\"2592\">Kirby Smart\u003C\u002Fa>\u003C\u002Fdfn> is one of 11 head coaches at schools from Power 5 conferences that are coaching at their alma maters.\u003Cbr>\r\n\u003Cbr>\r\nThe complete list:\u003Cbr>\r\nPaul Chryst (Wisconsin), Barry Odom (Missouri), Pat Fitzgerald (Northwestern), David Shaw (Stanford), Scott Frost (Nebraska), \u003Cdfn>\u003Ca href=\"\u002Fcoaches.aspx?rc=2592\" rel=\"smarttag\" rev=\"2592\">Kirby Smart\u003C\u002Fa>\u003C\u002Fdfn> (GEORGIA), Mike Gundy (Oklahoma State), Jonathan Smith (Oregon State), Jim Harbaugh (Michigan), Tom Allen (Indiana), Matt Luke (Ole Miss)\u003Cbr>\r\n\u003Cbr>\r\n\u003Cstrong>Top Ind. Single-Game Performances Under Smart\u003C\u002Fstrong>\u003Cbr>\r\nRushing Yards: 222, Nick Chubb vs. #22 UNC (9\u002F3\u002F16)\u003Cbr>\r\nRushing TDs: 3, Sony Michel vs. UK (11\u002F18\u002F17); vs. #2 Oklahoma (1\u002F1\u002F18)\u003Cbr>\r\nLongest Rush: 83-TD, \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=4015\" rel=\"smarttag\" rev=\"4015\">D'Andre Swift\u003C\u002Fa>\u003C\u002Fdfn> @ #9 UK (11\u002F3\u002F18)\u003Cbr>\r\nPassing Yards: 346, Jacob Eason vs. VU (10\u002F15\u002F16)\u003Cbr>\r\nPassing TDs: 4, \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=3967\" rel=\"smarttag\" rev=\"3967\">Jake Fromm\u003C\u002Fa>\u003C\u002Fdfn> vs. GT (11\u002F25\u002F18)\u003Cbr>\r\nReceiving TDs: 2, Isaiah McKenzie @ Missouri (9\u002F17\u002F16); \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=3090\" rel=\"smarttag\" rev=\"3090\">Terry Godwin\u003C\u002Fa>\u003C\u002Fdfn> vs. Samford (9\u002F16\u002F17); \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=3099\" rel=\"smarttag\" rev=\"3099\">Jeremiah Holloman\u003C\u002Fa>\u003C\u002Fdfn> vs. #9 Florida (10\u002F27\u002F18); \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=3126\" rel=\"smarttag\" rev=\"3126\">Riley Ridley\u003C\u002Fa>\u003C\u002Fdfn> vs. GT (11\u002F2518)\u003Cbr>\r\nLongest Pass\u002FTD Pass: 80-TD, Fromm to \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=3093\" rel=\"smarttag\" rev=\"3093\">Mecole Hardman\u003C\u002Fa>\u003C\u002Fdfn> vs. BAMA (1\u002F8\u002F18)\u003Cbr>\r\nTackles: 13, Roquan Smith vs. GT (11\u002F26\u002F16); SECCG (12\u002F2\u002F17); CFPNC (1\u002F1\u002F18)\u003Cbr>\r\nSacks: 3, Trenton Thompson vs. TCU (12\u002F30\u002F16)\u003Cbr>\r\nTFL: 3, Thompson vs. Nicholls (9\u002F10\u002F16)\u003Cbr>\r\n\u003Cbr>\r\n\u003Cstrong>Quick Facts\u003C\u002Fstrong>\r\n\r\n\u003Cul>\r\n\t\u003Cli>Clinched the 2018 SEC East title with the team's second straight 6-0 mark in the division.\u003C\u002Fli>\r\n\t\u003Cli>2017 Georgia Munger National Coach of the Year finalist, leading UGA to a 13-2 record, a Rose Bowl Game victory and an appearance the CFP National Championship Game.\u003C\u002Fli>\r\n\t\u003Cli>The Bulldogs' No. 2 AP ranking in 2017 was the team's top AP ranking since week three of the 2008 season when Georgia was No. 2.\u003C\u002Fli>\r\n\t\u003Cli>Advanced to 2017 & 2018 SECCG.\u003C\u002Fli>\r\n\t\u003Cli>Went 6-0 in the division in 2017 and 2018 for the first time since the SEC split into divisions in 1992.\u003C\u002Fli>\r\n\t\u003Cli>Seven fourth-quarter comebacks, including wins over #8 AU (2016), #22 UNC in Atlanta (2016), @ #24 Notre Dame (2017), vs. #2 Oklahoma in 2018 Rose Bowl Game.\u003C\u002Fli>\r\n\t\u003Cli>Led UGA to its first win over a ranked team in a season opener away from Dooley Field at Sanford Stadium in school history, posting a 33-24 win over #22 UNC during the 2016 Chick-Fil-A Kickoff Classic\u003C\u002Fli>\r\n\u003C\u002Ful>\r\n\u003Cstrong>12 Defense\u002FSpecial Teams Scores\u003C\u002Fstrong>\u003Cbr>\r\n\u003Cstrong>2016:\u003C\u002Fstrong> Safety vs. #22 UNC; Lorenzo Carter 24-yd fumble recovery for TD vs. Nicholls; \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=3090\" rel=\"smarttag\" rev=\"3090\">Terry Godwin\u003C\u002Fa>\u003C\u002Fdfn> 43-yd KOR for TD @ SC; Maurice Smith 34-yd INT return for TD vs. #8 AU; Isaiah McKenzie 82-yd PR for TD vs. ULL\u003Cbr>\r\n\u003Cstrong>2017:\u003C\u002Fstrong> \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=4001\" rel=\"smarttag\" rev=\"4001\">J.R. Reed\u003C\u002Fa>\u003C\u002Fdfn> 3-yd fumble recovery for TD vs. Florida\u003Cbr>\r\n\u003Cstrong>2018:\u003C\u002Fstrong> \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=3140\" rel=\"smarttag\" rev=\"3140\">Juwan Taylor\u003C\u002Fa>\u003C\u002Fdfn> 1-yd INT return for TD @ USC; \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=3093\" rel=\"smarttag\" rev=\"3093\">Mecole Hardman\u003C\u002Fa>\u003C\u002Fdfn> 70-yd PR for TD vs. MTSU; \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=3952\" rel=\"smarttag\" rev=\"3952\">Tyson Campbell\u003C\u002Fa>\u003C\u002Fdfn> 64-yd fumble recovery for TD & \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=4014\" rel=\"smarttag\" rev=\"4014\">Eric Stokes\u003C\u002Fa>\u003C\u002Fdfn> 8-yd blocked punt for TD @ Missouri\u003Cbr>\r\n\u003Cstrong>2019:\u003C\u002Fstrong> \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=4001\" rel=\"smarttag\" rev=\"4001\">J.R. Reed\u003C\u002Fa>\u003C\u002Fdfn> 14-yd PR for TD vs. Murray St.; \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=3959\" rel=\"smarttag\" rev=\"3959\">Tae Crowder\u003C\u002Fa>\u003C\u002Fdfn> 60-yd fumble recovery for TD @ Tennessee\r\n\r\n\u003Ctable class=\"sidearm-table\" style=\"border: 0 solid #fff;\" width=\"100%\">\r\n\t\u003Ctbody>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd colspan=\"8\" style=\"color: #000; background-color: #eee; padding: 5px; font-weight: bold;\">7 Victories When Tied Or Trailing Late\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>\u003Cstrong>Year\u003C\u002Fstrong>\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>\u003Cstrong>Opponent\u003C\u002Fstrong>\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>\u003Cstrong>Start of 4th Qtr.\u003C\u002Fstrong>\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>\u003Cstrong>Final\u003C\u002Fstrong>\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>2016\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>%#22 UNC\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>Trailed 24-23\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>33-24\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>2016\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>@ MIZZ\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>Trailed 27-21\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>28-27\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>2016\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>@ UK\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>Trailed 21-16\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>27-24\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>2016\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>#8 AUB\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>Tied 7-7\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>13-7\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>2016\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>^TCU\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>Trailed 23-21\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>31-23\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>2017\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>#24 UND\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>17-16, trailed 19-17 with 10:21 left\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>20-19\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>2018\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>$ #2 Oklahoma 31-31\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>trailed 45-38 with 0:55 left\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>54-48 2ot\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\u003C\u002Ftbody>\r\n\u003C\u002Ftable>\r\n\u003Cbr>\r\n%Chick-fil-A Kickoff Classic; ^Liberty Bowl; $Rose Bowl Game\r\n\u003Cdiv class=\"position-title\">Bulldogs Verus Top 10 Teams In the Smart Era\u003C\u002Fdiv>\r\n\u003Cbr>\r\nGeorgia is 6-3 against top 10 teams in the \u003Cdfn>\u003Ca href=\"\u002Fcoaches.aspx?rc=2592\" rel=\"smarttag\" rev=\"2592\">Kirby Smart\u003C\u002Fa>\u003C\u002Fdfn> era, including 2-0 in Athens. Two of the games have been on the road and five have come at neutral sites.\u003Cbr>\r\n\u003Cbr>\r\nNov. 12, 2016 NR Georgia d. #9 Auburn 13-7 in Athens\u003Cbr>\r\nNov. 11, 2017 #10 Auburn d. #2 Georgia 40-17 in Auburn\u003Cbr>\r\nDec. 2, 2017 #6 Georgia d. #4 Auburn 28-7 in Atlanta, SEC Championship Game\u003Cbr>\r\nJan. 1, 2018 #3 Georgia d. #2 Oklahoma 54-48 {2OT} in Pasadena, CFP Semifinal - Rose Bowl Game\u003Cbr>\r\nJan. 8, 2018 #4 Alabama d. #3 Georgia 26-23 {OT} in Atlanta, National Championship Game\u003Cbr>\r\nOct. 27, 2018 #7 Georgia d. #9 Florida 36-17 in Jacksonville\u003Cbr>\r\nNov. 3, 2018 #6 Georgia d. #9 Kentucky 34-17 in Lexington\u003Cbr>\r\nDec. 1, 2018 #1 Alabama d. #4 Georgia 35-28 in Atlanta, SEC Championship Game\u003Cbr>\r\nSep. 21, 2019 #3 Georgia d. #7 Notre Dame 23-17 in Athens\u003Cbr>\r\n \r\n\u003Cdiv class=\"position-title\">Fromm Directs The Offense\u003C\u002Fdiv>\r\n\u003Cbr>\r\n\u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=3967\" rel=\"smarttag\" rev=\"3967\">Jake Fromm\u003C\u002Fa>\u003C\u002Fdfn> is 29-6 as a starter, including 9-5 versus Top 25 teams. He has started an FBS best 35 straight games for QBs.\u003Cbr>\r\n\u003Cbr>\r\nRanks in the top five in UGA history for touchdown passes (63), passing yards (6,770) and pass completions (510).\u003Cbr>\r\n\u003Cbr>\r\nIn rainy conditions versus Kentucky, the Bulldogs ran the ball 43 times on 55 total plays for 235 yards during a 21-0 shutout.\u003Cbr>\r\n\u003Cbr>\r\nAfter going 24-for-29 (83%) for 288 yards and two touchdowns in a win at Tennessee, Fromm set career highs for attempts (51), completions (28) and interceptions (three) in a double-overtime loss to South Carolina.\u003Cbr>\r\n\u003Cbr>\r\nCurrently 123-for-174 (71%, No. 8 nationally) for 1,406 yards and nine TDs with three interceptions during Georgia's 6-1 start.\u003Cbr>\r\n\u003Cbr>\r\nGeorgia ranks third in the SEC in Scoring Offense (36.0 ppg).\u003Cbr>\r\n\u003Cbr>\r\nThe Warner Robins, Ga., native finished last year ranked fifth in the country in Passing Efficiency at 171.2, which ranked second in school history. In 2019, he currently stands at 152.2.\u003Cbr>\r\n\u003Cbr>\r\nIn his career, Fromm has led his team to three comeback wins when trailing at the half, including versus #7 Notre Dame in Athens this season and over #2 Oklahoma in the 2018 Rose Bowl Game\u002F College Football Playoff Semifinal Game.\u003Cbr>\r\n\u003Cbr>\r\nCurrently, the No. 2 QB is RSo. \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=4059\" rel=\"smarttag\" rev=\"4059\">Stetson Bennett\u003C\u002Fa>\u003C\u002Fdfn>, who is in his second stint with the Bulldogs after re-enrolling in UGA in January. Bennett was on the 2017 Bulldog squad that went 13-2 and he was named the Offensive Scout Team Player of the Year. He spent 2018 at Jones County JC in Mississippi. This season, Bennett is 18-for-23 (78.3%) for 233 yards with two TDs and one pick.\u003Cbr>\r\n \r\n\u003Ctable class=\"sidearm-table\" style=\"border: 0 solid #fff;\" width=\"100%\">\r\n\t\u003Ctbody>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd colspan=\"8\" style=\"color: #000; background-color: #eee; padding: 5px; font-weight: bold;\">\u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=3967\" rel=\"smarttag\" rev=\"3967\">Jake Fromm\u003C\u002Fa>\u003C\u002Fdfn> (UGA Career)\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>\u003Cstrong>2017\u003C\u002Fstrong>\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>\u003Cstrong>Att\u003C\u002Fstrong>\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>\u003Cstrong>Cmp\u003C\u002Fstrong>\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>\u003Cstrong>TD\u003C\u002Fstrong>\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>\u003Cstrong>Int\u003C\u002Fstrong>\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>\u003Cstrong>Yds\u003C\u002Fstrong>\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>\u003Cstrong>Sk\u003C\u002Fstrong>\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>\u003Cstrong>Eff.\u003C\u002Fstrong>\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>ASU (W)\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>15\u0 round-color: #efefef;\">\r\n\t\t\t\u003Ctd>2019 TOTAL\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>174\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>123\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>9\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>3\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>1,406\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>0\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>99.5\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr style=\"background-color: #cccccc;\">\r\n\t\t\t\u003Ctd>CAREER TOTAL\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>771\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>510\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>63\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>16\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>6,770\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>40\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>162.7\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\u003C\u002Ftbody>\r\n\u003C\u002Ftable>\r\n \r\n\r\n\u003Cdiv class=\"position-title\">Pound The Rock\u003C\u002Fdiv>\r\n\u003Cbr>\r\nGeorgia is the only FBS team to have four different players go over 1,000 yards rushing during the 2017 and 2018 seasons. One of those from 2018 returns in Jr. \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=4015\" rel=\"smarttag\" rev=\"4015\">D'Andre Swift\u003C\u002Fa>\u003C\u002Fdfn>, who led the team with 1,049 and 10 touchdowns in 14 games last year with five starts. This season, Swift is averaging 6.8 yards\u002Fcarry on 110 attempts for 760 yards and seven TDs. He also has 13 rec. for 148 yds. and a score.\u003Cbr>\r\n\u003Cbr>\r\nMost recently, Swift earned SEC Offensive Player of the Week honors after carrying the ball 21 times for 179 yards (8.5 avg.) in the win over UK. This was the highest output for Swift since he piled up a career-high 186 on 17 carries during the win over No. 24 Auburn last year.\u003Cbr>\r\n\u003Cbr>\r\nHe now has seven career games with at least 100 yards, including a 104-yd. performance versus #9 Florida in 2018.\u003Cbr>\r\n\u003Cbr>\r\nAlong with Swift, Georgia's tailbacks who have shared the load include Sr. \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=3972\" rel=\"smarttag\" rev=\"3972\">Brian Herrien\u003C\u002Fa>\u003C\u002Fdfn>, So. \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=3957\" rel=\"smarttag\" rev=\"3957\">James Cook\u003C\u002Fa>\u003C\u002Fdfn> and RFr. \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=4024\" rel=\"smarttag\" rev=\"4024\">Zamir White\u003C\u002Fa>\u003C\u002Fdfn>. Five different Bulldog tailbacks have scored this season.\u003Cbr>\r\n\u003Cbr>\r\nFr. \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=4072\" rel=\"smarttag\" rev=\"4072\">Kenny McIntosh\u003C\u002Fa>\u003C\u002Fdfn> had a career long 62-yard TD run against Arkansas State and has also been active on special teams.\u003Cbr>\r\n\u003Cbr>\r\nHerrien got his first career start at VU and had 12 carries for 65 yards and a touchdown. He had a career high 88 yards on 11 carries at UT this year. White, who missed the 2018 season with an ACL injury and recovery, made his debut with five carries for 51 yards (10.2 avg.) with Bulldog fans chanting his nickname \"Zeus\" from the stadium seats at VU.\u003Cbr>\r\n \r\n\u003Cdiv class=\"position-title\">A Look At The Line\u003C\u002Fdiv>\r\n\u003Cbr>\r\nGeorgia's starting offensive line averages 6 feet, 5 inches and 328.6 pounds, making it the biggest unit in Bulldog history.\u003Cbr>\r\n\u003Cbr>\r\nGeorgia is ranked second nationally giving up only four sacks through seven games, including three of those versus USC.\u003Cbr>\r\n\u003Cbr>\r\nGeorgia leads the SEC at 237.1 rushing yards\u002Fgame.\u003Cbr>\r\n\u003Cbr>\r\nThe Bulldogs returned four of five starters, including All- American LT \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=4016\" rel=\"smarttag\" rev=\"4016\">Andrew Thomas\u003C\u002Fa>\u003C\u002Fdfn> and Freshman All-American RT \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=4026\" rel=\"smarttag\" rev=\"4026\">Isaiah Wilson\u003C\u002Fa>\u003C\u002Fdfn> and \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=3987\" rel=\"smarttag\" rev=\"3987\">Cade Mays\u003C\u002Fa>\u003C\u002Fdfn>, who lined up at guard and tackle last season and has continued that trend in 2019. The aforementioned trio is also joined by juniors \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=3983\" rel=\"smarttag\" rev=\"3983\">Solomon Kindley\u003C\u002Fa>\u003C\u002Fdfn> and \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=3955\" rel=\"smarttag\" rev=\"3955\">Ben Cleveland\u003C\u002Fa>\u003C\u002Fdfn> and sophomore \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=3974\" rel=\"smarttag\" rev=\"3974\">Trey Hill\u003C\u002Fa>\u003C\u002Fdfn>, who all had starts in 2018. Hill is the Bulldogs' starter at C.\u003Cbr>\r\n\u003Cbr>\r\nThomas was named the SEC Offensive Lineman of the Week following Georgia's dominating win over Vanderbilt. More recently he was named a Midseason All-American by several publications and sites.\u003Cbr>\r\n\u003Cbr>\r\nThis season, Wilson, Kindley and junior \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=4009\" rel=\"smarttag\" rev=\"4009\">Justin Shaffer\u003C\u002Fa>\u003C\u002Fdfn> have all missed time with injuries. Sophomore \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=4007\" rel=\"smarttag\" rev=\"4007\">Jamaree Salyer\u003C\u002Fa>\u003C\u002Fdfn> has also filled in during these absences.\u003Cbr>\r\n \r\n\u003Cdiv class=\"position-title\">Top Targets\u003C\u002Fdiv>\r\n\u003Cbr>\r\nGeorgia's leading receivers this year are freshman \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=4075\" rel=\"smarttag\" rev=\"4075\">George Pickens\u003C\u002Fa>\u003C\u002Fdfn> (23 rec.-318 yds.-2 TDs), graduate transfer \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=4061\" rel=\"smarttag\" rev=\"4061\">Lawrence Cager\u003C\u002Fa>\u003C\u002Fdfn> (19-245-3) and junior \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=4004\" rel=\"smarttag\" rev=\"4004\">Demetris Robertson\u003C\u002Fa>\u003C\u002Fdfn> (18-205-3). Cager, who completed his undergraduate degree at Miami (Fla.), sat out the Kentucky game with a rib cage injury that he sustained during the South Carolina game.\u003Cbr>\r\n\u003Cbr>\r\nPickens had career highs with seven catches for 98 yards versus the Gamecocks. Robertson had a career high five catches for 51 yards and a score in the game.\u003Cbr>\r\n\u003Cbr>\r\nFreshman \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=4060\" rel=\"smarttag\" rev=\"4060\">Dominick Blaylock\u003C\u002Fa>\u003C\u002Fdfn> (11-206-2) has also shined this season. Blaylock had his first career 100-yard game in the win over Arkansas State (4-112-1). He is also serving as the team's punt returner of late.\u003Cbr>\r\n\u003Cbr>\r\nSenior \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=4010\" rel=\"smarttag\" rev=\"4010\">Tyler Simmons\u003C\u002Fa>\u003C\u002Fdfn> (10-89-0) is the veteran of the group. Simmons finished with a career high four catches for 33 yards versus South Carolina.\u003Cbr>\r\n\u003Cbr>\r\nThe Bulldogs also have a pair of veteran tight ends in senior \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=4027\" rel=\"smarttag\" rev=\"4027\">Charlie Woerner\u003C\u002Fa>\u003C\u002Fdfn> and graduate transfer \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=4084\" rel=\"smarttag\" rev=\"4084\">Eli Wolf\u003C\u002Fa>\u003C\u002Fdfn> (Tennessee). Wolf has nine catches for 116 yards this season, including four for 73 against Murray State.\u003Cbr>\r\n \r\n\u003Cdiv class=\"position-title\">Defense Leading The Way\u003C\u002Fdiv>\r\n\u003Cbr>\r\nGeorgia leads the SEC in Scoring Defense at 10.6 points\u002F game (No. 5 nationally), Rushing Defense at 85.7 yds\u002Fg (No. 5 nationally) and in Total Defense at 266.7 yds\u002Fg (No. 7 nationally). The Bulldogs have allowed just 74 points in 2019 (eight TDs, six FGs).\u003Cbr>\r\n\u003Cbr>\r\nThe Bulldogs are the only team in the country yet to allow a rushing touchdown.\u003Cbr>\r\n\u003Cbr>\r\nThe defense has posted 18 scoreless quarters, including shutouts against Arkansas State (55-0) and Kentucky (21-0). In its last five games, Georgia has surrendered just 10 points in the second half, which includes a field goal in double overtime. The Bulldogs have outscored opponents in the second half 112-20, including 65-7 in the fourth quarter.\u003Cbr>\r\n\u003Cbr>\r\nMost recently, Georgia blanked the Wildcats, held them to 177 total yards, including only 17 passing, and only allowed them in the Red Zone once.\u003Cbr>\r\n\u003Cbr>\r\nGeorgia was trailing #7 Notre Dame 10-7 at the half (the touchdown allowed was on a five-play, 8-yard drive following a turnover) and held the Irish scoreless in the third quarter and just a touchdown in the final period in the 23-17 win.\u003Cbr>\r\n\u003Cbr>\r\nThrough the first three games, Georgia had 12 sacks. However, the Bulldogs have just four through their last four games. Currently, Georgia is 10th (16) in the league in sacks after totaling just 24 last year. Florida leads the league with 29 in eight games.\u003Cbr>\r\n \r\n\u003Cdiv class=\"position-title\">Up Front\u003C\u002Fdiv>\r\n\u003Cbr>\r\nThe personnel up front this season includes primarily \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=3960\" rel=\"smarttag\" rev=\"3960\">Jordan Davis\u003C\u002Fa>\u003C\u002Fdfn>, \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=3941\" rel=\"smarttag\" rev=\"3941\">Michael Barnett\u003C\u002Fa>\u003C\u002Fdfn>, \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=3954\" rel=\"smarttag\" rev=\"3954\">Tyler Clark\u003C\u002Fa>\u003C\u002Fdfn>, \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=3973\" rel=\"smarttag\" rev=\"3973\">Malik Herring\u003C\u002Fa>\u003C\u002Fdfn> and \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=4028\" rel=\"smarttag\" rev=\"4028\">Devonte Wyatt\u003C\u002Fa>\u003C\u002Fdfn>.\u003Cbr>\r\n\u003Cbr>\r\nThe Bulldogs had 15 hurries in the latest victory over Kentucky and kept the Wildcats to only two completions.\u003Cbr>\r\n\u003Cbr>\r\nClark finished with three tackles, including a tackle for loss on a 3rd-and-goal from the 2 yard line in double overtime, versus USC while Barnett led all interior linemen with five stops.\u003Cbr>\r\n\u003Cbr>\r\nThe Bulldogs held #7 Notre Dame to just 46 yards rushing and have still not allowed a rushing touchdown this season.\u003Cbr>\r\n \r\n\u003Cdiv class=\"position-title\">Reed Leading Defensive Backfield\u003C\u002Fdiv>\r\n\u003Cbr>\r\nGraduate \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=4001\" rel=\"smarttag\" rev=\"4001\">J.R. Reed\u003C\u002Fa>\u003C\u002Fdfn> and Jr. \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=3985\" rel=\"smarttag\" rev=\"3985\">Richard LeCounte\u003C\u002Fa>\u003C\u002Fdfn> are starting at the safety spots along with RSo. \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=4014\" rel=\"smarttag\" rev=\"4014\">Eric Stokes\u003C\u002Fa>\u003C\u002Fdfn> and Jr. \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=4063\" rel=\"smarttag\" rev=\"4063\">DJ Daniel\u003C\u002Fa>\u003C\u002Fdfn> on the corners. Jr. \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=4022\" rel=\"smarttag\" rev=\"4022\">Mark Webb\u003C\u002Fa>\u003C\u002Fdfn> and RFr. \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=4025\" rel=\"smarttag\" rev=\"4025\">Divaad Wilson\u003C\u002Fa>\u003C\u002Fdfn> also have a combined six starts in the backfield. Daniel has started the last four games for the injured So. \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=3952\" rel=\"smarttag\" rev=\"3952\">Tyson Campbell\u003C\u002Fa>\u003C\u002Fdfn>.\u003Cbr>\r\n\u003Cbr>\r\nReed is third on the team with 34 stops and LeCounte has 29 tackles so far this season and is fourth.\u003Cbr>\r\n\u003Cbr>\r\nWith a team-leading six tackles for his name, LeCounte recovered a fumble that Reed forced in the Kentucky game. That turnover set up Georgia's second touchdown.\u003Cbr>\r\n\u003Cbr>\r\nStokes rose to the occasion at Tennessee and had three tackles, including a sack and a forced fumble that turned into a touchdown, and three pass breakups.\u003Cbr>\r\n\u003Cbr>\r\nWith Campbell unavailable against #7 Notre Dame and Stokes leaving the game in the first series with a knee injury, Georgia leaned on Sr. \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=3989\" rel=\"smarttag\" rev=\"3989\">Tyrique McGhee\u003C\u002Fa>\u003C\u002Fdfn>, Wilson and Daniel on the corners. Wilson had his first career interception and an 11- yard return that set up a field goal. Daniel finished with five stops, including a TFL, and had the final pass breakup at the 7-yard line on fourth down with 0:48 to play.\u003Cbr>\r\n\u003Cbr>\r\nWebb forced his first fumble of the year and Reed picked it up and returned it 14 yards for a touchdown against Murray State.\u003Cbr>\r\n \r\n\u003Cdiv class=\"position-title\">Linebacker Leaders\u003C\u002Fdiv>\r\n\u003Cbr>\r\nLed by veteran linebackers \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=3959\" rel=\"smarttag\" rev=\"3959\">Tae Crowder\u003C\u002Fa>\u003C\u002Fdfn>, \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=4003\" rel=\"smarttag\" rev=\"4003\">Monty Rice\u003C\u002Fa>\u003C\u002Fdfn> and \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=3969\" rel=\"smarttag\" rev=\"3969\">Walter Grant\u003C\u002Fa>\u003C\u002Fdfn>, the Bulldogs have welcomed in a younger contingent of RFr. \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=3996\" rel=\"smarttag\" rev=\"3996\">Azeez Ojulari\u003C\u002Fa>\u003C\u002Fdfn>, So. \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=4017\" rel=\"smarttag\" rev=\"4017\">Channing Tindall\u003C\u002Fa>\u003C\u002Fdfn>, So. \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=3939\" rel=\"smarttag\" rev=\"3939\">Adam Anderson\u003C\u002Fa>\u003C\u002Fdfn>, JUCO transfer \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=4067\" rel=\"smarttag\" rev=\"4067\">Jermaine Johnson\u003C\u002Fa>\u003C\u002Fdfn> and Fr. \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=4077\" rel=\"smarttag\" rev=\"4077\">Nolan Smith\u003C\u002Fa>\u003C\u002Fdfn> and \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=4065\" rel=\"smarttag\" rev=\"4065\">Nakobe Dean\u003C\u002Fa>\u003C\u002Fdfn> along with So. \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=4020\" rel=\"smarttag\" rev=\"4020\">Quay Walker\u003C\u002Fa>\u003C\u002Fdfn>.\u003Cbr>\r\n\u003Cbr>\r\nDean and Walker came off the bench to each have a teamleading six stops in the shutout of Kentucky. Dean also forced his first fumble.\u003Cbr>\r\n\u003Cbr>\r\nRice and Crowder were co-leaders against South Carolina with a career high 12 tackles each. Crowder led Georgia with nine stops, including a TFL, against #7 Notre Dame. At Tennessee, Crowder scooped up a fumble following a sack by Stokes and returned in 60 yards for a touchdown.\u003Cbr>\r\n\u003Cbr>\r\nJohnson earned his first career start against Murray State and responded with four tackles, including a TFL.\u003Cbr>\r\n\u003Cbr>\r\nOjulari was the first freshman captain in the \u003Cdfn>\u003Ca href=\"\u002Fcoaches.aspx?rc=2592\" rel=\"smarttag\" rev=\"2592\">Kirby Smart\u003C\u002Fa>\u003C\u002Fdfn> era at UT and responded with a pair of sacks. He was limited to three games in 2018, including the 2019 Sugar Bowl, after recovering from a knee injury during his Sr. year at Marietta HS.\u003Cbr>\r\n \r\n\u003Cdiv class=\"position-title\">Blankenship One Of The Best\u003C\u002Fdiv>\r\n\u003Cbr>\r\n2019 Midseason All-American PK \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=3943\" rel=\"smarttag\" rev=\"3943\">Rodrigo Blankenship\u003C\u002Fa>\u003C\u002Fdfn> has tallied 66 points this year. His 9.4 points\u002Fgame ranks second in the SEC. He is 12-for-14 on FGs and 30-for-30 on PATs.\u003Cbr>\r\n\u003Cbr>\r\nHe has made three 50 yarders this year (@ VU, @ UT, SC).\u003Cbr>\r\n\u003Cbr>\r\nHe has been named the SEC Special Teams Player of the Week three times in 2019 (@ VU, vs. #7 ND, @ UT). *Named semifinalist of the 2019 William V. Campbell Trophy for his combined academic success, football performance and exemplary leadership.\u003Cbr>\r\n\u003Cbr>\r\nHas connected on a school record 184 consecutive PATs, which ranks second in SEC history. The SEC record is 198 (Daniel Carlson, Auburn, 2014-17). The NCAA record is 233 (Alex Trlica, Texas Tech, 2004-07).\u003Cbr>\r\n\u003Cbr>\r\nSet a Rose Bowl Game record by drilling a career-long 55-yard field goal during the 2OT win over #2 Oklahoma. His performance included a 38-yard FG in overtime. In the 2018 National Championship Game, he drilled a 51 yarder in overtime to give Georgia a 23-20 lead over #4 Alabama.\u003Cbr>\r\n\u003Cbr>\r\n\u003Cstrong>Career Highs For Blankenship\u003C\u002Fstrong>\u003Cbr>\r\nPoints: 17 (MU17; 4FG, 5PAT)\u003Cbr>\r\nPATs: 9 (2x, MUR19, UMASS18)\u003Cbr>\r\nFG Att: 5 (MU18)\u003Cbr>\r\nFG Made: 4 (UK16, MU17)\u003Cbr>\r\nFG Long: 55 (OU18)\u003Cbr>\r\nKO: 10 (MU17)\u003Cbr>\r\nKO Yards: 635 (MU17)\u003Cbr>\r\n\u003Cbr>\r\n\u003Cstrong>Blankenship Kicking Stats\u003C\u002Fstrong>\r\n\r\n\u003Ctable class=\"sidearm-table\" style=\"border: 0 solid #fff;\" width=\"100%\">\r\n\t\u003Ctbody>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>\u003Cstrong>Year\u003C\u002Fstrong>\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>\u003Cstrong>PAT\u003C\u002Fstrong>\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>\u003Cstrong>FG\u003C\u002Fstrong>\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>\u003Cstrong>LG\u003C\u002Fstrong>\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>\u003Cstrong>TP\u003C\u002Fstrong>\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>2016\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>26x26\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>14-18\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>49\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>68\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>2017\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>63x63\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>20-23\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>55\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>123\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>2018\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>65x65\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>19-23\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>53\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>122\u003C\u00 t\t\t\u003Ctd>2019\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>0-0\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>2-2\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>4-4\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>3-4\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>3-4\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>Total\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>2-2\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>24-24\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>15-18\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>18-26\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>6-8\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\u003C\u002Ftbody>\r\n\u003C\u002Ftable>\r\n \r\n\r\n\u003Cdiv class=\"position-title\">Camarda, Nixon, Walker Round Out Specialists\u003C\u002Fdiv>\r\n\u003Cbr>\r\nSophomore P \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=3951\" rel=\"smarttag\" rev=\"3951\">Jake Camarda\u003C\u002Fa>\u003C\u002Fdfn> has averaged 47.8 yards\u002F punt this season, which ranks fourth in the SEC. However, he is first in SEC games at 51.5. Overall, he has punted 22 times on the year, including a career long of 66 versus South Carolina.\u003Cbr>\r\n\u003Cbr>\r\nFor his career, he has eight punts of 60 or more yards, including a 65 yarder at Vanderbilt this season and two in the rain versus Kentucky.\u003Cbr>\r\n\u003Cbr>\r\nThe Bulldogs are using two snappers. Graduate transfer \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=4375\" rel=\"smarttag\" rev=\"4375\">Steven Nixon\u003C\u002Fa>\u003C\u002Fdfn> (punts) and RFr. \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=4019\" rel=\"smarttag\" rev=\"4019\">Payne Walker\u003C\u002Fa>\u003C\u002Fdfn> (FGs\u002FPATs) are sharing duties during their first year of action.\u003Cbr>\r\n \r\n\u003Cdiv class=\"position-title\">First-Time Starters In 2019\u003C\u002Fdiv>\r\n\u003Cbr>\r\nThe Bulldogs have had 12 first-time starters through their first three games.\u003Cbr>\r\n\u003Cbr>\r\n\u003Cstrong>@VU:\u003C\u002Fstrong> 4 (\u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=3996\" rel=\"smarttag\" rev=\"3996\">Azeez Ojulari\u003C\u002Fa>\u003C\u002Fdfn>, \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=3979\" rel=\"smarttag\" rev=\"3979\">Kearis Jackson\u003C\u002Fa>\u003C\u002Fdfn>, \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=3966\" rel=\"smarttag\" rev=\"3966\">John FitzPatrick\u003C\u002Fa>\u003C\u002Fdfn>, \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=3972\" rel=\"smarttag\" rev=\"3972\">Brian Herrien\u003C\u002Fa>\u003C\u002Fdfn>)\u003Cbr>\r\n\u003Cstrong>MUR:\u003C\u002Fstrong> 4 (\u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=4007\" rel=\"smarttag\" rev=\"4007\">Jamaree Salyer\u003C\u002Fa>\u003C\u002Fdfn>, \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=3984\" rel=\"smarttag\" rev=\"3984\">Matt Landers\u003C\u002Fa>\u003C\u002Fdfn>, \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=3957\" rel=\"smarttag\" rev=\"3957\">James Cook\u003C\u002Fa>\u003C\u002Fdfn>, \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=4067\" rel=\"smarttag\" rev=\"4067\">Jermaine Johnson\u003C\u002Fa>\u003C\u002Fdfn>)\u003Cbr>\r\n\u003Cstrong>ASU:\u003C\u002Fstrong> 1 (\u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=4061\" rel=\"smarttag\" rev=\"4061\">Lawrence Cager\u003C\u002Fa>\u003C\u002Fdfn>)\u003Cbr>\r\n\u003Cstrong>#7 ND:\u003C\u002Fstrong> 3 (\u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=4004\" rel=\"smarttag\" rev=\"4004\">Demetris Robertson\u003C\u002Fa>\u003C\u002Fdfn>, \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=4063\" rel=\"smarttag\" rev=\"4063\">DJ Daniel\u003C\u002Fa>\u003C\u002Fdfn>, \u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=4025\" rel=\"smarttag\" rev=\"4025\">Divaad Wilson\u003C\u002Fa>\u003C\u002Fdfn>)\u003Cbr>\r\n\u003Cstrong>@ UT:\u003C\u002Fstrong> 1 (\u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=4009\" rel=\"smarttag\" rev=\"4009\">Justin Shaffer\u003C\u002Fa>\u003C\u002Fdfn>)\u003Cbr>\r\n\u003Cstrong>UK:\u003C\u002Fstrong> 1 (\u003Cdfn>\u003Ca href=\"\u002Froster.aspx?rp_id=4075\" rel=\"smarttag\" rev=\"4075\">George Pickens\u003C\u002Fa>\u003C\u002Fdfn>)\u003Cbr
