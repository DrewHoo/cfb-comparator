ource-item" media="(min-width:540px)" srcset="https://images.sidearmdev.com/crop?url=https%3A%2F%2Fdxbhsrqyrr690.cloudfront.net%2Fsidearm.nextgen.sites%2Fusctrojans.com%2Fimages%2F2021%2F11%2F29%2Fusc_trojans_football_coach_lincoln_riley.jpg&amp;width=768&amp;height=432&amp;type=webp" type="image/jpeg"><!--]--><!--[--><source data-test-id="s-image-resized__source-item--webp" media="(min-width:0px)" srcset="https://images.sidearmdev.com/crop?url=https%3A%2F%2Fdxbhsrqyrr690.cloudfront.net%2Fsidearm.nextgen.sites%2Fusctrojans.com%2Fimages%2F2021%2F11%2F29%2Fusc_trojans_football_coach_lincoln_riley.jpg&amp;width=540&amp;height=304&amp;type=webp" type="image/webp"><source data-test-id="s-image-resized__source-item" media="(min-width:0px)" srcset="https://images.sidearmdev.com/crop?url=https%3A%2F%2Fdxbhsrqyrr690.cloudfront.net%2Fsidearm.nextgen.sites%2Fusctrojans.com%2Fimages%2F2021%2F11%2F29%2Fusc_trojans_football_coach_lincoln_riley.jpg&amp;width=540&amp;height=304&amp;type=webp" type="image/jpeg"><!--]--><!--]--><img data-test-id="s-image-resized__img" loading="eager" src="https://images.sidearmdev.com/crop?url=https%3A%2F%2Fdxbhsrqyrr690.cloudfront.net%2Fsidearm.nextgen.sites%2Fusctrojans.com%2Fimages%2F2021%2F11%2F29%2Fusc_trojans_football_coach_lincoln_riley.jpg&amp;width=540&amp;height=304&amp;type=webp" alt="Lincoln Riley Named New USC Football Head Coach" class="aspect-video w-full object-cover" style=""><!--]--></picture><!----></div><header class="border-theme-border-light mx-auto mb-8 w-full max-w-[900px] border-b p-6 text-center"><p aria-hidden="true" class="text-theme-safe-light mb-4 text-4xl font-bold leading-none">Lincoln Riley Named New USC Football Head Coach</p><!----><!----><p class="text-theme-safe-light text-base">11/28/2021</p></header><div class="c-story-blocks__wrapper grid grid-cols-1"><!--[--><div class="c-story-blocks__block-container my-0 mx-auto bg-cover" style="background-color:transparent;background-image:none;background-attachment:initial;background-position:top center;margin:0px 0px 30px 0px;"><div class="c-story-blocks__width-normal c-story-blocks__block mx-auto px-6" style="background-color: transparent;background-image: none;background-attachment: initial;background-position: top center;padding: calc(0px + 0px) calc(0px + 0px) calc(0px + 0px) calc(0px + 0px);"><div subblock="false" sportid="2"><!--[--><div class="flex w-full flex-col md:flex-row"><!--[--><div class="c-story-blocks__block-container my-0 mx-auto bg-cover m-0 flex-1" style="background-color:transparent;background-image:none;background-attachment:initial;background-position:top center;margin:0px 0px 60px 0px;"><div class="min-h-full w-full c-story-blocks__width-normal c-story-blocks__block mx-auto px-6" style="background-color: transparent;background-image: none;background-attachment: initial;background-position: top center;padding: calc(0px + 0px) calc(0px + 0px) calc(0px + 0px) calc(0px + 0px);"><div class="c-story-blocks__button-block__button-container text-center" subblock="true" sportid="0"><a href="https://usctrojans.com/feature/lincoln-riley" rel="noopener noreferrer" target="_self" data-s-nav-link class="c-story-blocks__button-block__button bg-primary text-on-primary hover:bg-primary-hover focus:bg-primary-hover inline-block rounded-[3px] no-underline transition-colors py-2 px-4 text-base"><!--[--><span>WATCH LIVE AT 3PM: PRESS CONFERENCE</span><!--]--></a></div></div></div><div class="c-story-blocks__block-container my-0 mx-auto bg-cover m-0 flex-1" style="background-color:transparent;background-image:none;background-attachment:initial;background-position:top center;margin:0px 0px 60px 0px;"><div class="min-h-full w-full c-story-blocks__width-normal c-story-blocks__block mx-auto px-6" style="background-color: transparent;background-image: none;background-attachment: initial;background-position: top center;padding: calc(0px + 0px) calc(0px + 0px) calc(0px + 0px) calc(0px + 0px);"><div class="c-story-blocks__button-block__button-container text-center" subblock="true" sportid="0"><a href="https://usctrojans.evenue.net/cgi-bin/ncommerce3/SEGetEventInfo?ticketCode=GS%3AIBM%3AF22%3ASD%3A&amp;linkID=usc&amp;shopperContext=&amp;pc=&amp;caller=&amp;appCode=&amp;RSRC=2122weB&amp;RDAT=FBrel" rel="noopener" target="_self" data-s-nav-link class="c-story-blocks__button-block__button bg-primary text-on-primary hover:bg-primary-hover focus:bg-primary-hover inline-block rounded-[3px] no-underline transition-colors py-2 px-4 text-base"><!--[--><span>PLACE SEASON TICKET DEPOSIT</span><!--]--></a></div></div></div><!--]--></div><!--]--></div></div></div><div class="c-story-blocks__block-container my-0 mx-auto bg-cover" style="background-color:transparent;background-image:none;background-attachment:initial;background-position:top center;margin:0px 0px 60px 0px;"><div class="c-story-blocks__width-normal c-story-blocks__block mx-auto px-6" style="background-color: transparent;background-image: none;background-attachment: initial;background-position: top center;padding: calc(0px + 0px) calc(0px + 0px) calc(0px + 0px) calc(0px + 0px);"><div class="prose max-w-none" subblock="false" sportid="2"><p><span style="color:inherit;"><strong>LOS ANGELES </strong>— <strong>Lincoln Riley</strong>, one of college football’s most successful young coaches who won 85 percent of his games in five seasons at Oklahoma and led the Sooners to four Big 12 titles and four New Year’s Six bowls with three College Football Playoff appearances, has been named the head coach at USC, athletic director <strong>Mike Bohn</strong> announced today (Nov. 28).&nbsp;</span></p><p><span style="color:inherit;">&nbsp;“We are ecstatic to announce Lincoln Riley as our new head coach and welcome his wife Caitlin and their daughters Sloan and Stella to the Trojan Family,” said Bohn. “Lincoln is the rarest combination of extraordinary person and elite football coach. His successes and offensive accolades as a head coach the past five years are astonishing. Lincoln will recruit relentlessly, develop his players on and off the field, and implement a strong culture in which the program will operate with the highest level of integrity and professionalism. &nbsp;</span></p><p><span style="color:inherit;">“Lincoln is universally considered one of the brightest and most talented football coaches in the nation, and the fact that he chose USC is a testament to the strength of our brand, the power of the Trojan Family, and the leadership of our university. This is for our current players, our former players, our alumni, our fans, and our entire university community. Our time is now.</span>”&nbsp;<span style="color:inherit;">&nbsp;</span></p><p><span style="color:inherit;">Said Riley:&nbsp; “I am truly excited to come to USC and join the Trojan Family as its new head football coach.&nbsp; USC has an unparalleled football tradition with tremendous resources and facilities, and the administration has made a deep commitment to winning.&nbsp; I look forward to honoring that successful tradition and building on it.&nbsp; The pieces are in place for us to build the program back to where it should be and the fans expect it to be.&nbsp; We will work hard to develop a physical football team that is dominant on both lines of scrimmage, and has a dynamic balanced offense and a stout aggressive defense.&nbsp;</span></p><p><span style="color:inherit;">“I want to thank the administration, coaches and players at Oklahoma for five incredible years as their head coach.&nbsp; We accomplished some great things there and I will always cherish my time as a Sooner.”&nbsp;</span></p><p><span style="color:black!important;">“Lincoln Riley is the perfect choice for our new head coach,” USC President Carol L. Folt said. “He is known for caring about the development and character of his players and winning at the highest level. Mike Bohn and I share a vision for the future of USC Athletics and hiring Coach Riley is a huge statement about where we are going as a program. I cannot wait to welcome Coach Riley and his family to Los Angeles and the Trojan Family.”</span><span style="color:inherit;">&nbsp;</span></p><p><span style="color:inherit;">Riley will immediately transition to USC. <strong>Donte Williams</strong> will remain USC’s interim head coach for the final week of the 2021 season, including this Saturday’s (Dec. 4) game at California.</span>&nbsp;</p><p><span style="color:inherit;">Information on Riley’s introductory press conference, tentatively scheduled for Monday (Nov. 29) at 3 p.m. PT, will be forthcoming.&nbsp;</span></p></div></div></div><div class="c-story-blocks__block-container my-0 mx-auto bg-cover" style="background-color:transparent;background-image:none;background-attachment:initial;background-position:top center;margin:0px 0px 60px 0px;"><div class="c-story-blocks__width-normal c-story-blocks__block mx-auto px-6" style="background-color: transparent;background-image: none;background-attachment: initial;background-position: top center;padding: calc(0px + 0px) calc(0px + 0px) calc(0px + 0px) calc(0px + 0px);"><div class="flex justify-center" subblock="false" sportid="2"><blockquote class="twitter-tweet" data-conversation="false" data-dnt="true" data-theme="light"><p lang="es" dir="ltr">?? Los Angeles<a href="https://twitter.com/LincolnRiley?ref_src=twsrc%5Etfw">@LincolnRiley</a> <a href="https://twitter.com/hashtag/FightOn?src=hash&amp;ref_src=twsrc%5Etfw">#FightOn</a>?? <a href="https://t.co/MKxN1FmlAP">pic.twitter.com/MKxN1FmlAP</a></p>&mdash; USC Football (@USC_FB) <a href="https://twitter.com/USC_FB/status/1465340453285416962?ref_src=twsrc%5Etfw">November 29, 2021</a></blockquote></div></div></div><div class="c-story-blocks__block-container my-0 mx-auto bg-cover" style="background-color:transparent;background-image:none;background-attachment:initial;background-position:top center;margin:0px 0px 60px 0px;"><div class="c-story-blocks__width-normal c-story-blocks__block mx-auto px-6" style="background-color: transparent;background-image: none;background-attachment: initial;background-position: top center;padding: calc(0px + 0px) calc(0px + 0px) calc(0px + 0px) calc(0px + 0px);"><div class="prose max-w-none" subblock="false" sportid="2"><p><span style="color:inherit;">The 38-year-old Riley posted a 55-10 overall record in his five years (2017-21) at Oklahoma for an impressive .846 winning percentage.&nbsp; His Sooners were 37-7 (.841) in league play and won Big 12 championships in his first four years there as he became the first person to win outright Football Bowl Subdivision conference crowns in each of his first four seasons as a collegiate head coach.&nbsp; He set Oklahoma records for most victories in his first two (24), three (36) and four (45) seasons, breaking marks held by Barry Switzer and Bob Stoops.&nbsp;</span></p><p><span style="color:inherit;">After serving as the offensive coordinator and quarterbacks coach for two of the most prolific offenses in OU’s history, Riley took over as the Sooners’ head coach in 2017 when Stoops retired.&nbsp; He was the youngest FBS head coach (33) at the time of his hiring.&nbsp; He also coached the OU quarterbacks and called the offensive plays while serving as head coach, running a balanced offensive attack.&nbsp;</span></p><p><span style="color:inherit;">Riley led his initial Oklahoma squad to a 12-2 overall record in 2017, becoming just the fifth FBS coach with no previous head coaching experience at a four-year college to win at least 12 games in his debut season.&nbsp; The Sooners won the Big 12 title by going 8-1, played in the CFP semifinal in the Rose Bowl and finished third in the final AP poll.&nbsp; Quarterback Baker Mayfield won the Heisman Trophy that season, along with the Maxwell, Davey O’Brien, Manning, Walter Camp Player of the Year and AP Player of the Year Awards, and was the No. 1 pick of the 2018 NFL Draft.&nbsp; Tight end Mark Andrews won the 2017 Mackey Award.&nbsp;</span></p><p><span style="color:inherit;">Oklahoma was again 12-2 overall and 8-1 while winning the Big 12 championships in 2018 and 2019.&nbsp; He was the Big 12 Co-Coach of the Year in 2018.&nbsp; Quarterback Kyler Murray won the 2018 Heisman Trophy, O’Brien Award and Manning Award, was the AP Player of the Year and was the No. 1 selection in the 2020 NFL Draft, while quarterback Jalen Hurts was the Heisman runner-up in 2019.&nbsp; The Sooners appeared in the Orange Bowl in 2018 and Peach Bowl in 2019, both CFP semifinals.&nbsp; OU was fourth in the final AP poll in 2018 and seventh in 2019.&nbsp;</span></p><p><span style="color:inherit;">In the COVID-impacted 2020 season, Oklahoma went 9-2 overall, won the Big 12 at 6-2, beat Florida in the Cotton Bowl and was sixth in the final AP poll. &nbsp;</span></p><p><span style="color:inherit;">In 2021, the Sooners were 10-2 in the just-completed regular season, tied for second in the Big 12 standings at 7-2 and are ranked 13th by AP.&nbsp;</span></p><p><span style="color:inherit;">Riley spent 2015 and 2016 as Oklahoma’s offensive coordinator and quarterbacks coach.&nbsp; He won the Broyles Award as the nation’s top assistant coach in 2015 when his offense ranked seventh nationally in total offense.&nbsp; In 2016, receiver Dede Westbrook won the Biletnikoff Award and was fourth in the Heisman voting, while running back Joe Mixon set the OU season all-purpose yardage record (2,331 yards) and fellow running back Samaje Perine set the school career rushing mark (4,122 yards).&nbsp;</span></p><p><span style="color:inherit;">Riley came to Oklahoma after five seasons (2010-14) as the offensive coordinator and quarterbacks coach at East Carolina.&nbsp; He added the title of assistant head coach in 2014.&nbsp; The Pirates, running a spread offensive scheme, set more than 50 team and individual school offensive records during his time there.&nbsp; His squads had the top five passing seasons in school history and top four total offense marks.&nbsp; In 2014, ECU set a school season mark with 6,929 yards of total offense.&nbsp; East Carolina appeared in the national Top 10 in such categories as passing and scoring offense, third down conversion percentage and red zone scoring efficiency.&nbsp; &nbsp;</span></p><p><span style="color:inherit;">His Pirate wide receivers Justin Hardy and Zay Jones became the most productive pass catchers in FBS history.&nbsp; Hardy caught an NCAA record 387 career passes for 4,541 yards (including a trio of 1,000-yard seasons).&nbsp; Jones, who Riley coached for the first two years of his career, went on to break Hardy’s mark with 399 career receptions.&nbsp;</span></p><p><span style="color:inherit;">&nbsp;East Carolina quarterback Dominique Davis was the 2010 Conference USA Newcomer of the Year and set school records for career completions and TD passes.&nbsp; He completed an NCAA record 36 consecutive passes in 2011.&nbsp; He was succeeded by Shane Carden, who broke many of Davis’ record.&nbsp; Carden set ECU season marks for passing yards (4,736 in 2014) and completion percentage (.705 in 2013) and was the Conference USA MVP in 2013 followed by the American Conference’s Offensive Player of the Year in 2014.&nbsp;</span></p><p><span style="color:inherit;">Riley was on the football and track teams at Muleshoe (Tex.) High, a West Texas town of 5,000.&nbsp; He was a walk-on quarterback at Texas Tech in the spring and summer of 2003 before starting his coaching career as a student assistant there under head coach Mike Leach for three seasons (2003-05), working with the offense.&nbsp; &nbsp;</span></p><p><span style="color:inherit;">He became an offensive graduate assistant at Texas Tech in 2006, then joined the Red Raiders’ fulltime staff as the wide receivers coach in 2007 and the inside wide receivers coach in 2008 and 2009.&nbsp; In 2009, he called plays as the interim offensive coordinator in the Alamo Bowl, producing 579 yards of offense.&nbsp; His wide receiver Michael Crabtree won the 2007 Biletnikoff Award while establishing Big 12 and NCAA freshman records with 134 receptions for 1,962 yards, while fellow wideout Danny Amendola also had a 100-catch, 1,000-yard season in 2007.&nbsp; The Red Raiders played in a bowl in each of his seven seasons and Tech quarterbacks won NCAA passing titles in 2003, 2004, 2005 and 2007.&nbsp; &nbsp;</span></p><p><span style="color:inherit;">Riley received his bachelor’s degree in exercise and sports science from Texas Tech in 2006.&nbsp;</span></p><p><span style="color:inherit;">He was born on Sept. 5, 1983, in Lubbock, Tex.&nbsp; He and his wife, Caitlin, have two daughters, Sloan and Stella.&nbsp; His younger brother, Garrett, is the offensive coordinator at SMU after previously coaching at Appalachian State, Kansas, East Carolina and Augustana College and playing quarterback at Texas Tech and Stephen F. Austin.</span></p></div></div></div><div class="c-story-blocks__block-container my-0 mx-auto bg-cover" style="background-color:transparent;background-image:url(https://dxbhsrqyrr690.cloudfront.net/sidearm.nextgen.sites/usctrojans.com/images/2019/9/4/usc_trojans_football_coliseum_fireworks.jpg);background-attachment:fixed;background-position:center center;margin:0px 0px 50px 0px;"><div class="c-story-blocks__width-wide c-story-blocks__block mx-auto px-6" style="background-color: transparent;background-image: none;background-attachment: fixed;background-position: center center;padding: calc(0px + 75px) calc(0px + 30px) calc(0px + 75px) calc(0px + 30px);"><div class="prose max-w-none" subblock="false" sportid="2"><p style="text-align:center;"><span class="text-big" style="background-color:hsl(0, 0%, 0%);color:#ffffff;"><strong>"Lincoln is universally considered one of the brightest and most talented football coaches in the nation, and the fact that he chose USC is a testament to the strength of our brand, the power of the Trojan Family, and the leadership of our university. This is for our current players, our former players, our alumni, our fans, and our entire university community. Our time is now."</strong></span></p><ul><li style="text-align:center;"><span class="text-big" style="background-color:hsl(0, 0%, 0%);color:#ffffff;"><strong>- USC Athletic Director Mike Bohn</strong></span></li></ul></div></div></div><div class="c-story-blocks__block-container my-0 mx-auto bg-cover" style="background-color:transparent;background-image:none;background-attachment:initial;background-position:top center;margin:0px 0px 60px 0px;"><div class="c-story-blocks__width-normal c-story-blocks__block mx-auto px-6" style="background-color: transparent;background-image: none;background-attachment: initial;background-position: top center;padding: calc(0px + 0px) calc(0px + 0px) calc(0px + 0px) calc(0px + 0px);"><div class="prose max-w-none" subblock="false" sportid="2"><h3 style="text-align:center;">REACTIONS</h3></div></div></div><div class="c-story-blocks__block-container my-0 mx-auto bg-cover" style="background-color:transparent;background-image:none;background-attachment:initial;background-position:top center;margin:0px 0px 60px 0px;"><div class="c-story-blocks__width-normal c-story-blocks__block mx-auto px-6" style="background-color: transparent;background-image: none;background-attachment: initial;background-position: top center;padding: calc(0px + 0px) calc(0px + 0px) calc(0px + 0px) calc(0px + 0px);"><div class="flex justify-center" subblock="false" sportid="2"><blockquote class="twitter-tweet" data-conversation="false" data-dnt="true" data-theme="light"><p lang="en" dir="ltr">CONGRATULATIONS to <a href="https://twitter.com/uscfootball?ref_src=twsrc%5Etfw">@uscfootball</a> on hiring LINCOLN RILEY!!!<br>WOWWWWW!!!!!!<br>Mike Bohn with a STATEMENT out west. <br>Congratulations Trojans!</p>&mdash; Kirk Herbstreit (@KirkHerbstreit) <a href="https://twitter.com/KirkHerbstreit/status/1465061216259346433?ref_src=twsrc%5Etfw">November 28, 2021</a></blockquote></div></div></div><div class="c-story-blocks__block-container my-0 mx-auto bg-cover" style="background-color:transparent;background-image:none;background-attachment:initial;background-position:top center;margin:0px 0px 60px 0px;"><div class="c-story-blocks__width-normal c-story-blocks__block mx-auto px-6" style="background-color: transparent;background-image: none;background-attachment: initial;background-position: top center;padding: calc(0px + 0px) calc(0px + 0px) calc(0px + 0px) calc(0px + 0px);"><div class="flex justify-center" subblock="false" sportid="2"><blockquote class="twitter-tweet" data-conversation="false" data-dnt="true" data-theme="light"><p lang="en" dir="ltr">Lincoln Riley to USC is exactly what College Football needs. He is a top 5 CFB coach.<br><br>Lincoln will land any top QB recruit by reminding them of Baker &amp; Kyler’s Heisman. The PAC 12 is wide open and Lincoln will put USC back on the map. <br><br>USC, it’s good to have you back.</p>&mdash; Emmanuel Acho (@EmmanuelAcho) <a href="https://twitter.com/EmmanuelAcho/status/1465063415638937604?ref_src=twsrc%5Etfw">November 28, 2021</a></blockquote></div></div></div><div class="c-story-blocks__block-container my-0 mx-auto bg-cover" style="background-color:transparent;background-image:none;background-attachment:initial;background-position:top center;margin:0px 0px 60px 0px;"><div class="c-story-blocks__width-normal c-story-blocks__block mx-auto px-6" style="background-color: transparent;background-image: none;background-attachment: initial;background-position: top center;padding: calc(0px + 0px) calc(0px + 0px) calc(0px + 0px) calc(0px + 0px);"><div class="flex justify-center" subblock="false" sportid="2"><blockquote class="twitter-tweet" data-conversation="false" data-dnt="true" data-theme="light"><p lang="en" dir="ltr">Lincoln Riley to LSU would have changed the SEC<br><br>Lincoln Riley to USC would change college football</p>&mdash; Peter Burns (@PeterBurnsESPN) <a href="https://twitter.com/PeterBurnsESPN/status/14650 age":12,"effect":504,"position":505,"width":506,"color":507,"opacity":508},"none","top center","match",{"hex":12,"hex8":12},255,{"top":161,"right":161,"bottom":510,"left":161},"60",{"top":161,"right":161,"bottom":161,"left":161},"basic_button_block","auto","top",{"text":516,"url":517,"size":501,"full_width":121,"id":518,"background":519,"margin":521,"padding":522,"type":512,"width":501,"section_height":513,"content_position":514,"show_dialog_delete":121},"PLACE SEASON TICKET DEPOSIT","https:\u002F\u002Fusctrojans.evenue.net\u002Fcgi-bin\u002Fncommerce3\u002FSEGetEventInfo?ticketCode=GS%3AIBM%3AF22%3ASD%3A&linkID=usc&shopperContext=&pc=&caller=&appCode=&RSRC=2122weB&RDAT=FBrel","d1018817-bd85-433a-82e8-d26d52f0671a",{"image_id":412,"image":12,"effect":504,"position":505,"width":506,"color":520,"opacity":508},{"hex":12,"hex8":12},{"top":161,"right":161,"bottom":510,"left":161},{"top":161,"right":161,"bottom":161,"left":161},"917ea770-c055-4718-a6ef-16b1915fb1ef",{"image_id":412,"image":12,"effect":504,"position":505,"width":506,"color":525,"opacity":508},{"hex":12,"hex8":12},{"top":161,"right":161,"bottom":527,"left":161},"30",{"top":161,"right":161,"bottom":161,"left":161},"structural_layout_block",{"text":531,"id":532,"background":533,"margin":535,"padding":536,"type":537,"width":501,"section_height":513,"content_position":514,"show_dialog_delete":121},"\u003Cp>\u003Cspan style=\"color:inherit;\">\u003Cstrong>LOS ANGELES \u003C\u002Fstrong>— \u003Cstrong>Lincoln Riley\u003C\u002Fstrong>, one of college football’s most successful young coaches who won 85 percent of his games in five seasons at Oklahoma and led the Sooners to four Big 12 titles and four New Year’s Six bowls with three College Football Playoff appearances, has been named the head coach at USC, athletic director \u003Cstrong>Mike Bohn\u003C\u002Fstrong> announced today (Nov. 28).&nbsp;\u003C\u002Fspan>\u003C\u002Fp>\u003Cp>\u003Cspan style=\"color:inherit;\">&nbsp;“We are ecstatic to announce Lincoln Riley as our new head coach and welcome his wife Caitlin and their daughters Sloan and Stella to the Trojan Family,” said Bohn. “Lincoln is the rarest combination of extraordinary person and elite football coach. His successes and offensive accolades as a head coach the past five years are astonishing. Lincoln will recruit relentlessly, develop his players on and off the field, and implement a strong culture in which the program will operate with the highest level of integrity and professionalism. &nbsp;\u003C\u002Fspan>\u003C\u002Fp>\u003Cp>\u003Cspan style=\"color:inherit;\">“Lincoln is universally considered one of the brightest and most talented football coaches in the nation, and the fact that he chose USC is a testament to the strength of our brand, the power of the Trojan Family, and the leadership of our university. This is for our current players, our former players, our alumni, our fans, and our entire university community. Our time is now.\u003C\u002Fspan>”&nbsp;\u003Cspan style=\"color:inherit;\">&nbsp;\u003C\u002Fspan>\u003C\u002Fp>\u003Cp>\u003Cspan style=\"color:inherit;\">Said Riley:&nbsp; “I am truly excited to come to USC and join the Trojan Family as its new head football coach.&nbsp; USC has an unparalleled football tradition with tremendous resources and facilities, and the administration has made a deep commitment to winning.&nbsp; I look forward to honoring that successful tradition and building on it.&nbsp; The pieces are in place for us to build the program back to where it should be and the fans expect it to be.&nbsp; We will work hard to develop a physical football team that is dominant on both lines of scrimmage, and has a dynamic balanced offense and a stout aggressive defense.&nbsp;\u003C\u002Fspan>\u003C\u002Fp>\u003Cp>\u003Cspan style=\"color:inherit;\">“I want to thank the administration, coaches and players at Oklahoma for five incredible years as their head coach.&nbsp; We accomplished some great things there and I will always cherish my time as a Sooner.”&nbsp;\u003C\u002Fspan>\u003C\u002Fp>\u003Cp>\u003Cspan style=\"color:black!important;\">“Lincoln Riley is the perfect choice for our new head coach,” USC President Carol L. Folt said. “He is known for caring about the development and character of his players and winning at the highest level. Mike Bohn and I share a vision for the future of USC Athletics and hiring Coach Riley is a huge statement about where we are going as a program. I cannot wait to welcome Coach Riley and his family to Los Angeles and the Trojan Family.”\u003C\u002Fspan>\u003Cspan style=\"color:inherit;\">&nbsp;\u003C\u002Fspan>\u003C\u002Fp>\u003Cp>\u003Cspan style=\"color:inherit;\">Riley will immediately transition to USC. \u003Cstrong>Donte Williams\u003C\u002Fstrong> will remain USC’s interim head coach for the final week of the 2021 season, including this Saturday’s (Dec. 4) game at California.\u003C\u002Fspan>&nbsp;\u003C\u002Fp>\u003Cp>\u003Cspan style=\"color:inherit;\">Information on Riley’s introductory press conference, tentatively scheduled for Monday (Nov. 29) at 3 p.m. PT, will be forthcoming.&nbsp;\u003C\u002Fspan>\u003C\u002Fp>","37493312-6457-422f-b246-1799723b366d",{"image_id":412,"image":12,"effect":504,"position":505,"width":506,"color":534,"opacity":508},{"hex":12,"hex8":12},{"top":161,"right":161,"bottom":510,"left":161},{"top":161,"right":161,"bottom":161,"left":161},"basic_text_block",{"tweet_align":539,"tweet_conversation":121,"tweet_do_not_track":7,"tweet_html":540,"tweet_theme":541,"id":542,"background":543,"margin":545,"padding":546,"type":547,"width":501,"section_height":513,"content_position":514,"show_dialog_delete":121},"center","\u003Cp lang=\"es\" dir=\"ltr\">?? Los Angeles\u003Ca href=\"https:\u002F\u002Ftwitter.com\u002FLincolnRiley?ref_src=twsrc%5Etfw\">@LincolnRiley\u003C\u002Fa> \u003Ca href=\"https:\u002F\u002Ftwitter.com\u002Fhashtag\u002FFightOn?src=hash&amp;ref_src=twsrc%5Etfw\">#FightOn\u003C\u002Fa>?? \u003Ca href=\"https:\u002F\u002Ft.co\u002FMKxN1FmlAP\">pic.twitter.com\u002FMKxN1FmlAP\u003C\u002Fa>\u003C\u002Fp>&mdash; USC Football (@USC_FB) \u003Ca href=\"https:\u002F\u002Ftwitter.com\u002FUSC_FB\u002Fstatus\u002F1465340453285416962?ref_src=twsrc%5Etfw\">November 29, 2021\u003C\u002Fa>","light","9332e4f4-05d4-4f8e-a5c0-192517a32bd3",{"image_id":412,"image":12,"effect":504,"position":505,"width":506,"color":544,"opacity":508},{"hex":12,"hex8":12},{"top":161,"right":161,"bottom":510,"left":161},{"top":161,"right":161,"bottom":161,"left":161},"social_twitter_tweet_block",{"text":549,"id":550,"background":551,"margin":553,"padding":554,"type":537,"width":501,"section_height":513,"content_position":514,"show_dialog_delete":121},"\u003Cp>\u003Cspan style=\"color:inherit;\">The 38-year-old Riley posted a 55-10 overall record in his five years (2017-21) at Oklahoma for an impressive .846 winning percentage.&nbsp; His Sooners were 37-7 (.841) in league play and won Big 12 championships in his first four years there as he became the first person to win outright Football Bowl Subdivision conference crowns in each of his first four seasons as a collegiate head coach.&nbsp; He set Oklahoma records for most victories in his first two (24), three (36) and four (45) seasons, breaking marks held by Barry Switzer and Bob Stoops.&nbsp;\u003C\u002Fspan>\u003C\u002Fp>\u003Cp>\u003Cspan style=\"color:inherit;\">After serving as the offensive coordinator and quarterbacks coach for two of the most prolific offenses in OU’s history, Riley took over as the Sooners’ head coach in 2017 when Stoops retired.&nbsp; He was the youngest FBS head coach (33) at the time of his hiring.&nbsp; He also coached the OU quarterbacks and called the offensive plays while serving as head coach, running a balanced offensive attack.&nbsp;\u003C\u002Fspan>\u003C\u002Fp>\u003Cp>\u003Cspan style=\"color:inherit;\">Riley led his initial Oklahoma squad to a 12-2 overall record in 2017, becoming just the fifth FBS coach with no previous head coaching experience at a four-year college to win at least 12 games in his debut season.&nbsp; The Sooners won the Big 12 title by going 8-1, played in the CFP semifinal in the Rose Bowl and finished third in the final AP poll.&nbsp; Quarterback Baker Mayfield won the Heisman Trophy that season, along with the Maxwell, Davey O’Brien, Manning, Walter Camp Player of the Year and AP Player of the Year Awards, and was the No. 1 pick of the 2018 NFL Draft.&nbsp; Tight end Mark Andrews won the 2017 Mackey Award.&nbsp;\u003C\u002Fspan>\u003C\u002Fp>\u003Cp>\u003Cspan style=\"color:inherit;\">Oklahoma was again 12-2 overall and 8-1 while winning the Big 12 championships in 2018 and 2019.&nbsp; He was the Big 12 Co-Coach of the Year in 2018.&nbsp; Quarterback Kyler Murray won the 2018 Heisman Trophy, O’Brien Award and Manning Award, was the AP Player of the Year and was the No. 1 selection in the 2020 NFL Draft, while quarterback Jalen Hurts was the Heisman runner-up in 2019.&nbsp; The Sooners appeared in the Orange Bowl in 2018 and Peach Bowl in 2019, both CFP semifinals.&nbsp; OU was fourth in the final AP poll in 2018 and seventh in 2019.&nbsp;\u003C\u002Fspan>\u003C\u002Fp>\u003Cp>\u003Cspan style=\"color:inherit;\">In the COVID-impacted 2020 season, Oklahoma went 9-2 overall, won the Big 12 at 6-2, beat Florida in the Cotton Bowl and was sixth in the final AP poll. &nbsp;\u003C\u002Fspan>\u003C\u002Fp>\u003Cp>\u003Cspan style=\"color:inherit;\">In 2021, the Sooners were 10-2 in the just-completed regular season, tied for second in the Big 12 standings at 7-2 and are ranked 13th by AP.&nbsp;\u003C\u002Fspan>\u003C\u002Fp>\u003Cp>\u003Cspan style=\"color:inherit;\">Riley spent 2015 and 2016 as Oklahoma’s offensive coordinator and quarterbacks coach.&nbsp; He won the Broyles Award as the nation’s top assistant coach in 2015 when his offense ranked seventh nationally in total offense.&nbsp; In 2016, receiver Dede Westbrook won the Biletnikoff Award and was fourth in the Heisman voting, while running back Joe Mixon set the OU season all-purpose yardage record (2,331 yards) and fellow running back Samaje Perine set the school career rushing mark (4,122 yards).&nbsp;\u003C\u002Fspan>\u003C\u002Fp>\u003Cp>\u003Cspan style=\"color:inherit;\">Riley came to Oklahoma after five seasons (2010-14) as the offensive coordinator and quarterbacks coach at East Carolina.&nbsp; He added the title of assistant head coach in 2014.&nbsp; The Pirates, running a spread offensive scheme, set more than 50 team and individual school offensive records during his time there.&nbsp; His squads had the top five passing seasons in school history and top four total offense marks.&nbsp; In 2014, ECU set a school season mark with 6,929 yards of total offense.&nbsp; East Carolina appeared in the national Top 10 in such categories as passing and scoring offense, third down conversion percentage and red zone scoring efficiency.&nbsp; &nbsp;\u003C\u002Fspan>\u003C\u002Fp>\u003Cp>\u003Cspan style=\"color:inherit;\">His Pirate wide receivers Justin Hardy and Zay Jones became the most productive pass catchers in FBS history.&nbsp; Hardy caught an NCAA record 387 career passes for 4,541 yards (including a trio of 1,000-yard seasons).&nbsp; Jones, who Riley coached for the first two years of his career, went on to break Hardy’s mark with 399 career receptions.&nbsp;\u003C\u002Fspan>\u003C\u002Fp>\u003Cp>\u003Cspan style=\"color:inherit;\">&nbsp;East Carolina quarterback Dominique Davis was the 2010 Conference USA Newcomer of the Year and set school records for career completions and TD passes.&nbsp; He completed an NCAA record 36 consecutive passes in 2011.&nbsp; He was succeeded by Shane Carden, who broke many of Davis’ record.&nbsp; Carden set ECU season marks for passing yards (4,736 in 2014) and completion percentage (.705 in 2013) and was the Conference USA MVP in 2013 followed by the American Conference’s Offensive Player of the Year in 2014.&nbsp;\u003C\u002Fspan>\u003C\u002Fp>\u003Cp>\u003Cspan style=\"color:inherit;\">Riley was on the football and track teams at Muleshoe (Tex.) High, a West Texas town of 5,000.&nbsp; He was a walk-on quarterback at Texas Tech in the spring and summer of 2003 before starting his coaching career as a student assistant there under head coach Mike Leach for three seasons (2003-05), working with the offense.&nbsp; &nbsp;\u003C\u002Fspan>\u003C\u002Fp>\u003Cp>\u003Cspan style=\"color:inherit;\">He became an offensive graduate assistant at Texas Tech in 2006, then joined the Red Raiders’ fulltime staff as the wide receivers coach in 2007 and the inside wide receivers coach in 2008 and 2009.&nbsp; In 2009, he called plays as the interim offensive coordinator in the Alamo Bowl, producing 579 yards of offense.&nbsp; His wide receiver Michael Crabtree won the 2007 Biletnikoff Award while establishing Big 12 and NCAA freshman records with 134 receptions for 1,962 yards, while fellow wideout Danny Amendola also had a 100-catch, 1,000-yard season in 2007.&nbsp; The Red Raiders played in a bowl in each of his seven seasons and Tech quarterbacks won NCAA passing titles in 2003, 2004, 2005 and 2007.&nbsp; &nbsp;\u003C\u002Fspan>\u003C\u002Fp>\u003Cp>\u003Cspan style=\"color:inherit;\">Riley received his bachelor’s degree in exercise and sports science from Texas Tech in 2006.&nbsp;\u003C\u002Fspan>\u003C\u002Fp>\u003Cp>\u003Cspan style=\"color:inherit;\">He was born on Sept. 5, 1983, in Lubbock, Tex.&nbsp; He and his wife, Caitlin, have two daughters, Sloan and Stella.&nbsp; His younger brother, Garrett, is the offensive coordinator at SMU after previously coaching at Appalachian State, Kansas, East Carolina and Augustana College and playing quarterback at Texas Tech and Stephen F. Austin.\u003C\u002Fspan>\u003C\u002Fp>","78905c65-97a0-4082-8cd4-3a1af5d7035d",{"image_id":412,"image":12,"effect":504,"position":505,"width":506,"color":552,"opacity":508},{"hex":12,"hex8":12},{"top":161,"right":161,"bottom":51
